version: v2
plugins:
  - local: [go, -C, packages/operator-api/go, tool, protoc-gen-go]
    out: packages/operator-api/go/operatorv1
    types:
      - supertag.operator.v1
    opt:
      - module=github.com/atemaguer/supertag/packages/operator-api/go/operatorv1
  - local: [go, -C, packages/operator-api/go, tool, protoc-gen-connect-go]
    out: packages/operator-api/go/operatorv1
    types:
      - supertag.operator.v1
    opt:
      - module=github.com/atemaguer/supertag/packages/operator-api/go/operatorv1
  - local: [node, scripts/protoc-gen-manifest-schema.mjs]
    out: spec/manifests
    strategy: all
    types:
      - supertag.operator.v1
  - local: [node, scripts/protoc-gen-operator-docs.mjs]
    out: docs/reference/operator-api
    strategy: all
    types:
      - supertag.operator.v1
