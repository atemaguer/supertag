# One team across three coding agents: a Claude Code lead, Codex builders, a Cursor builder,
# and a reviewer on a different model from the builders, so reviews get a second opinion.
#
# The host must serve every harness and model named here, for example in supertag.yaml:
#   harnesses: [claude-code, codex, cursor]
#   allow-unsandboxed-commands: [claude-code, cursor]
#   models: { claude-code: [claude-opus-5-5], codex: [gpt-6-sol], cursor: [claude-sonnet-5-5] }
# Cursor also needs CURSOR_API_KEY in ~/.supertag/.env.
#
# Before applying, replace:
#   my-laptop  with your Worker Host ID (`supertag ps`)
#   app        with your Workspace name (`supertag list workspace`)
# Then run: supertag apply -f organization.yaml
apiVersion: supertag/v1
kind: PermissionSet
metadata: { name: local-tools }
spec:
  permissions:
    - { target: runtime, action: commands:execute }
    - { target: runtime, action: files:write }
---
apiVersion: supertag/v1
kind: Workspace
metadata: { name: app }
spec:
  ref: main
  delivery: branch
  # setup: npm ci
---
apiVersion: supertag/v1
kind: Role
metadata: { name: Lead }
spec:
  purpose: Own Objectives for this repository. Plan the work, split it into bounded work Sessions for builders and the reviewer, and integrate and verify the results.
  instructions: >-
    Read the repository's contributing guide (AGENTS.md or CONTRIBUTING.md) before planning.
    Delegate implementation to builders with start_session, naming the builder's Tag, and do the integration yourself. Each work Session reports back to the Objective's conversation. Give each finished change to the reviewer the same way and send its findings back to the builder with continue_session. Accept work only on evidence:
    passing checks, new tests for new behavior, and no open high or medium findings. Then send the
    operator an owner report naming the commit to merge. Never change the repository's git
    configuration (.git/config, .git/info, hooks): SuperTag refuses to run Tasks in a repository
    whose git configuration changed.
  permissionSets: [local-tools]
  execution: { harness: claude-code, model: claude-opus-5-5, effort: [low, medium, high] }
---
apiVersion: supertag/v1
kind: Role
metadata: { name: Builder }
spec:
  purpose: Implement bounded changes to this repository with tests and docs.
  instructions: >-
    Follow the repository's contributing guide. Write tests first where practical. Run the
    project's checks and the affected tests before submitting, and report the exact commands and
    results as evidence. Never change the repository's git configuration. Resolve merge conflicts
    by editing the files and committing.
  permissionSets: [local-tools]
  # Each builder Tag picks its own harness and model below.
---
apiVersion: supertag/v1
kind: Role
metadata: { name: Reviewer }
spec:
  purpose: Review proposed changes for correctness, test coverage, and consistency with the repository's conventions.
  instructions: >-
    Read the diff and run the tests yourself. Report each defect as a finding with a severity and
    a file and line. Say plainly when a change is ready. Don't rewrite the change yourself.
  permissionSets: [local-tools]
  execution: { harness: claude-code, model: claude-opus-5-5, effort: [medium, high] }
---
apiVersion: supertag/v1
kind: Tag
metadata: { name: lead }
spec:
  roles: [Lead]
  workerHosts: [my-laptop]
---
apiVersion: supertag/v1
kind: Tag
metadata: { name: builder-codex-1 }
spec:
  roles: [Builder]
  workerHosts: [my-laptop]
  execution: { harness: codex, model: gpt-6-sol, effort: [low, medium, high] }
---
apiVersion: supertag/v1
kind: Tag
metadata: { name: builder-codex-2 }
spec:
  roles: [Builder]
  workerHosts: [my-laptop]
  execution: { harness: codex, model: gpt-6-sol, effort: [low, medium, high] }
---
apiVersion: supertag/v1
kind: Tag
metadata: { name: builder-cursor }
spec:
  roles: [Builder]
  workerHosts: [my-laptop]
  execution: { harness: cursor, model: claude-sonnet-5-5 }
---
apiVersion: supertag/v1
kind: Tag
metadata: { name: reviewer }
spec:
  roles: [Reviewer]
  workerHosts: [my-laptop]
