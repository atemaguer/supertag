# An outcome, not a task list: what must be true, how it will be checked, what must not change,
# and the limits. The lead plans the work and delivers it with its Team. Applying this file starts
# the lead. Apply organization.yaml first.
apiVersion: supertag/v1
kind: Objective
metadata: { name: usage-based-billing }
spec:
  ownerTagId: lead
  outcome: >-
    Move the product from seat-based to usage-based billing. Done when the reconciliation suite
    passes for the Starter, Team, and Enterprise plans, invoices for existing customers are
    unchanged until their next renewal, `npm test` and `npm run lint` pass on the integrated
    commit, and the reviewer and security reviewer have no open high or medium findings. Keep the
    public billing API compatible. A person approves the result before it merges.
  team: app-team
  budgetLimitMinor: 50000
  budgetCurrency: USD
  deadline: "2027-02-28T00:00:00Z"
