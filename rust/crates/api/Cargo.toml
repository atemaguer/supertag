[package]
name = "supertag-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-fixtures = []

[dependencies]
aws-credential-types = "1.2.14"
aws-sigv4 = { version = "1.4.2", default-features = false, features = ["sign-http", "http1"] }
anyhow.workspace = true
async-stream = "0.3"
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
libc.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
supertag-protocol.workspace = true
supertag-workspaces = { path = "../workspaces" }
tempfile.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util = { workspace = true, features = ["io"] }
tonic.workspace = true
tonic-health.workspace = true
tower-layer = "0.3"
tower-service = "0.3"
tracing = "0.1"
uuid.workspace = true

[dev-dependencies]
prost.workspace = true
prost-types = "0.14"
