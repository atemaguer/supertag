[package]
name = "supertag-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
test-fixtures = ["supertag-gateway/test-fixtures", "supertag-protocol/crash-points"]

[[bin]]
name = "supertag"
path = "src/main.rs"

[[bin]]
name = "supertag-fixture-adapter"
path = "fixtures/adapter.rs"
required-features = ["test-fixtures"]

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap.workspace = true
libc.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }
sha2.workspace = true
supertag-control-plane.workspace = true
supertag-codex-adapter.workspace = true
supertag-gateway.workspace = true
supertag-protocol.workspace = true
supertag-worker-host.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tonic-health.workspace = true
uuid.workspace = true

[dev-dependencies]
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures-util = { version = "0.3", features = ["sink"] }
hmac.workspace = true
reqwest.workspace = true
sqlx.workspace = true
supertag-shared-execution = { path = "../shared-execution" }
tokio-tungstenite = "0.28"
url = "2"

[[test]]
name = "crash_durability"
path = "tests/crash_durability.rs"
required-features = ["test-fixtures"]

