[package]
name = "supertag-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
test-fixtures = ["supertag-gateway/test-fixtures"]

[[bin]]
name = "supertag"
path = "src/main.rs"

[[bin]]
name = "supertag-fixture-adapter"
path = "fixtures/adapter.rs"
required-features = ["test-fixtures"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
libc.workspace = true
prost.workspace = true
serde_json.workspace = true
sha2.workspace = true
supertag-control-plane.workspace = true
supertag-codex-adapter.workspace = true
supertag-gateway.workspace = true
supertag-protocol.workspace = true
supertag-worker-host.workspace = true
tempfile.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tonic-health.workspace = true
uuid.workspace = true

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
futures-util = { version = "0.3", features = ["sink"] }
hmac.workspace = true
reqwest.workspace = true
sqlx.workspace = true
tokio-tungstenite = "0.28"

[[test]]
name = "split_runtime"
path = "tests/split_runtime.rs"
required-features = ["test-fixtures"]

[[test]]
name = "enrolled_runtime"
path = "tests/enrolled_runtime.rs"
required-features = ["test-fixtures"]

[[test]]
name = "slack_threads"
path = "tests/slack_threads.rs"
required-features = ["test-fixtures"]

[[test]]
name = "github_runtime"
path = "tests/github_runtime.rs"
required-features = ["test-fixtures"]

[[test]]
name = "workspace_runtime"
path = "tests/workspace_runtime.rs"
required-features = ["test-fixtures"]

[[test]]
name = "live_input_runtime"
path = "tests/live_input_runtime.rs"
required-features = ["test-fixtures"]

[[test]]
name = "language_runtime"
path = "tests/language_runtime.rs"
required-features = ["test-fixtures"]

[[test]]
name = "linear_runtime"
path = "tests/linear_runtime.rs"
required-features = ["test-fixtures"]

[[test]]
name = "lark_runtime"
path = "tests/lark_runtime.rs"
required-features = ["test-fixtures"]

[[test]]
name = "operator_runtime"
path = "tests/operator_runtime.rs"
required-features = ["test-fixtures"]
