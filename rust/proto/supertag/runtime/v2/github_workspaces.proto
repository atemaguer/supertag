syntax = "proto3";
package supertag.runtime.v2;

// Credential-free repository configuration. A Task receives an immutable copy.
service GithubWorkspaces {
  rpc Put(PutGithubWorkspaceRequest) returns (GithubWorkspace);
  rpc Get(GetGithubWorkspaceRequest) returns (GithubWorkspace);
  rpc List(ListGithubWorkspacesRequest) returns (ListGithubWorkspacesResponse);
  rpc Delete(DeleteGithubWorkspaceRequest) returns (DeleteGithubWorkspaceResponse);
}

message GithubWorkspaceSource {
  string account_id = 1;
  uint64 repository_id = 2;
  string repository = 3;
  // A full immutable SHA-1 Git commit. Empty selects revision/default branch.
  string commit_sha = 4;
  // Requested Git branch or tag. Omit with empty commit_sha for the default branch.
  optional string revision = 5;
  // Resolved branch/tag used to choose commit_sha. Set only by the trusted resolver.
  optional string resolved_revision = 6;
}
message GithubWorkspace {
  string workspace_id = 1;
  GithubWorkspaceSource source = 2;
  uint64 revision = 3;
  // Omit to retain local commit/patch delivery only.
  GithubPullRequestDelivery pull_request = 4;
}
message GithubPullRequestDelivery { string base_branch = 1; }
message PutGithubWorkspaceRequest {
  string operation_id = 1;
  GithubWorkspace workspace = 2;
  optional uint64 expected_revision = 3;
}
message GetGithubWorkspaceRequest { string workspace_id = 1; }
message ListGithubWorkspacesRequest { string after_id = 1; uint32 limit = 2; }
message ListGithubWorkspacesResponse {
  repeated GithubWorkspace workspaces = 1;
  string next_cursor = 2;
}
message DeleteGithubWorkspaceRequest {
  string operation_id = 1;
  string workspace_id = 2;
  uint64 expected_revision = 3;
}
message DeleteGithubWorkspaceResponse {}

// Internal Control Plane API used only by its configured GitHub source reader.
service GithubSourceResolver {
  rpc ListPending(ListPendingGithubSourcesRequest) returns (ListPendingGithubSourcesResponse);
  rpc Pin(PinGithubSourceRequest) returns (GithubSourcePin);
}
message GithubSourcePin {
  string pin_id = 1;
  string tag_id = 2;
  string session_id = 3;
  GithubWorkspace selector = 4;
  string selector_digest = 5;
  GithubWorkspace resolved = 6;
  uint64 created_order = 7;
}
message ListPendingGithubSourcesRequest {
  uint64 after_order = 1;
  uint32 limit = 2;
}
message ListPendingGithubSourcesResponse {
  repeated GithubSourcePin pins = 1;
  uint64 next_after_order = 2;
}
message PinGithubSourceRequest {
  string pin_id = 1;
  string selector_digest = 2;
  string resolved_revision = 3;
  string commit_sha = 4;
}
