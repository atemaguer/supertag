syntax = "proto3";
package supertag.runtime.v2;
import "supertag/runtime/v2/runtime.proto";

// Worker Host placement. Labels narrow the hosts bound to a Tag; they never
// grant access, and a Task that no bound host can take waits.
service Placement {
  // Replaces a Tag's runsOn labels. An empty list means any bound host.
  rpc SetTagRunsOn(SetTagRunsOnRequest) returns (Tag);
  // Explains which bound Worker Hosts can take a Task, and why the others cannot.
  rpc DiagnoseTask(DiagnoseTaskPlacementRequest) returns (TaskPlacementDiagnosis);
}

// Auth Key lifecycle beyond creation. Keys are named by the operator, and a
// name is never reused. Revocation blocks new joins, including replays of
// earlier joins; hosts that already joined keep their enrollment.
service AuthKeys {
  rpc RevokeAuthKey(RevokeAuthKeyRequest) returns (AuthKey);
  // Revoked, expired and used keys included, the earliest created first, then by name.
  rpc ListAuthKeys(ListAuthKeysRequest) returns (ListAuthKeysResponse);
  rpc GetAuthKey(GetAuthKeyRequest) returns (AuthKey);
}

message RevokeAuthKeyRequest { string name = 1; }

message GetAuthKeyRequest { string name = 1; }

message ListAuthKeysRequest {
  // At most this many keys; 0 means 100. At most 500.
  uint32 limit = 1;
  // The name of the last key on the previous page.
  string cursor = 2;
}

message ListAuthKeysResponse {
  repeated AuthKey auth_keys = 1;
  string next_cursor = 2;
}

// An enrolled Worker Host's own credential. Only its SHA-256 digest is stored;
// the caller generates the secret, so the Control Plane never receives it.
service HostCredentials {
  // Replaces the host's credential. The previous credential stops working at
  // once. A revoked host must be enrolled under a new ID instead.
  rpc RotateHostCredential(RotateHostCredentialRequest) returns (HostCredentialRotation);
}

message RotateHostCredentialRequest {
  string host_id = 1;
  // The host's current credential_revision. A repeat of a rotation that already
  // applied, with the same digest, returns the same result.
  uint64 expected_credential_revision = 2;
  bytes token_digest = 3;
}

message HostCredentialRotation {
  string host_id = 1;
  uint64 credential_revision = 2;
}

message SetTagRunsOnRequest {
  string tag_id = 1;
  repeated string runs_on = 2;
}

message DiagnoseTaskPlacementRequest { string task_id = 1; }

message HostPlacement {
  string host_id = 1;
  HostPhase phase = 2;
  repeated string labels = 3;
  // Required labels this host does not carry.
  repeated string missing_labels = 4;
  // Carries every required label. Readiness, capacity and harness still apply.
  bool eligible = 5;
}

message TaskPlacementDiagnosis {
  string task_id = 1;
  string tag_id = 2;
  TaskState state = 3;
  // The Tag's runsOn, plus workspace:NAME for a Task in a Workspace.
  repeated string required_labels = 4;
  // Labels no bound host carries; every required label when each exists on
  // some bound host but none carries them all.
  repeated string missing_labels = 5;
  // A scheduling requirement such as labels:macos,gpu. Empty when a bound
  // host carries every required label.
  string requirement = 6;
  // A readable explanation, or empty when a bound host carries every label.
  string summary = 7;
  // Bound, unrevoked Worker Hosts in host ID order.
  repeated HostPlacement hosts = 8;
}
