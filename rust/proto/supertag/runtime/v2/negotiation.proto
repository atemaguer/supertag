syntax = "proto3";

package supertag.runtime.v2;

// Each service and operator connection begins with this exchange. A peer that
// shares no protocol version, or that connects in the wrong role, is refused
// before it can register, claim, forward work, or make an operator call. The
// exchange carries no credentials.
//
// After negotiating, the client sends the selected version in the
// `x-supertag-protocol` metadata header on every other call. The Control Plane
// and Gateway refuse a call without it, or naming a version they do not
// speak, with FAILED_PRECONDITION. Only this service and the standard gRPC
// health service are exempt.
service ProtocolNegotiation {
  rpc Negotiate(NegotiateProtocolRequest) returns (NegotiateProtocolResponse);
}

enum ServiceRole {
  SERVICE_ROLE_UNSPECIFIED = 0;
  SERVICE_ROLE_CONTROL_PLANE = 1;
  SERVICE_ROLE_GATEWAY = 2;
  SERVICE_ROLE_WORKER_HOST = 3;
  // An operator client: the CLI, the TUI, the desktop app, or an SDK client.
  SERVICE_ROLE_OPERATOR = 4;
}

message NegotiateProtocolRequest {
  // The connecting service's role.
  ServiceRole role = 1;
  // Every protocol version the connecting service can speak.
  repeated uint32 protocol_versions = 2;
  // The connecting service's release, for diagnostics only.
  string build_version = 3;
}

message NegotiateProtocolResponse {
  // The answering service's role.
  ServiceRole role = 1;
  // The highest protocol version both services speak.
  uint32 protocol_version = 2;
  // Every protocol version the answering service can speak.
  repeated uint32 protocol_versions = 3;
  string build_version = 4;
}
