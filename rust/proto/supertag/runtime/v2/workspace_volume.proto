syntax = "proto3";
package supertag.runtime.v2;
import "supertag/runtime/v2/runtime.proto";

// Configured file data sources. Artifact Volumes are managed separately.
service WorkspaceVolumes {
  rpc Put(PutWorkspaceVolumeRequest) returns (WorkspaceVolume);
  rpc Get(GetWorkspaceVolumeRequest) returns (WorkspaceVolume);
}
message PutWorkspaceVolumeRequest {
  string volume_id = 1;
  string source = 2;
  // Zero creates the Volume. Updates require its current revision.
  uint64 expected_revision = 3;
}
message GetWorkspaceVolumeRequest { string volume_id = 1; }

// The Control Plane checks the live Attempt before disclosing
// file artifact Volume paths to its trusted Worker Host for alias rejection.
service AttemptWorkspaceMounts {
  rpc Preflight(InspectAttemptRequest) returns (WorkspaceMountPreflight);
}
message WorkspaceMountPreflight {
  repeated string protected_file_sources = 1;
}
