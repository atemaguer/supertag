  uint64 publication_revision = 2;
  string consumption_id = 3;
  uint64 consumption_revision = 4;
  string source_objective_id = 5;
  string destination_objective_id = 6;
}

// A stable owner ID survives a Gateway restart with the same private state, so
// the restarted process reclaims at once. Any other owner waits for release or expiry.
message ClaimConnectorRequest { string owner_id = 1; }
message RenewConnectorRequest { string lease_token = 1; }
message ReleaseConnectorRequest { string lease_token = 1; }
message ReleaseConnectorResponse {}
message ConnectorLease {
  bool granted = 1;
  string lease_token = 2;
  uint64 fence = 3;
  uint64 valid_for_ms = 4;
  // Set when another owner holds the account.
  uint64 retry_after_ms = 5;
}
