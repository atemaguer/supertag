syntax = "proto3";

package supertag.runtime.v2;

// The Gateway exposes these services to operators and enrolled hosts. The
// Control Plane serves the same messages on a private authenticated listener.
service Operator {
  rpc CreateAuthKey(CreateAuthKeyRequest) returns (AuthKey);
  rpc RevokeHost(RevokeHostRequest) returns (HostRecord);
  rpc PutTag(PutTagRequest) returns (Tag);
  rpc SubmitTask(SubmitTaskRequest) returns (Task);
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc ListNativeUsage(ListNativeUsageRequest) returns (ListNativeUsageResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc CancelTask(CancelTaskRequest) returns (Task);
  rpc ResolveAttempt(ResolveAttemptRequest) returns (AttemptResolution);
}

service Objectives {
  rpc CreateObjective(CreateObjectiveRequest) returns (Objective);
  rpc GetObjective(GetObjectiveRequest) returns (Objective);
  rpc ListObjectives(ListObjectivesRequest) returns (ListObjectivesResponse);
  rpc SetLimits(SetObjectiveLimitsRequest) returns (Objective);
  rpc PauseObjective(ObjectiveActionRequest) returns (Objective);
  rpc ResumeObjective(ObjectiveActionRequest) returns (Objective);
  rpc CancelObjective(ObjectiveActionRequest) returns (Objective);
  rpc ReviewObjective(ReviewObjectiveRequest) returns (Objective);
}

service WorkerHost {
  rpc RegisterHost(RegisterHostRequest) returns (HostRecord);
  rpc ClaimTask(ClaimTaskRequest) returns (ClaimTaskResponse);
  rpc StartTask(StartTaskRequest) returns (Task);
  rpc InspectAttempt(InspectAttemptRequest) returns (Task);
  rpc RenewAttempt(InspectAttemptRequest) returns (AttemptAuthority);
  rpc GetAttemptResolution(InspectAttemptRequest) returns (GetAttemptResolutionResponse);
  rpc ReportAttemptUsage(ReportAttemptUsageRequest) returns (ReportAttemptUsageResponse);
  rpc AppendEvent(AppendEventRequest) returns (TaskEvent);
  rpc FinishTask(FinishTaskRequest) returns (Task);
}

// Operator commands and durable history for input directed into a running Task.
service LiveInputs {
  rpc QueueInput(QueueInputRequest) returns (LiveInput);
  rpc GetInput(GetInputRequest) returns (LiveInput);
  rpc ResolveInput(ResolveInputRequest) returns (LiveInput);
}

// A separate lane for Worklets to take input and record native delivery evidence.
service AttemptInputs {
  rpc TakeInput(TakeInputRequest) returns (TakeInputResponse);
  rpc SettleInput(SettleInputRequest) returns (LiveInput);
}

// A one-time Auth Key authorizes enrollment for one designated Worker Host.
service HostEnrollment {
  rpc EnrollHost(EnrollHostRequest) returns (HostRecord);
}

// Private Gateway-to-Control-Plane service for enrollment and authentication.
service HostDirectory {
  rpc Enroll(PrivateEnrollHostRequest) returns (HostRecord);
  rpc Authenticate(AuthenticateHostRequest) returns (HostRecord);
}

// Private Gateway-to-Control-Plane operations. The authenticated connector
// principal identifies the account. Provider request bodies cannot select it.
service Connector {
  rpc AcceptEvent(AcceptEventRequest) returns (Task);
  rpc AcceptSlackEvent(AcceptSlackEventRequest) returns (AcceptSlackEventResponse);
  rpc ClaimReply(ClaimReplyRequest) returns (ClaimReplyResponse);
  rpc SettleReply(SettleReplyRequest) returns (Reply);
}

// Public, attempt-authorized transfer of native Session checkpoints.
service Transfers {
  rpc UploadCheckpoint(stream CheckpointUpload) returns (CheckpointReference);
  rpc DownloadCheckpoint(InspectAttemptRequest) returns (stream CheckpointDownload);
  rpc UploadWorkspace(stream WorkspaceUpload) returns (WorkspaceDeliveryReference);
  rpc DownloadWorkspace(InspectAttemptRequest) returns (stream WorkspaceDownload);
  rpc DownloadWorkspaceArtifact(GetWorkspaceArtifactRequest) returns (stream WorkspaceDownload);
}

// Private authorization and commit for bytes stored by the Gateway.
service CheckpointDirectory {
  rpc GetCheckpoint(InspectAttemptRequest) returns (GetCheckpointResponse);
  rpc ReserveCheckpoint(CommitCheckpointRequest) returns (CheckpointReference);
  rpc CommitCheckpoint(CommitCheckpointRequest) returns (CheckpointReference);
}

// Private authorization and commit for work product stored by the Gateway.
service WorkspaceDirectory {
  rpc GetContinuation(InspectAttemptRequest) returns (WorkspaceContinuation);
  rpc ReserveDelivery(WorkspaceDeliveryRequest) returns (WorkspaceDeliveryReference);
  rpc CommitDelivery(WorkspaceDeliveryRequest) returns (WorkspaceDeliveryReference);
  rpc GetArtifact(GetWorkspaceArtifactRequest) returns (WorkspaceDeliveryReference);
}

// An adapter connects only to its supervising Worker Host. The launch pipe
// provides its endpoint and an execution-scoped credential.
service Harness {
  rpc Attach(HarnessAttachRequest) returns (HarnessRun);
  rpc TakeLiveInput(HarnessTakeLiveInputRequest) returns (TakeInputResponse);
  rpc SettleLiveInput(HarnessSettleLiveInputRequest) returns (LiveInput);
  rpc Publish(HarnessPublishRequest) returns (TaskEvent);
  rpc ReportUsage(HarnessUsageRequest) returns (ReportAttemptUsageResponse);
  rpc Complete(HarnessCompleteRequest) returns (HarnessCompleteResponse);
}

enum LiveInputState {
  LIVE_INPUT_STATE_UNSPECIFIED = 0;
  LIVE_INPUT_STATE_PENDING = 1;
  LIVE_INPUT_STATE_DISPATCHING = 2;
  LIVE_INPUT_STATE_ACCEPTED = 3;
  LIVE_INPUT_STATE_REJECTED = 4;
  LIVE_INPUT_STATE_UNKNOWN = 5;
  LIVE_INPUT_STATE_WITHDRAWN = 6;
  LIVE_INPUT_STATE_FAILED = 7;
  LIVE_INPUT_STATE_RETRIED = 8;
}

enum LiveInputDecision {
  LIVE_INPUT_DECISION_UNSPECIFIED = 0;
  LIVE_INPUT_DECISION_FAIL = 1;
  LIVE_INPUT_DECISION_RETRY = 2;
}

enum LiveInputReceipt {
  LIVE_INPUT_RECEIPT_UNSPECIFIED = 0;
  LIVE_INPUT_RECEIPT_ACCEPTED = 1;
  LIVE_INPUT_RECEIPT_REJECTED = 2;
  LIVE_INPUT_RECEIPT_UNKNOWN = 3;
  LIVE_INPUT_RECEIPT_WITHDRAWN = 4;
}

message QueueInputRequest {
  string task_id = 1;
  string operation_id = 2;
  string text = 3;
}

message GetInputRequest {
  string input_id = 1;
}

message ResolveInputRequest {
  string input_id = 1;
  string operation_id = 2;
  LiveInputDecision decision = 3;
  string evidence = 4;
}

message LiveInput {
  string input_id = 1;
  string task_id = 2;
  string attempt_id = 3;
  string follower_task_id = 4;
  string text = 5;
  LiveInputState state = 6;
  uint64 order = 7;
}

message TakeInputRequest {
  InspectAttemptRequest attempt = 1;
}

message TakeInputResponse {
  LiveInput input = 1;
  uint64 valid_for_ms = 2;
}

message HarnessTakeLiveInputRequest {}

message HarnessSettleLiveInputRequest {
  string input_id = 1;
  LiveInputReceipt receipt = 2;
}

message SettleInputRequest {
  InspectAttemptRequest attempt = 1;
  string input_id = 2;
  LiveInputReceipt receipt = 3;
}

message CreateAuthKeyRequest {
  string host_id = 1;
  string operation_id = 2;
  bytes key_digest = 3;
  uint64 expires_in_ms = 4;
  repeated string allowed_tag_ids = 5;
  bool all_tags = 6;
}

message AuthKey {
  string host_id = 1;
  int64 expires_at_ms = 2;
  repeated string allowed_tag_ids = 3;
  bool all_tags = 4;
}

message RevokeHostRequest {
  string host_id = 1;
}

message RegisterHostRequest {
  string incarnation_id = 1;
}

message HostRecord {
  string host_id = 1;
  uint64 generation = 2;
  bool revoked = 3;
}

message EnrollHostRequest {
  string host_id = 1;
  string operation_id = 2;
  bytes token_digest = 3;
}

message PrivateEnrollHostRequest {
  EnrollHostRequest enrollment = 1;
  bytes key_digest = 2;
}

message AuthenticateHostRequest {
  bytes token_digest = 1;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_QUEUED = 1;
  TASK_STATE_RUNNING = 2;
  TASK_STATE_SUCCEEDED = 3;
  TASK_STATE_FAILED = 4;
  TASK_STATE_CANCELLED = 5;
  TASK_STATE_CLAIMED = 6;
  TASK_STATE_UNCERTAIN = 7;
}

message PutTagRequest {
  string tag_id = 1;
  string instructions = 2;
  repeated string allowed_actions = 3;
  WorkspaceSpec workspace = 4;
}

message Tag {
  string tag_id = 1;
  string instructions = 2;
  repeated string allowed_actions = 3;
  uint64 revision = 4;
  WorkspaceSpec workspace = 5;
}

message SubmitTaskRequest {
  string tag_id = 1;
  string session_id = 2;
  string operation_id = 3;
  string prompt = 4;
}

message Task {
  string task_id = 1;
  string tag_id = 2;
  string session_id = 3;
  string prompt = 4;
  string instructions = 5;
  repeated string allowed_actions = 6;
  uint64 tag_revision = 7;
  TaskState state = 8;
  optional string result = 9;
  optional string attempt_id = 10;
  WorkspaceSpec workspace = 11;
  WorkspaceDeliveryReference workspace_delivery = 12;
}

message GetTaskRequest {
  string task_id = 1;
}

message ListEventsRequest {
  string task_id = 1;
  uint64 after_sequence = 2;
  uint32 limit = 3;
}

message ListEventsResponse {
  repeated TaskEvent events = 1;
}

message CancelTaskRequest {
  string task_id = 1;
}

message ClaimTaskRequest {
  string operation_id = 1;
  repeated string workspace_ids = 2;
}

message ClaimTaskResponse {
  Assignment assignment = 1;
}

message Assignment {
  Task task = 1;
  string attempt_id = 2;
  string lease_token = 3;
}

message StartTaskRequest {
  string task_id = 1;
  string attempt_id = 2;
  string lease_token = 3;
}

message InspectAttemptRequest {
  string task_id = 1;
  string attempt_id = 2;
  string lease_token = 3;
}

message AttemptAuthority {
  Task task = 1;
  uint64 valid_for_ms = 2;
}

enum AttemptDecision {
  ATTEMPT_DECISION_UNSPECIFIED = 0;
  ATTEMPT_DECISION_FAILED = 1;
  ATTEMPT_DECISION_RETRY = 2;
}

message ResolveAttemptRequest {
  string task_id = 1;
  string attempt_id = 2;
  string operation_id = 3;
  AttemptDecision decision = 4;
  string evidence = 5;
  bool confirmed_stopped = 6;
}

message AttemptResolution {
  string task_id = 1;
  string attempt_id = 2;
  AttemptDecision decision = 3;
  string operator_id = 4;
  string evidence = 5;
  int64 resolved_at_ms = 6;
}

message GetAttemptResolutionResponse {
  AttemptResolution resolution = 1;
}

message ReportAttemptUsageRequest {
  InspectAttemptRequest attempt = 1;
  uint64 sequence = 2;
  optional uint64 amount_minor = 3;
  optional string currency = 4;
  bool estimated = 5;
  NativeTokenUsage native_usage = 6;
}

message ReportAttemptUsageResponse {}

message NativeTokenUsage {
  uint64 input_tokens = 1;
  uint64 cached_input_tokens = 2;
  uint64 output_tokens = 3;
  optional string observed_model = 4;
}

message ListNativeUsageRequest {
  string task_id = 1;
  string attempt_id = 2;
  uint64 after_sequence = 3;
  uint32 limit = 4;
}

message ListNativeUsageResponse {
  repeated HarnessUsageRequest reports = 1;
}

message HarnessUsageRequest {
  uint64 sequence = 1;
  NativeTokenUsage native_usage = 2;
}

message AppendEventRequest {
  string task_id = 1;
  string attempt_id = 2;
  string lease_token = 3;
  uint64 sequence = 4;
  string text = 5;
}

message TaskEvent {
  uint64 sequence = 1;
  string text = 2;
}

message FinishTaskRequest {
  string task_id = 1;
  string attempt_id = 2;
  string lease_token = 3;
  string result = 4;
  bool succeeded = 5;
  ObjectiveSignal objective_signal = 6;
  optional string checkpoint_sha256 = 7;
  WorkspaceDeliveryReference workspace_delivery = 8;
}

message HarnessAttachRequest {}

message AdapterBootstrap {
  string endpoint = 1;
  string token = 2;
}

message HarnessRun {
  Task task = 1;
  string attempt_id = 2;
  SessionCheckpoint checkpoint = 3;
}

message SessionCheckpoint {
  string harness = 1;
  string format = 2;
  bytes payload = 3;
  string sha256 = 4;
}

message CheckpointReference {
  string harness = 1;
  string format = 2;
  uint64 byte_length = 3;
  string sha256 = 4;
}

message GetCheckpointResponse {
  CheckpointReference reference = 1;
}

message CommitCheckpointRequest {
  InspectAttemptRequest attempt = 1;
  CheckpointReference reference = 2;
}

message CheckpointUpload {
  oneof part {
    CommitCheckpointRequest begin = 1;
    bytes chunk = 2;
  }
}

message CheckpointDownload {
  oneof part {
    CheckpointReference reference = 1;
    bytes chunk = 2;
  }
}

message WorkspaceSpec {
  string workspace_id = 1;
  string base_commit = 2;
}

message BlobReference {
  string sha256 = 1;
  uint64 byte_length = 2;
}

message WorkspaceDeliveryReference {
  string workspace_id = 1;
  string delivery_id = 2;
  string base_commit = 3;
  string start_commit = 4;
  string head_commit = 5;
  bool committed = 6;
  uint64 changed_files = 7;
  BlobReference patch = 8;
  BlobReference bundle = 9;
}

message WorkspaceDeliveryRequest {
  InspectAttemptRequest attempt = 1;
  WorkspaceDeliveryReference delivery = 2;
}

message WorkspaceContinuation {
  WorkspaceDeliveryReference delivery = 1;
}

message WorkspaceUpload {
  oneof part {
    WorkspaceDeliveryRequest begin = 1;
    bytes patch_chunk = 2;
    bytes bundle_chunk = 3;
  }
}

message WorkspaceDownload {
  oneof part {
    WorkspaceDeliveryReference reference = 1;
    bytes chunk = 2;
  }
}

enum WorkspaceArtifactKind {
  WORKSPACE_ARTIFACT_KIND_UNSPECIFIED = 0;
  WORKSPACE_ARTIFACT_KIND_PATCH = 1;
  WORKSPACE_ARTIFACT_KIND_BUNDLE = 2;
}

message GetWorkspaceArtifactRequest {
  string task_id = 1;
  WorkspaceArtifactKind kind = 2;
}

message HarnessPublishRequest {
  uint64 sequence = 1;
  string text = 2;
}

message HarnessCompleteRequest {
  string result = 1;
  bool succeeded = 2;
  ObjectiveSignal objective_signal = 3;
  SessionCheckpoint checkpoint = 4;
}

message HarnessCompleteResponse {}

enum ObjectiveStatus {
  OBJECTIVE_STATUS_UNSPECIFIED = 0;
  OBJECTIVE_STATUS_WORKING = 1;
  OBJECTIVE_STATUS_BLOCKED = 2;
  OBJECTIVE_STATUS_LIMITED = 3;
  OBJECTIVE_STATUS_READY_FOR_REVIEW = 4;
  OBJECTIVE_STATUS_COMPLETED = 5;
  OBJECTIVE_STATUS_CANCELLED = 6;
}

enum ObjectiveSignal {
  OBJECTIVE_SIGNAL_PROGRESS = 0;
  OBJECTIVE_SIGNAL_READY_FOR_REVIEW = 1;
  OBJECTIVE_SIGNAL_COMPLETED = 2;
  OBJECTIVE_SIGNAL_BLOCKED = 3;
}

message CreateObjectiveRequest {
  string operation_id = 1;
  string objective_id = 2;
  string owner_tag_id = 3;
  string outcome = 4;
  bool ongoing = 5;
  optional int64 deadline_ms = 6;
  optional uint64 budget_limit_minor = 7;
  optional string budget_currency = 8;
}

message Objective {
  string objective_id = 1;
  string owner_tag_id = 2;
  string session_id = 3;
  string outcome = 4;
  bool ongoing = 5;
  string starting_task_id = 6;
  ObjectiveStatus status = 7;
  uint64 revision = 8;
  optional int64 deadline_ms = 9;
  optional uint64 budget_limit_minor = 10;
  optional string budget_currency = 11;
  optional int64 paused_at_ms = 12;
  optional uint64 reported_spend_minor = 13;
}

message GetObjectiveRequest {
  string objective_id = 1;
}

message ListObjectivesRequest {
  uint32 limit = 1;
  string after_id = 2;
}

message ListObjectivesResponse {
  repeated Objective objectives = 1;
}

message SetObjectiveLimitsRequest {
  string objective_id = 1;
  string operation_id = 2;
  optional int64 deadline_ms = 3;
  bool clear_deadline = 4;
  optional uint64 budget_limit_minor = 5;
  optional string budget_currency = 6;
  bool clear_budget = 7;
  optional uint64 expected_revision = 8;
}

message ObjectiveActionRequest {
  string objective_id = 1;
  string operation_id = 2;
  string reason = 3;
}

message ReviewObjectiveRequest {
  string objective_id = 1;
  string operation_id = 2;
  bool approved = 3;
  string feedback = 4;
}

message ReplyDestination {
  string conversation_id = 1;
  optional string thread_id = 2;
}

message AcceptEventRequest {
  string account_id = 1;
  string event_id = 2;
  string tag_id = 3;
  string session_id = 4;
  string prompt = 5;
  ReplyDestination destination = 6;
}

message AcceptSlackEventRequest {
  string account_id = 1;
  string event_id = 2;
  string team_id = 3;
  string channel_id = 4;
  string message_ts = 5;
  string thread_ts = 6;
  string prompt = 7;
  optional string mention_tag_id = 8;
}

message AcceptSlackEventResponse {
  Task task = 1;
}

enum ReplyState {
  REPLY_STATE_UNSPECIFIED = 0;
  REPLY_STATE_PENDING = 1;
  REPLY_STATE_CLAIMED = 2;
  REPLY_STATE_DELIVERED = 3;
  REPLY_STATE_FAILED = 4;
  REPLY_STATE_UNCERTAIN = 5;
}

message Reply {
  string reply_id = 1;
  string task_id = 2;
  string account_id = 3;
  ReplyDestination destination = 4;
  string text = 5;
  ReplyState state = 6;
  optional string provider_receipt = 7;
}

message ClaimReplyRequest {
  string operation_id = 1;
}

message ClaimReplyResponse {
  Reply reply = 1;
  string lease_token = 2;
}

message SettleReplyRequest {
  string reply_id = 1;
  string lease_token = 2;
  ReplyState state = 3;
  optional string provider_receipt = 4;
}
