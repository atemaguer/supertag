// Private to a Worker Host and its provider helper. The Harness never receives
// this service's credentials or sandbox allocation identifiers.
service RemoteWorkspaceProvider {
  rpc Allocate(RemoteWorkspaceAllocateRequest) returns (RemoteWorkspaceAllocation);
  rpc Stage(stream RemoteWorkspaceStageChunk) returns (RemoteWorkspaceStageResponse);
  rpc Capture(RemoteWorkspaceCaptureRequest) returns (stream RemoteWorkspaceCaptureChunk);
  rpc Stop(RemoteWorkspaceStopRequest) returns (RemoteWorkspaceStopResponse);
  // One Workspace stdio MCP server, started inside the staged sandbox from its trusted copy.
  // The first input is the start record; later inputs are its stdin. Outputs are its stdout.
  // Ending or cancelling the call stops the server process, never the sandbox.
  rpc RunMcpServer(stream RemoteMcpServerInput) returns (stream RemoteMcpServerOutput);
}

message RemoteWorkspaceProviderBootstrap {
  string token = 1;
}

message RemoteWorkspaceOwner {
  string host_id = 1;
  uint64 host_generation = 2;
  string task_id = 3;
  string attempt_id = 4;
  string allocation_id = 5;
}

message RemoteWorkspaceAllocateRequest {
  RemoteWorkspaceOwner owner = 1;
  uint32 timeout_ms = 2;
  repeated string allowed_actions = 3;
  // The trusted commit's devcontainer subset, translated by the Worker Host. Absent when the
  // commit declares none: the sandbox starts from the operator's template or image.
  optional RemoteWorkspaceEnvironment environment = 3400;
}

// A sandbox image and setup derived only from the trusted commit's devcontainer subset.
message RemoteWorkspaceEnvironment {
  // Registry image the build starts from. Absent: the operator's configured template or image.
  optional string image = 1;
  // Dockerfile instructions applied after the base, ending as `user` when one is set. Every
  // process the provider starts in the sandbox, including staging, runs as the image's user,
  // so that user owns the checkout and the trusted MCP copy.
  repeated string dockerfile_commands = 2;
  // The user the image ends as: remoteUser, containerUser, or the Dockerfile's last literal USER.
  optional string user = 3;
  // Shell lines run in order after staging, in the checkout, as the image's user. "$1" is the
  // checkout path; exports carry the resolved containerEnv and remoteEnv.
  repeated string setup_commands = 4;
}

message RemoteWorkspaceAllocation {
  string sandbox_id = 1;
}

message RemoteWorkspaceStageHeader {
  string start_commit = 1;
  BlobReference bundle = 2;
  // Bodies follow the bundle bytes, in this exact manifest order.
  repeated ArtifactInputFile input_files = 3;
  // When set, the provider also materializes this commit from the bundle as the trusted copy
  // its Workspace stdio MCP servers run in, outside the checkout the Harness can change.
  optional string mcp_commit = 3400;
}

message RemoteWorkspaceStageChunk {
  oneof part {
    RemoteWorkspaceStageHeader header = 1;
    bytes payload = 2;
  }
}

message RemoteWorkspaceStageResponse {
  // Echoed only after the provider verifies the files in its private checkout.
  repeated ArtifactInputFile input_files = 1;
}

message RemoteWorkspaceCaptureRequest {}

message RemoteWorkspaceCaptureChunk {
  oneof part {
    BlobReference tree = 1;
    bytes payload = 2;
  }
}

message RemoteWorkspaceStopRequest {
  RemoteWorkspaceOwner owner = 1;
  optional string sandbox_id = 2;
}

// A sandbox ID is present only after a definitive provider absence check.
message RemoteWorkspaceStopResponse {
  optional string stopped_sandbox_id = 1;
}

// The server runs with no Worker Host variable: only a fixed PATH and LANG.
message RemoteMcpServerStart {
  string name = 1;
  string command = 2;
  repeated string args = 3;
}

message RemoteMcpServerInput {
  oneof part {
    RemoteMcpServerStart start = 1;
    bytes stdin = 2;
  }
}

message RemoteMcpServerOutput {
  bytes stdout = 1;
}

