syntax = "proto3";

package supertag.runtime.v2;

import "supertag/runtime/v2/policy.proto";

// The Gateway exposes these services to operators and enrolled hosts. The
// Control Plane serves the same messages on a private authenticated listener.
service Operator {
  rpc CreateAuthKey(CreateAuthKeyRequest) returns (AuthKey);
  rpc RevokeHost(RevokeHostRequest) returns (HostRecord);
  rpc ListHosts(ListHostsRequest) returns (ListHostsResponse);
  rpc GetHost(GetHostRequest) returns (WorkerHostStatus);
  rpc SetHostDraining(SetHostDrainingRequest) returns (WorkerHostStatus);
  rpc PutTag(PutTagRequest) returns (Tag);
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc SubmitTask(SubmitTaskRequest) returns (Task);
  rpc GetTask(GetTaskRequest) returns (Task);
  rpc ListNativeUsage(ListNativeUsageRequest) returns (ListNativeUsageResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc CancelTask(CancelTaskRequest) returns (Task);
  rpc ResolveAttempt(ResolveAttemptRequest) returns (AttemptResolution);
}

// An operator reads and sends messages in their personal conversations.
service Conversations {
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc SendMessage(SendMessageRequest) returns (ConversationMessage);
  rpc GetMessage(GetMessageRequest) returns (ConversationMessage);
  rpc ListMessageEvents(ListMessageEventsRequest) returns (ListEventsResponse);
}

// Operator-visible invalidation notices. Task event replay has its own cursor.
service OperatorEvents {
  rpc Watch(WatchRequest) returns (stream WatchEvent);
}

enum WatchKind {
  WATCH_KIND_UNSPECIFIED = 0;
  WATCH_KIND_TAG = 1;
  WATCH_KIND_TASK = 2;
  WATCH_KIND_CONVERSATION_MESSAGE = 3;
  WATCH_KIND_OBJECTIVE = 4;
  WATCH_KIND_TEAM = 5;
  WATCH_KIND_WORKSTREAM_POST = 6;
}

enum WatchReason {
  WATCH_REASON_UNSPECIFIED = 0;
  WATCH_REASON_CREATED = 1;
  WATCH_REASON_CHANGED = 2;
  WATCH_REASON_DELETED = 3;
}

message WatchRequest {
  string resume_token = 1;
  repeated WatchKind kinds = 2;
}

message WatchEvent {
  string resume_token = 1;
  oneof update {
    WatchHeartbeat heartbeat = 2;
    WatchResync resync = 3;
    WatchChange change = 4;
  }
}

message WatchHeartbeat {}
message WatchResync {}

message WatchChange {
  WatchKind kind = 1;
  string id = 2;
  string tag_id = 3;
  string session_id = 4;
  string objective_id = 5;
  string team_id = 6;
  string conversation = 7;
  int64 changed_at_ms = 8;
  WatchReason reason = 9;
}

service Objectives {
  rpc CreateObjective(CreateObjectiveRequest) returns (Objective);
  rpc GetObjective(GetObjectiveRequest) returns (Objective);
  rpc ListObjectives(ListObjectivesRequest) returns (ListObjectivesResponse);
  rpc ListCommitReviews(ListObjectiveCommitReviewsRequest) returns (ListObjectiveCommitReviewsResponse);
  rpc SetLimits(SetObjectiveLimitsRequest) returns (Objective);
  rpc SetRuntimeActions(SetObjectiveRuntimeActionsRequest) returns (Objective);
  rpc PauseObjective(ObjectiveActionRequest) returns (Objective);
  rpc ResumeObjective(ObjectiveActionRequest) returns (Objective);
  rpc CancelObjective(ObjectiveActionRequest) returns (Objective);
  rpc ReviewObjective(ReviewObjectiveRequest) returns (Objective);
}

service Inbox {
  rpc ListItems(ListInboxItemsRequest) returns (ListInboxItemsResponse);
  rpc GetQuestion(GetQuestionRequest) returns (ObjectiveQuestion);
  rpc AnswerQuestion(AnswerQuestionRequest) returns (Task);
  rpc GetApproval(GetApprovalRequest) returns (Approval);
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  rpc DecideApproval(DecideApprovalRequest) returns (Approval);
}

enum InboxItemKind {
  INBOX_ITEM_KIND_UNSPECIFIED = 0;
  INBOX_ITEM_KIND_QUESTION = 1;
  INBOX_ITEM_KIND_OBJECTIVE_BUDGET = 2;
  INBOX_ITEM_KIND_OBJECTIVE_LIMIT = 3;
  INBOX_ITEM_KIND_TASK_ATTENTION = 4;
  INBOX_ITEM_KIND_APPROVAL = 5;
}

message ListInboxItemsRequest {
  string objective_id = 1;
  InboxItemKind kind = 2;
  uint32 page_size = 3;
  string cursor = 4;
}

message ListInboxItemsResponse {
  int64 as_of_ms = 1;
  repeated InboxItem items = 2;
  string next_cursor = 3;
  repeated InboxItemKind truncated_kinds = 4;
}

message InboxItem {
  string key = 1;
  string occurrence = 2;
  InboxItemKind kind = 3;
  string objective_id = 4;
  string task_id = 5;
  optional string attempt_id = 6;
  bool operator_eligible = 7;
  int64 actionable_since_ms = 8;
  string reason = 9;
  InboxQuestion question = 10;
  InboxApproval approval = 11;
}

message InboxApproval {
  string approval_id = 1;
  string tag_id = 2;
  string action = 3;
  string resource = 4;
  string summary = 5;
}

message ApprovalRule {
  string action = 1;
  repeated string operator_ids = 2;
}

enum ApprovalState {
  APPROVAL_STATE_UNSPECIFIED = 0;
  APPROVAL_STATE_PENDING = 1;
  APPROVAL_STATE_APPROVED = 2;
  APPROVAL_STATE_DENIED = 3;
  APPROVAL_STATE_EXPIRED = 4;
}

enum ApprovalScope {
  APPROVAL_SCOPE_UNSPECIFIED = 0;
  APPROVAL_SCOPE_ONCE = 1;
  APPROVAL_SCOPE_OBJECTIVE = 2;
}

message Approval {
  string approval_id = 1;
  string task_id = 2;
  string attempt_id = 3;
  string tag_id = 4;
  string session_id = 5;
  optional string objective_id = 6;
  string action = 7;
  string arguments_digest = 8;
  string summary = 9;
  repeated string operator_ids = 10;
  ApprovalState state = 11;
  ApprovalScope scope = 12;
  int64 requested_at_ms = 13;
  optional int64 decided_at_ms = 14;
  optional string decided_by = 15;
  optional string reason = 16;
  optional int64 valid_until_ms = 17;
  optional int64 consumed_at_ms = 18;
  optional string continuation_task_id = 19;
  string resource = 20;
  string canonical_arguments_json = 21;
  optional string grant_approval_id = 22;
  optional int64 covered_at_ms = 23;
}

message GetApprovalRequest { string approval_id = 1; }

message ListApprovalsRequest {
  string objective_id = 1;
  string task_id = 2;
  ApprovalState state = 3;
  uint32 limit = 4;
  string cursor = 5;
}

message ListApprovalsResponse {
  repeated Approval approvals = 1;
  string next_cursor = 2;
}

message DecideApprovalRequest {
  string approval_id = 1;
  string operation_id = 2;
  bool approve = 3;
  ApprovalScope scope = 4;
  optional int64 valid_until_ms = 5;
  string reason = 6;
}

message RequestApprovalRequest {
  InspectAttemptRequest attempt = 1;
  string operation_id = 2;
  string action = 3;
  string arguments_json = 4;
  string summary = 5;
  string resource = 6;
}

message RequestApprovalResponse {
  Approval approval = 1;
  bool granted = 2;
}

message InboxQuestion {
  string text = 1;
  int64 asked_at_ms = 2;
  bool truncated = 3;
}

message GetQuestionRequest { string task_id = 1; }

message AnswerQuestionRequest {
  string task_id = 1;
  string operation_id = 2;
  string text = 3;
}

message ObjectiveQuestion {
  string task_id = 1;
  string attempt_id = 2;
  string objective_id = 3;
  string text = 4;
  int64 asked_at_ms = 5;
  optional int64 published_at_ms = 6;
  optional string answer_task_id = 7;
}

message AskQuestionRequest {
  InspectAttemptRequest attempt = 1;
  string operation_id = 2;
  string text = 3;
}

message AttemptCapabilities {
  bool may_ask_objective_question = 1;
  bool may_use_workstream = 2;
  bool may_read_mailbox = 3;
  bool may_send_tag_message = 4;
  bool may_start_work_session = 5;
  bool may_continue_work_session = 6;
  bool may_ask_work_session_question = 7;
  // An Objective owner report may request review of its own child delivery.
  bool may_request_commit_review = 8;
}

// Operators see the work started in Sessions they can access.
service WorkSessions {
  rpc Get(GetWorkSessionRequest) returns (WorkSession);
  rpc List(ListWorkSessionsRequest) returns (ListWorkSessionsResponse);
}

service AttemptWorkSessions {
  rpc Start(StartWorkSessionRequest) returns (WorkSession);
  rpc Continue(ContinueWorkSessionRequest) returns (WorkSession);
  rpc Ask(AskWorkSessionQuestionRequest) returns (WorkSessionQuestion);
}

message WorkSession {
  string work_session_id = 1;
  string title = 2;
  string parent_tag_id = 3;
  string parent_session_id = 4;
  string starter_task_id = 5;
  string tag_id = 6;
  string latest_task_id = 7;
  TaskState latest_task_state = 8;
  optional string report_task_id = 9;
  TaskState report_task_state = 10;
  optional string objective_id = 11;
  WorkspaceDeliveryReference workspace_delivery = 12;
  uint64 created_order = 13;
  WorkSessionQuestion question = 14;
}

message WorkSessionQuestion {
  string work_session_id = 1;
  string task_id = 2;
  string attempt_id = 3;
  string text = 4;
  int64 asked_at_ms = 5;
  optional int64 published_at_ms = 6;
  optional string answer_task_id = 7;
}

message StartWorkSessionRequest {
  InspectAttemptRequest attempt = 1;
  string operation_id = 2;
  string title = 3;
  string instruction = 4;
  optional string workspace_id = 5;
  optional string target_tag_id = 6;
}

message GetWorkSessionRequest {
  string work_session_id = 1;
  // Select the child Task and report from this turn of the Work Session.
  optional string report_task_id = 2;
}

message ContinueWorkSessionRequest {
  InspectAttemptRequest attempt = 1;
  string operation_id = 2;
  string work_session_id = 3;
  string message = 4;
}

message AskWorkSessionQuestionRequest {
  InspectAttemptRequest attempt = 1;
  string operation_id = 2;
  string text = 3;
}

message ListWorkSessionsRequest {
  string parent_tag_id = 1;
  string parent_session_id = 2;
  optional string starter_task_id = 3;
  uint32 limit = 4;
  string cursor = 5;
}

message ListWorkSessionsResponse {
  repeated WorkSession work_sessions = 1;
  string next_cursor = 2;
}

service Teams {
  rpc CreateTeam(CreateTeamRequest) returns (Team);
  rpc GetTeam(GetTeamRequest) returns (Team);
  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse);
  rpc UpdateTeam(UpdateTeamRequest) returns (Team);
  rpc DeleteTeam(DeleteTeamRequest) returns (Team);
  rpc ListWorkstreamPosts(ListWorkstreamPostsRequest) returns (ListWorkstreamPostsResponse);
}

service AttemptWorkstreams {
  rpc ReadAttemptWorkstream(ReadAttemptWorkstreamRequest) returns (ReadAttemptWorkstreamResponse);
  rpc PostAttemptWorkstream(PostAttemptWorkstreamRequest) returns (PostAttemptWorkstreamResponse);
}

service Mailbox {
  rpc ListMessages(ListMailboxMessagesRequest) returns (ListMailboxMessagesResponse);
  rpc ChangeGrant(ChangeMailboxGrantRequest) returns (ChangeMailboxGrantResponse);
  rpc ListGrants(ListMailboxGrantsRequest) returns (ListMailboxGrantsResponse);
}

service AttemptMailbox {
  rpc ReadMailbox(ReadMailboxRequest) returns (ListMailboxMessagesResponse);
  rpc SendMessage(SendAttemptTagMessageRequest) returns (SendTagMessageResponse);
}

enum TagMessageOrigin {
  TAG_MESSAGE_ORIGIN_UNSPECIFIED = 0;
  TAG_MESSAGE_ORIGIN_DIRECT = 1;
  TAG_MESSAGE_ORIGIN_WORKSTREAM = 2;
}

enum TagMessageState {
  TAG_MESSAGE_STATE_UNSPECIFIED = 0;
  TAG_MESSAGE_STATE_PENDING = 1;
  TAG_MESSAGE_STATE_HANDLED = 2;
  TAG_MESSAGE_STATE_FAILED = 3;
}

message TagMessage {
  string message_id = 1;
  string sender_tag_id = 2;
  string recipient_tag_id = 3;
  string source_task_id = 4;
  optional string workstream_post_id = 5;
  optional string objective_id = 6;
  string text = 7;
  uint32 hops = 8;
  optional string task_id = 9;
  TagMessageState state = 10;
  int64 created_at_ms = 11;
  TagMessageOrigin origin = 12;
  CommitReview review = 13;
}

enum CommitReviewDecision {
  COMMIT_REVIEW_DECISION_UNSPECIFIED = 0;
  COMMIT_REVIEW_DECISION_APPROVED = 1;
  COMMIT_REVIEW_DECISION_CHANGES_REQUESTED = 2;
}

message CommitReviewSubmission {
  oneof kind {
    string commit = 1;
    CommitReviewResponse response = 2;
  }
}

message CommitReviewResponse {
  string request_id = 1;
  CommitReviewDecision verdict = 2;
}

message CommitReviewVerdict {
  CommitReviewDecision decision = 1;
  string summary = 2;
  string task_id = 3;
  int64 recorded_at_ms = 4;
}

message CommitReview {
  string request_id = 1;
  string objective_id = 2;
  string commit = 3;
  string workspace_id = 4;
  string source_task_id = 5; // Successful child Task that published this commit.
  string requester_tag_id = 6;
  string reviewer_tag_id = 7;
  int64 requested_at_ms = 8;
  CommitReviewVerdict verdict = 9;
}

message SendAttemptTagMessageRequest {
  InspectAttemptRequest attempt = 1;
  string operation_id = 2;
  string recipient_tag_id = 3;
  string text = 4;
  CommitReviewSubmission review = 5;
}

message SendTagMessageResponse {
  TagMessage message = 1;
  bool duplicate = 2;
  Approval approval = 3;
  // A recorded verdict returns the original review without a new Mailbox message.
  CommitReview review = 4;
}

message ChangeMailboxGrantRequest {
  string operation_id = 1;
  string sender_tag_id = 2;
  string recipient_tag_id = 3;
  bool granted = 4;
}

message ChangeMailboxGrantResponse { bool changed = 1; }

message ListMailboxGrantsRequest {
  string tag_id = 1;
  uint32 limit = 2;
  string cursor = 3;
}

message MailboxGrant {
  string sender_tag_id = 1;
  string recipient_tag_id = 2;
  string granted_by = 3;
  int64 granted_at_ms = 4;
}

message ListMailboxGrantsResponse {
  repeated MailboxGrant grants = 1;
  string next_cursor = 2;
}

message ListMailboxMessagesRequest {
  string tag_id = 1;
  uint32 limit = 2;
  string cursor = 3;
}

message ListMailboxMessagesResponse {
  repeated TagMessage messages = 1;
  string next_cursor = 2;
}

message ReadMailboxRequest {
  InspectAttemptRequest attempt = 1;
  uint32 limit = 2;
  string cursor = 3;
}

service WorkerHost {
  rpc RegisterHost(RegisterHostRequest) returns (HostRecord);
  rpc ReportHost(ReportHostRequest) returns (WorkerHostStatus);
  rpc ClaimTask(ClaimTaskRequest) returns (ClaimTaskResponse);
  rpc StartTask(StartTaskRequest) returns (Task);
  rpc InspectAttempt(InspectAttemptRequest) returns (Task);
  rpc GetAttemptCapabilities(InspectAttemptRequest) returns (AttemptCapabilities);
  rpc GetAttemptHistory(InspectAttemptRequest) returns (AttemptHistory);
  rpc GetContextPins(InspectAttemptRequest) returns (ContextResolutionManifest);
  rpc CommitContextResolution(CommitContextResolutionRequest) returns (ContextResolutionManifest);
  rpc RenewAttempt(InspectAttemptRequest) returns (AttemptAuthority);
  rpc GetAttemptResolution(InspectAttemptRequest) returns (GetAttemptResolutionResponse);
  rpc ReportAttemptUsage(ReportAttemptUsageRequest) returns (ReportAttemptUsageResponse);
  rpc AppendEvent(AppendEventRequest) returns (TaskEvent);
  rpc AskQuestion(AskQuestionRequest) returns (ObjectiveQuestion);
  rpc FinishTask(FinishTaskRequest) returns (Task);
}

enum HostPhase {
  HOST_PHASE_UNSPECIFIED = 0;
  HOST_PHASE_PENDING = 1;
  HOST_PHASE_READY = 2;
  HOST_PHASE_BUSY = 3;
  HOST_PHASE_SUPPRESSED = 4;
  HOST_PHASE_OFFLINE = 5;
  HOST_PHASE_DRAINING = 6;
  HOST_PHASE_REVOKED = 7;
}

enum HostReadiness {
  HOST_READINESS_UNSPECIFIED = 0;
  HOST_READINESS_PENDING = 1;
  HOST_READINESS_READY = 2;
  HOST_READINESS_SUPPRESSED = 3;
}

enum HostReadinessReason {
  HOST_READINESS_REASON_UNSPECIFIED = 0;
  HOST_READINESS_REASON_STARTING = 1;
  HOST_READINESS_REASON_RECOVERY_REQUIRED = 2;
  HOST_READINESS_REASON_STOPPING = 3;
}

message ReportHostRequest {
  uint64 sequence = 1;
  uint32 capacity = 2;
  uint32 available_slots = 3;
  HostReadiness readiness = 4;
  HostReadinessReason reason = 5;
  HarnessKind harness_kind = 6;
  repeated string workspace_ids = 7;
  HarnessExecutionProfile execution_profile = 8;
}

message WorkerHostStatus {
  string host_id = 1;
  uint64 generation = 2;
  HostPhase phase = 3;
  bool draining = 4;
  uint32 capacity = 5;
  uint32 available_slots = 6;
  uint32 active_attempts = 7;
  HostReadinessReason reason = 8;
  HarnessKind harness_kind = 9;
  repeated string workspace_ids = 10;
  int64 enrolled_at_ms = 11;
  optional int64 last_seen_at_ms = 12;
  optional int64 presence_expires_at_ms = 13;
  optional int64 revoked_at_ms = 14;
  HarnessExecutionProfile execution_profile = 15;
}

message ListHostsRequest {
  uint32 limit = 1;
  string cursor = 2;
}

message ListHostsResponse {
  repeated WorkerHostStatus hosts = 1;
  string next_cursor = 2;
}

message GetHostRequest { string host_id = 1; }

message SetHostDrainingRequest {
  string host_id = 1;
  bool draining = 2;
}

// Operator commands and durable history for input directed into a running Task.
service LiveInputs {
  rpc QueueInput(QueueInputRequest) returns (LiveInput);
  rpc GetInput(GetInputRequest) returns (LiveInput);
  rpc ResolveInput(ResolveInputRequest) returns (LiveInput);
}

// A separate lane for Worklets to take input and record native delivery evidence.
service AttemptInputs {
  rpc TakeInput(TakeInputRequest) returns (TakeInputResponse);
  rpc SettleInput(SettleInputRequest) returns (LiveInput);
}

// A one-time Auth Key authorizes enrollment for one designated Worker Host.
service HostEnrollment {
  rpc EnrollHost(EnrollHostRequest) returns (HostRecord);
}

// Private Gateway-to-Control-Plane service for enrollment and authentication.
service HostDirectory {
  rpc Enroll(PrivateEnrollHostRequest) returns (HostRecord);
  rpc Authenticate(AuthenticateHostRequest) returns (HostRecord);
}

// Private Gateway-to-Control-Plane operations. The authenticated connector
// principal identifies the account. Provider request bodies cannot select it.
service Connector {
  rpc AcceptEvent(AcceptEventRequest) returns (Task);
  rpc AcceptSlackEvent(AcceptSlackEventRequest) returns (AcceptSlackEventResponse);
  rpc AcceptGithubEvent(AcceptGithubEventRequest) returns (AcceptGithubEventResponse);
  rpc AcceptLinearEvent(AcceptLinearEventRequest) returns (AcceptLinearEventResponse);
  rpc AcceptLarkEvent(AcceptLarkEventRequest) returns (AcceptLarkEventResponse);
  rpc AcceptMicrosoftTeamsActivity(AcceptMicrosoftTeamsActivityRequest) returns (AcceptMicrosoftTeamsActivityResponse);
  rpc GetMicrosoftTeamsReplyRoute(GetMicrosoftTeamsReplyRouteRequest) returns (MicrosoftTeamsReplyRoute);
  rpc ClaimReply(ClaimReplyRequest) returns (ClaimReplyResponse);
  rpc SettleReply(SettleReplyRequest) returns (Reply);
}

// Public, attempt-authorized transfer of native Session checkpoints.
service Transfers {
  rpc UploadCheckpoint(stream CheckpointUpload) returns (CheckpointReference);
  rpc DownloadCheckpoint(InspectAttemptRequest) returns (stream CheckpointDownload);
  rpc UploadWorkspace(stream WorkspaceUpload) returns (WorkspaceDeliveryReference);
  rpc DownloadWorkspace(InspectAttemptRequest) returns (stream WorkspaceDownload);
  rpc DownloadWorkspaceArtifact(GetWorkspaceArtifactRequest) returns (stream WorkspaceDownload);
  rpc DownloadReviewArtifact(GetReviewArtifactRequest) returns (stream WorkspaceDownload);
}

// Private authorization and commit for bytes stored by the Gateway.
service CheckpointDirectory {
  rpc GetCheckpoint(InspectAttemptRequest) returns (GetCheckpointResponse);
  rpc ReserveCheckpoint(CommitCheckpointRequest) returns (CheckpointReference);
  rpc CommitCheckpoint(CommitCheckpointRequest) returns (CheckpointReference);
}

// Private authorization and commit for work product stored by the Gateway.
service WorkspaceDirectory {
  rpc GetContinuation(InspectAttemptRequest) returns (WorkspaceContinuation);
  rpc ReserveDelivery(WorkspaceDeliveryRequest) returns (WorkspaceDeliveryReference);
  rpc CommitDelivery(WorkspaceDeliveryRequest) returns (WorkspaceDeliveryReference);
  rpc GetArtifact(GetWorkspaceArtifactRequest) returns (WorkspaceDeliveryReference);
  rpc GetReviewArtifact(GetReviewArtifactRequest) returns (WorkspaceDeliveryReference);
}

// An adapter connects only to its supervising Worker Host. The launch pipe
// provides its endpoint and an execution-scoped credential.
service Harness {
  rpc Attach(HarnessAttachRequest) returns (HarnessRun);
  rpc ConfirmExecutionLimits(AppliedExecutionLimits) returns (ConfirmExecutionLimitsResponse);
  rpc TakeLiveInput(HarnessTakeLiveInputRequest) returns (TakeInputResponse);
  rpc SettleLiveInput(HarnessSettleLiveInputRequest) returns (LiveInput);
  rpc Publish(HarnessPublishRequest) returns (TaskEvent);
  rpc ReportUsage(HarnessUsageRequest) returns (ReportAttemptUsageResponse);
  rpc Complete(HarnessCompleteRequest) returns (HarnessCompleteResponse);
}

// The supervising Worker Host supplies the Attempt and its remote Workspace.
// An adapter cannot select the sandbox, working directory, or environment.
service HarnessWorkspace {
  rpc Execute(HarnessWorkspaceRequest) returns (HarnessWorkspaceResult);
}

message HarnessWorkspaceRequest {
  oneof operation {
    WorkspaceRead read = 1;
    WorkspaceWrite write = 2;
    WorkspaceEdit edit = 3;
    WorkspaceGlob glob = 4;
    WorkspaceGrep grep = 5;
    WorkspaceList list = 6;
    WorkspaceCommand command = 7;
  }
}

message WorkspaceRead {
  string path = 1;
  optional uint32 offset = 2;
  optional uint32 limit = 3;
}

message WorkspaceWrite {
  string path = 1;
  string content = 2;
}

message WorkspaceEdit {
  string path = 1;
  string old_text = 2;
  string new_text = 3;
  bool replace_all = 4;
}

message WorkspaceGlob {
  string pattern = 1;
  optional string path = 2;
}

enum WorkspaceGrepMode {
  WORKSPACE_GREP_MODE_UNSPECIFIED = 0;
  WORKSPACE_GREP_MODE_CONTENT = 1;
  WORKSPACE_GREP_MODE_FILES_WITH_MATCHES = 2;
  WORKSPACE_GREP_MODE_COUNT = 3;
}

message WorkspaceGrep {
  string pattern = 1;
  optional string path = 2;
  optional string glob = 3;
  WorkspaceGrepMode mode = 4;
  optional uint32 head_limit = 5;
  optional uint32 offset = 6;
}

message WorkspaceList {
  optional string path = 1;
}

message WorkspaceCommand {
  string command = 1;
  optional uint32 timeout_ms = 2;
}

message HarnessWorkspaceResult {
  string text = 1;
  bool is_error = 2;
}

// Private to a Worker Host and its provider helper. The Harness never receives
// this service's credentials or sandbox allocation identifiers.
service RemoteWorkspaceProvider {
  rpc Allocate(RemoteWorkspaceAllocateRequest) returns (RemoteWorkspaceAllocation);
  rpc Stage(stream RemoteWorkspaceStageChunk) returns (RemoteWorkspaceStageResponse);
  rpc Capture(RemoteWorkspaceCaptureRequest) returns (stream RemoteWorkspaceCaptureChunk);
  rpc Stop(RemoteWorkspaceStopRequest) returns (RemoteWorkspaceStopResponse);
}

message RemoteWorkspaceProviderBootstrap {
  string token = 1;
}

message RemoteWorkspaceOwner {
  string host_id = 1;
  uint64 host_generation = 2;
  string task_id = 3;
  string attempt_id = 4;
  string allocation_id = 5;
}

message RemoteWorkspaceAllocateRequest {
  RemoteWorkspaceOwner owner = 1;
  uint32 timeout_ms = 2;
  repeated string allowed_actions = 3;
}

message RemoteWorkspaceAllocation {
  string sandbox_id = 1;
}

message RemoteWorkspaceStageHeader {
  string start_commit = 1;
  BlobReference bundle = 2;
}

message RemoteWorkspaceStageChunk {
  oneof part {
    RemoteWorkspaceStageHeader header = 1;
    bytes payload = 2;
  }
}

message RemoteWorkspaceStageResponse {}

message RemoteWorkspaceCaptureRequest {}

message RemoteWorkspaceCaptureChunk {
  oneof part {
    BlobReference tree = 1;
    bytes payload = 2;
  }
}

message RemoteWorkspaceStopRequest {
  RemoteWorkspaceOwner owner = 1;
  optional string sandbox_id = 2;
}

// A sandbox ID is present only after a definitive provider absence check.
message RemoteWorkspaceStopResponse {
  optional string stopped_sandbox_id = 1;
}

// The supervising Worker Host supplies the Attempt identity for this call.
service HarnessQuestions {
  rpc AskQuestion(HarnessAskQuestionRequest) returns (ObjectiveQuestion);
}

message HarnessAskQuestionRequest {
  string operation_id = 1;
  string text = 2;
}

// The supervising Worker Host supplies the Attempt identity.
service HarnessWorkstreams {
  rpc Read(HarnessReadWorkstreamRequest) returns (ReadAttemptWorkstreamResponse);
  rpc Post(HarnessPostWorkstreamRequest) returns (PostAttemptWorkstreamResponse);
}

message HarnessReadWorkstreamRequest {
  optional uint64 after_sequence = 1;
  uint32 limit = 2;
  string cursor = 3;
}

message HarnessPostWorkstreamRequest {
  string operation_id = 1;
  string body = 2;
  repeated string to_tag_ids = 3;
}

service HarnessMailbox {
  rpc Read(HarnessReadMailboxRequest) returns (ListMailboxMessagesResponse);
  rpc SendMessage(HarnessSendTagMessageRequest) returns (SendTagMessageResponse);
  rpc ReadReviewPatch(HarnessReadReviewPatchRequest) returns (HarnessReviewPatch);
}

// The supervising Worker Host supplies the Attempt identity.
service HarnessWorkSessions {
  rpc Start(HarnessStartWorkSessionRequest) returns (WorkSession);
  rpc Continue(HarnessContinueWorkSessionRequest) returns (WorkSession);
  rpc Ask(HarnessAskWorkSessionQuestionRequest) returns (WorkSessionQuestion);
}

message HarnessContinueWorkSessionRequest {
  string operation_id = 1;
  string work_session_id = 2;
  string message = 3;
}

message HarnessAskWorkSessionQuestionRequest {
  string operation_id = 1;
  string text = 2;
}

