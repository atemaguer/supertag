service AttemptMcpEffects {
  rpc Reserve(ReserveMcpEffectRequest) returns (ReserveMcpEffectResponse);
  rpc Settle(SettleMcpEffectRequest) returns (SettleMcpEffectResponse);
  // Records the Workspace MCP servers an Attempt resolved, before any of them starts. The first
  // recorded digest of a Task binds every later Attempt of that Task.
  rpc RecordWorkspaceMcp(RecordWorkspaceMcpRequest) returns (RecordWorkspaceMcpResponse);
}

// The selected `.mcp.json` entries of a Task's Workspace as one Attempt resolved them.
message WorkspaceMcpRecord {
  // `sha256:` and the hex digest of the selected entries as declared, with no value resolved.
  string digest = 1;
  // One capability per selected server; its provider binding pins the resolved launch.
  repeated McpServerCapability servers = 2;
}
message RecordWorkspaceMcpRequest {
  InspectAttemptRequest attempt = 1;
  WorkspaceMcpRecord record = 2;
}
message RecordWorkspaceMcpResponse {}

