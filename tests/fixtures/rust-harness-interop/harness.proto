syntax = "proto3";
package supertag.harness.spike;

// Experimental local Worker/adapter contract, independent of the shipped Worklet API.
service HarnessBridge {
  rpc Attach(stream AdapterFrame) returns (stream WorkerFrame);
  rpc PublishEvents(stream HarnessEvent) returns (stream EventAck);
}

message Identity {
  string execution_id = 1;
  uint64 generation = 2;
}
message Hello {
  uint32 protocol_version = 1;
  string language = 2;
}
message Ready {}
message Started {}
message Outcome {
  string id = 1;
  string text = 2;
  uint64 through_sequence = 3;
  string commit = 4;
  string native_session_id = 5;
}
message Quiesced {
  uint64 last_sequence = 1;
}
message Closed {}
message AdapterFrame {
  Identity identity = 1;
  oneof body {
    Hello hello = 2;
    Ready ready = 3;
    Started started = 4;
    Outcome outcome = 5;
    Quiesced quiesced = 6;
    Closed closed = 7;
  }
}
message Welcome {
  uint32 protocol_version = 1;
}
message Offer {
  string prompt = 1;
  string scenario = 2;
  string workspace = 3;
  string model = 4;
  string reasoning_effort = 5;
  string task_id = 6;
}
message Begin {}
message Cancel {
  string reason = 1;
}
message Receipt {
  string outcome_id = 1;
  bool accepted = 2;
}
message Quiesce {}
message Close {}
message WorkerFrame {
  Identity identity = 1;
  oneof body {
    Welcome welcome = 2;
    Offer offer = 3;
    Begin begin = 4;
    Cancel cancel = 5;
    Receipt receipt = 6;
    Quiesce quiesce = 7;
    Close close = 8;
  }
}
message HarnessEvent {
  Identity identity = 1;
  uint64 sequence = 2;
  string text = 3;
  string kind = 4;
  string payload_json = 5;
}
message EventAck {
  uint64 through_sequence = 1;
}
