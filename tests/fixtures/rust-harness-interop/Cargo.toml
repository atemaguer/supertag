[package]
name = "supertag-harness-interop-spike"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
prost = "0.14"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "process", "io-util", "time", "fs"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.14.9"
tonic-prost = "0.14.9"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
tonic-prost-build = "0.14.9"
