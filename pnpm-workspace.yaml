packages:
  - apps/*
  - harnesses/**
  - sdks/typescript

allowBuilds:
  '@bufbuild/buf': true
  better-sqlite3: set this to true or false
  cbor-extract: false
  electron: true
  electron-winstaller: false
  esbuild: true
  protobufjs: true

minimumReleaseAgeExclude:
  - '@opentui/core-darwin-arm64@0.9.4'
  - '@opentui/core-darwin-x64@0.9.4'
  - '@opentui/core-linux-arm64-musl@0.9.4'
  - '@opentui/core-linux-arm64@0.9.4'
  - '@opentui/core-linux-x64-musl@0.9.4'
  - '@opentui/core-linux-x64@0.9.4'
  - '@opentui/core-win32-arm64@0.9.4'
  - '@opentui/core-win32-x64@0.9.4'
  - '@opentui/core@0.9.4'
  - '@opentui/react@0.9.4'
