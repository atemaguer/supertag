name: Core

on:
  pull_request:
    paths:
      - 'core/**'
      - 'proto/**'
      - 'sdks/**'
      - 'harnesses/**'
      - 'scripts/**'
      - 'docs/reference/cli.md'
      - 'apps/tui/**'
      - 'apps/desktop/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/core.yml'
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'proto/**'
      - 'sdks/**'
      - 'harnesses/**'
      - 'scripts/**'
      - 'docs/reference/cli.md'
      - 'apps/tui/**'
      - 'apps/desktop/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/core.yml'

permissions:
  contents: read

jobs:
  # The workspace's test binaries split across four jobs by recorded run time
  # (scripts/core-test-shard.mjs). Shard 1 also lints, runs the doc tests, and checks the
  # supertag-ai package, so it takes fewer tests.
  runtime:
    name: runtime (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: supertag_test
          POSTGRES_USER: supertag
          POSTGRES_PASSWORD: rust-port-ci-database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supertag -d supertag_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    defaults:
      run:
        working-directory: core
    env:
      SUPERTAG_RUST_TEST_DATABASE_URL: postgresql://supertag:rust-port-ci-database@localhost:5432/supertag_test
      # Required lane: a missing PostgreSQL, Node, Python agents, terminal UI, or Codex sandbox
      # fixture fails the gated test instead of skipping it. Linux-root cases run in the
      # linux-root job below. Claude Code's sandbox (`claude-sandbox`) is not required here: on
      # the hosted runner its seccomp helper cannot write setgroups in the nested user namespace
      # it makes inside bubblewrap's ("nested userns is capability-restricted"), so its test runs
      # only where the sandbox starts and otherwise reports the skip.
      SUPERTAG_RUST_TEST_REQUIRE: postgres,node,agents-python,tui,codex-sandbox
    steps:
      - uses: actions/checkout@v4
      # Restores the registry and third-party dependency builds; workspace crates are never cached.
      # Only main saves, so pull requests reuse main's cache without evicting it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-runtime
          workspaces: core -> target
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/tui/go.mod
          cache-dependency-path: |
            apps/tui/go.sum
            sdks/go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install fixture runtime dependencies
        working-directory: .
        run: |
          sudo apt-get update
          # socat and ripgrep: Claude Code's sandbox runtime needs them beside bubblewrap.
          sudo apt-get install -y tmux bubblewrap socat ripgrep
          # Codex's Linux sandbox runs bubblewrap as this user; Ubuntu's AppArmor policy denies
          # unprivileged user namespaces unless a profile grants them, so lift that restriction.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / --unshare-user --unshare-net true
          python -m pip install uv==0.9.5
          pnpm install --frozen-lockfile
          uv venv "$RUNNER_TEMP/supertag-python-runtime" --python 3.13
          uv pip install --python "$RUNNER_TEMP/supertag-python-runtime/bin/python" './sdks/python[runtime,agents]'
          npm install --prefix "$RUNNER_TEMP/supertag-codex-probe" --no-audit --no-fund @openai/codex@0.163.0
          native_codex="$RUNNER_TEMP/supertag-codex-probe/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex"
          test -x "$native_codex"
          env -i PATH=/usr/bin:/bin "$native_codex" --version
          printf 'SUPERTAG_TEST_CODEX_BINARY=%s\n' "$native_codex" >> "$GITHUB_ENV"
      - name: Build native harness bridges and version-matched terminal UI
        working-directory: .
        run: |
          pnpm --filter @supertag/worker-claude-code build
          pnpm --filter @supertag/worker-opencode build
          pnpm --filter @supertag/worker-cursor build
          pnpm --filter @supertag/worker-environment-e2b build
          pnpm --filter @supertag/worker-environment-modal build
          sh apps/tui/build.sh
          printf 'SUPERTAG_RUST_TEST_NODE=%s\n' "$(command -v node)" >> "$GITHUB_ENV"
          printf 'SUPERTAG_RUST_TEST_AGENTS_PYTHON=%s\n' "$RUNNER_TEMP/supertag-python-runtime/bin/python" >> "$GITHUB_ENV"
          printf 'SUPERTAG_RUST_TEST_TUI=%s\n' "$GITHUB_WORKSPACE/apps/tui/dist/supertag-tui-linux-amd64" >> "$GITHUB_ENV"
      - if: matrix.shard == 1
        run: cargo fmt --all -- --check
      - if: matrix.shard == 1
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test the Rust runtime with SQLite and PostgreSQL
        env:
          SUPERTAG_CORE_SHARD_HEAD_START: 150
        run: |
          umask 077
          export SUPERTAG_RUST_TEST_POSTGRES_URL_FILE="$RUNNER_TEMP/supertag-rust-postgres-url"
          printf '%s' "$SUPERTAG_RUST_TEST_DATABASE_URL" > "$SUPERTAG_RUST_TEST_POSTGRES_URL_FILE"
          # Ignored database/language/tmux fixtures run here; real provider calls stay opt-in.
          # Split-process tests run as NAME::sqlite and NAME::postgres; each PostgreSQL case
          # creates and drops its own database through the URL file.
          # replicas_runtime runs three Control Plane processes on one PostgreSQL database.
          node ../scripts/core-test-shard.mjs ${{ matrix.shard }} 4 -- --include-ignored \
            --skip installed_native_sign_in_steers_one_turn_and_resumes_its_checkpoint \
            --skip installed_native_objective_question_and_pinned_tool_resume
      - name: Verify the supertag-ai package against the native Control Plane and Worker Host
        if: matrix.shard == 1
        working-directory: .
        run: |
          cargo build --locked --manifest-path core/Cargo.toml -p supertag-cli --bin supertag
          SUPERTAG_RUST_TEST_CLI="$GITHUB_WORKSPACE/core/target/debug/supertag" \
            pnpm --filter supertag-ai test:package

  # Shared execution switches workloads to a distinct UID, so these cases need real root. The
  # job runs as root inside a disposable container; nothing else on the runner is touched.
  # Locally: run the same two cargo commands as root in a throwaway Linux VM or container with
  # SUPERTAG_RUST_TEST_REQUIRE=linux-root,postgres and the variables below.
  linux-root:
    runs-on: ubuntu-latest
    container:
      image: rust:1.93.1-bookworm
      options: --user 0
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: supertag_test
          POSTGRES_USER: supertag
          POSTGRES_PASSWORD: rust-port-ci-database
        options: >-
          --health-cmd "pg_isready -U supertag -d supertag_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    defaults:
      run:
        working-directory: core
    env:
      SUPERTAG_RUST_TEST_REQUIRE: linux-root,postgres
    steps:
      - uses: actions/checkout@v4
      # Restores the registry and third-party dependency builds; workspace crates are never cached.
      # Only main saves, so pull requests reuse main's cache without evicting it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-linux-root
          workspaces: core -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Build the Cursor bridge used by the shared command case
        working-directory: .
        run: |
          apt-get update
          apt-get install -y util-linux
          pnpm install --frozen-lockfile
          pnpm --filter @supertag/worker-cursor build
      - name: Run the Linux-root shared execution cases on SQLite and PostgreSQL
        run: |
          test "$(id -u)" = 0
          umask 077
          export SUPERTAG_RUST_TEST_POSTGRES_URL_FILE="$RUNNER_TEMP/supertag-rust-postgres-url"
          printf '%s' 'postgresql://supertag:rust-port-ci-database@postgres:5432/supertag_test' > "$SUPERTAG_RUST_TEST_POSTGRES_URL_FILE"
          cargo build --locked -p supertag-shared-execution --bin supertag-shared-execution
          export SUPERTAG_RUST_TEST_SHARED_EXECUTION_BINARY="$PWD/target/debug/supertag-shared-execution"
          cargo test --locked -p supertag-shared-execution --test service_contract -- --include-ignored process_contract::
          cargo test --locked -p supertag-cli --all-features --test cursor_runtime -- --include-ignored shared_command_runtime::

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Restores the registry and third-party dependency builds; workspace crates are never cached.
      # Only main saves, so pull requests reuse main's cache without evicting it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
          workspaces: apps/desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - run: pnpm install --frozen-lockfile
      # The Tauri build script embeds the built frontend, so it must exist before cargo runs.
      - run: pnpm --filter @supertag/desktop build
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked

  # Small hard-crash lane with production PostgreSQL durability settings. The runtime job's
  # PostgreSQL proves logical behavior; this job proves the crash matrix with fsync,
  # synchronous_commit, and full_page_writes on. Run locally with
  # scripts/durable-postgres-crash-lane.sh.
  crash-durability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      # Restores the registry and third-party dependency builds; workspace crates are never cached.
      # Only main saves, so pull requests reuse main's cache without evicting it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core-crash-durability
          workspaces: core -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Start PostgreSQL with production durability settings
        run: |
          docker run --detach --name supertag-durable-postgres \
            --env POSTGRES_USER=supertag --env POSTGRES_PASSWORD=rust-port-durable-database \
            --env POSTGRES_DB=supertag_test --publish 127.0.0.1:5433:5432 \
            postgres:17-alpine -c fsync=on -c synchronous_commit=on -c full_page_writes=on
          for attempt in $(seq 1 30); do
            if docker exec supertag-durable-postgres pg_isready -h 127.0.0.1 -U supertag -d supertag_test; then
              exit 0
            fi
            sleep 2
          done
          docker logs supertag-durable-postgres
          exit 1
      - name: Run the crash matrix against durable PostgreSQL
        run: |
          umask 077
          export SUPERTAG_RUST_TEST_POSTGRES_URL_FILE="$RUNNER_TEMP/supertag-durable-postgres-url"
          printf '%s' 'postgresql://supertag:rust-port-durable-database@127.0.0.1:5433/supertag_test' > "$SUPERTAG_RUST_TEST_POSTGRES_URL_FILE"
          sh ../scripts/durable-postgres-crash-lane.sh

  bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.9.5
      - run: pnpm install --frozen-lockfile
      - run: uv run --python 3.13 --script scripts/generate-bindings.py --check
      - run: uv run --python 3.13 --script scripts/wire-roundtrip.py
      - run: go -C sdks/go test ./...
