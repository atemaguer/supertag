name: Release SuperTag CLI installer

# The CLI ships through npm (publish.yml). Each release carries install.sh, which installs that npm
# package with the system's Node.js, so `releases/latest/download/install.sh` always works.
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive install.sh
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'atemaguer/supertag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the installer
        run: sh -n install.sh
      - name: Upload install.sh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" install.sh --clobber
