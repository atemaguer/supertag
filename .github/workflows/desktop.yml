name: Desktop

# Builds the desktop app's frontend, then checks its Tauri backend with fmt, clippy, and cargo
# test. The backend links the Control Plane, Gateway, and protocol crates, so core changes run it
# too. It is its own workflow so that a desktop break shows as its own check rather than as one
# more failed job in Core.
on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'core/**'
      - 'proto/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'core/**'
      - 'proto/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Restores the registry and third-party dependency builds; workspace crates are never cached.
      # Only main saves, so pull requests reuse main's cache without evicting it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
          workspaces: apps/desktop/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - run: pnpm install --frozen-lockfile
      # The Tauri build script embeds the built frontend, so it must exist before cargo runs.
      - run: pnpm --filter @supertag/desktop build
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
