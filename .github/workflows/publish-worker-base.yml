name: Publish Worker base image

on:
  push:
    branches: [main]
    paths:
      - deploy/docker/worker/**
      - .github/workflows/publish-worker-base.yml
  workflow_dispatch:

concurrency:
  group: worker-base-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and smoke test the image
        run: |
          for arch in amd64 arm64; do
            image="supertag-worker-base:check-$arch"
            docker buildx build --platform "linux/$arch" --load -t "$image" deploy/docker/worker
            docker run --rm --platform "linux/$arch" "$image" sh -ec '
              node --version
              git --version
              python3 -m venv /tmp/worker-venv
              /tmp/worker-venv/bin/python --version
              test -s /etc/ssl/certs/ca-certificates.crt
            '
          done
      - name: Publish to the GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-worker-base"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$image:sha-$GITHUB_SHA" -t "$image:latest" deploy/docker/worker
