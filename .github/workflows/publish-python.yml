name: Publish Python SDK

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose version should be published
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'atemaguer/supertag'
    name: Build and publish supertag
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/supertag/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build packaging twine
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from packaging.version import Version

          with open("sdks/python/pyproject.toml", "rb") as source:
              package_version = tomllib.load(source)["project"]["version"]
          release_version = os.environ["RELEASE_TAG"].removeprefix("v")
          if Version(release_version) != Version(package_version):
              raise SystemExit(
                  f"Release {release_version} does not match supertag {package_version}"
              )
          PY
      - run: python -m build sdks/python --outdir dist
      - run: python -m twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
