name: Publish Python SDK

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag whose version should be published
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'atemaguer/supertag'
    name: Build and publish supertag
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/supertag/
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the tag names the release version
        run: python rust/scripts/release_version.py "$RELEASE_TAG"
      # PyPI versions are immutable: publish only for a release users can install.
      - name: Check the release carries its native archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-release-assets.sh "$RELEASE_TAG"
      # The SDK ships the generated supertag.runtime.v2 bindings in supertag._runtime_v2.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: rust/bindings/go/go.mod
          cache-dependency-path: rust/bindings/go/go.sum
      - run: python -m pip install --upgrade build twine uv==0.9.5
      - run: pnpm install --frozen-lockfile
      - name: Check the generated bindings match the protobuf source
        run: uv run --python 3.13 --script rust/scripts/generate-bindings.py --check
      - run: python -m build sdks/python --outdir dist
      - run: python -m twine check dist/*
      - name: Check the wheel carries the generated bindings
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install --quiet "$(ls dist/*.whl)[runtime]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/python" -c 'import supertag._runtime_v2.runtime_pb2_grpc, supertag.control_plane_client'
      - uses: pypa/gh-action-pypi-publish@release/v1
