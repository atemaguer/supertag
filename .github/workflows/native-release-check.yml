name: Verify native releases

# Builds and verifies the three native archives. On its own this uploads nothing.
# release.yml calls it with upload_artifacts and sign_macos to produce the
# archives it attaches to a GitHub Release.
on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
      mode:
        default: package
        type: string
      profile:
        default: release
        type: string
      upload_artifacts:
        default: false
        type: boolean
      sign_macos:
        default: false
        type: boolean
    secrets:
      APPLE_DEVELOPER_ID_P12:
        required: false
      APPLE_DEVELOPER_ID_P12_PASSWORD:
        required: false
      APPLE_NOTARY_KEY:
        required: false
      APPLE_NOTARY_KEY_ID:
        required: false
      APPLE_NOTARY_ISSUER_ID:
        required: false
  # Adding the release-check label to a pull request runs the full package mode on its head.
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      commit:
        description: Full source commit (leave empty for the selected workflow revision)
        type: string
      mode:
        description: Contract checks, or full three-platform package/extract/install verification
        type: choice
        options: [contracts, package]
        default: contracts
      profile:
        description: Release optimization, or faster development verification
        type: choice
        options: [release, dev]
        default: release

permissions:
  contents: read

jobs:
  contracts:
    if: github.event_name != 'pull_request' || github.event.label.name == 'release-check'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.9'
      - run: python -m pip install PyYAML==6.0.3
      - name: Check archive, installation, and platform boundaries
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          # Again with the terminal UI switched off, so the SHIP_TUI switch keeps working.
          SUPERTAG_RELEASE_TUI=0 python -m unittest discover -s scripts -p 'test_*.py'

  package:
    if: inputs.mode == 'package' || (github.event_name == 'pull_request' && github.event.label.name == 'release-check')
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      SOURCE_COMMIT: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
      BUILD_PLATFORM: ${{ matrix.platform }}
      BUILD_PROFILE: ${{ inputs.profile || 'release' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.9'
      - name: Install verification tools
        run: python -m pip install PyYAML==6.0.3 grpcio==1.85.1 grpcio-tools==1.85.1 protobuf==7.36.2
      - uses: actions/setup-node@v4
        if: runner.os == 'macOS'
        with:
          node-version: '22.13.0'
      - name: Prepare native macOS tools
        if: runner.os == 'macOS'
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund pnpm@11.18.0
      # The terminal UI is compiled by the Bun pinned in .bun-version; the Linux builder image
      # installs the same version from a checksummed download.
      - uses: oven-sh/setup-bun@v2
        if: runner.os == 'macOS'
        with:
          bun-version-file: .bun-version
      # Release builds restore Cargo's registry and third-party dependency builds from a cache
      # with its own key prefix, kept under the checkout but outside the tracked files the build
      # snapshots. rust-cache never saves workspace crates, and --cargo-cache stamps every
      # snapshot file as newer than any cached output, so Cargo rebuilds all of SuperTag's own
      # crates from the exact commit. The Linux build mounts the same directory into its
      # container. The host toolchain builds on macOS and lets rust-cache read the workspace when
      # it saves; without it rust-cache keeps no dependency builds, which is slower but safe.
      - name: Use the release Cargo cache
        run: |
          if [ "$RUNNER_OS" = macOS ] || command -v rustup > /dev/null; then
            rustup toolchain install 1.93.1 --profile minimal --no-self-update
          fi
          echo "CARGO_HOME=$GITHUB_WORKSPACE/.release-cargo/home" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-release
          shared-key: native-${{ matrix.platform }}-${{ inputs.profile || 'release' }}
          workspaces: core -> ../.release-cargo/target
          cache-bin: false
          # Pull requests labelled release-check reuse the cache without adding their own.
          save-if: ${{ github.event_name != 'pull_request' }}
      # The Linux builder image (Rust, Node, Bun, Python and pnpm on Debian 12) comes from the
      # GitHub Actions cache through buildx, one scope per platform. Its layers are keyed by
      # content: the digest-pinned base image and each Dockerfile step, so a changed Dockerfile or
      # entrypoint misses only from the changed step on. Release-builder-cache.yml fills the cache
      # on main, where tag runs can read it. Pull requests read it but never write it.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: runner.os == 'Linux'
      - name: Let buildx reach the Actions cache
        if: runner.os == 'Linux'
        uses: actions/github-script@v7
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RUNTIME_URL', 'ACTIONS_CACHE_URL',
                                'ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_SERVICE_V2']) {
              const value = process.env[name];
              if (!value) continue;
              if (name === 'ACTIONS_RUNTIME_TOKEN') core.setSecret(value);
              core.exportVariable(name, value);
            }
      - name: Build and execute the Linux archive in Debian 12
        if: runner.os == 'Linux'
        env:
          SAVE_BUILDER_CACHE: ${{ github.event_name != 'pull_request' }}
        run: |
          save=()
          if [ "$SAVE_BUILDER_CACHE" = true ]; then save=(--save-builder-cache); fi
          python scripts/native_release_docker.py --repo "$GITHUB_WORKSPACE" \
            --commit "$SOURCE_COMMIT" --platform "$BUILD_PLATFORM" --profile "$BUILD_PROFILE" \
            --output "$RUNNER_TEMP/native-release" --cargo-cache "$GITHUB_WORKSPACE/.release-cargo" \
            --builder-cache "release-builder-$BUILD_PLATFORM" "${save[@]}"
      # Only a release run that signs receives the Apple credentials; pull requests and manual
      # checks build unsigned archives without them.
      - name: Build and execute the native macOS archive
        if: runner.os == 'macOS' && !inputs.sign_macos
        run: |
          python scripts/native_release.py package --repo "$GITHUB_WORKSPACE" \
            --commit "$SOURCE_COMMIT" --expect-platform "$BUILD_PLATFORM" --profile "$BUILD_PROFILE" \
            --output "$RUNNER_TEMP/native-release" --install-smoke \
            --cargo-cache "$GITHUB_WORKSPACE/.release-cargo"
      - name: Build, sign, notarize, and execute the native macOS archive
        if: runner.os == 'macOS' && inputs.sign_macos
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          python scripts/native_release.py package --repo "$GITHUB_WORKSPACE" \
            --commit "$SOURCE_COMMIT" --expect-platform "$BUILD_PLATFORM" --profile "$BUILD_PROFILE" \
            --output "$RUNNER_TEMP/native-release" --install-smoke \
            --cargo-cache "$GITHUB_WORKSPACE/.release-cargo" \
            --sign-command "$GITHUB_WORKSPACE/scripts/notarize-macos-binaries.sh"
      - name: Record verified local output
        run: |
          python - "$RUNNER_TEMP/native-release" <<'PY'
          import json, pathlib, sys
          for receipt in sorted(pathlib.Path(sys.argv[1]).glob('*.json')):
              print(receipt.name)
              print(json.dumps(json.loads(receipt.read_text()), indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: inputs.upload_artifacts
        with:
          name: supertag-native-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/native-release/*.tar.gz
            ${{ runner.temp }}/native-release/*.tar.gz.sha256
            ${{ runner.temp }}/native-release/*.json
          if-no-files-found: error
          retention-days: 7
