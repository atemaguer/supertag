name: Release SuperTag

# Pushing a release tag builds the native archives for macOS (Apple silicon, Intel) and Linux
# (arm64, amd64), the desktop app's macOS disk images (one per Mac architecture) and Linux Debian
# packages, and attaches them, their SHA256SUMS, and an install.sh pinned to the release to a draft
# GitHub Release. The archives hold the supertag CLI, the supertag-tui terminal UI, the shared
# execution provider, and the Node.js bridges; each Mac app carries the contents of the macOS
# archive for its architecture, so it needs no separate install. The terminal UI's native library
# statically links FFmpeg (LGPL-2.1), so the release also attaches the
# exact FFmpeg source tarball it was built from, verified against the SHA-256 that OpenTUI's
# FFMPEG-SOURCE.md in the archives records (scripts/ffmpeg_source.py). A maintainer publishes the draft
# once every asset is attached; publishing runs the installer check and the SDK publish
# workflows, so the README's latest installer URL never points at a release without its archives.
# The desktop app updates itself from published releases: on macOS from latest-mac.yml and the
# signed app's update zip (with its blockmap), which the release attaches beside the disk image.
# The release also publishes the hosted service image for linux/amd64 to the GitHub Container
# Registry and attaches supertag-hosted-image.txt, the image's reference with its digest, which
# `supertag deploy` reads to run a release without anyone building an image.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build (for example, v0.3.0)
        required: true
        type: string
      upload_assets:
        description: Attach the archives and installer to that tag's draft GitHub Release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-supertag
  cancel-in-progress: false

jobs:
  source:
    if: github.repository == 'atemaguer/supertag'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.source.outputs.version }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.9'
      - name: Check the tag names the release version
        id: source
        run: |
          version=$(python scripts/release_version.py "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  package:
    needs: source
    uses: ./.github/workflows/native-release-check.yml
    with:
      commit: ${{ needs.source.outputs.commit }}
      mode: package
      profile: release
      upload_artifacts: true
      sign_macos: true
    secrets:
      APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
      APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

  # The Electron desktop app for macOS 13 or later, as SuperTag-VERSION-darwin-arm64.dmg for Apple
  # silicon and SuperTag-VERSION-darwin-amd64.dmg for Intel, each built and launched on a runner of
  # its own architecture. One image per architecture rather than a universal one: a universal app
  # doubles the Electron framework and every CLI binary, so each download would be about twice the
  # size, and the two archives' Node bridges hold different native packages that can't be merged.
  # electron-builder packages an unsigned SuperTag.app with its fuses flipped; the app carries the
  # package job's signed macOS archive for the same architecture under
  # Contents/Resources/supertag/, so it needs no separate install. scripts/package-desktop-macos.sh
  # signs the bridges' executables, the CLI and the terminal UI (allow-jit only), then the
  # Electron frameworks, helpers and the app, with the Developer ID certificate and the hardened
  # runtime, builds and signs the disk image, and notarizes and staples only the disk image, which
  # covers the app inside it; Gatekeeper then accepts the app inside the mounted image. The image
  # is a drag-to-install volume: the app beside a link to /Applications, laid out by the .DS_Store
  # that scripts/dmg_layout.py writes, so nothing scripts Finder on the runner. Without
  # any Apple secret the image is unsigned, with a warning, as for the archives; an incomplete set
  # fails this job. For now a failure here leaves that image out of the release with a warning
  # instead of stopping it.
  desktop:
    needs: [source, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            arch: arm64
            app: mac-arm64
          - platform: darwin-amd64
            runner: macos-15-intel
            arch: x64
            app: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.source.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare signing and notarization
        id: signing
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          missing=()
          for name in APPLE_DEVELOPER_ID_P12 APPLE_DEVELOPER_ID_P12_PASSWORD APPLE_NOTARY_KEY \
            APPLE_NOTARY_KEY_ID APPLE_NOTARY_ISSUER_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" = 5 ]; then
            echo "::warning::Apple credentials are absent. This build will distribute an unsigned desktop app."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#missing[@]}" != 0 ]; then
            echo "::error::Incomplete macOS signing configuration. Missing: ${missing[*]}"
            exit 1
          fi
          umask 077
          printf '%s' "$APPLE_DEVELOPER_ID_P12" | base64 -D > "$RUNNER_TEMP/signing.p12"
          # codesign and @electron/osx-sign take the identity's name; read it from the certificate.
          subject=$(openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -nokeys -clcerts \
              -passin env:APPLE_DEVELOPER_ID_P12_PASSWORD -legacy 2>/dev/null ||
            openssl pkcs12 -in "$RUNNER_TEMP/signing.p12" -nokeys -clcerts \
              -passin env:APPLE_DEVELOPER_ID_P12_PASSWORD)
          identity=$(printf '%s\n' "$subject" | openssl x509 -noout -subject -nameopt multiline |
            sed -n 's/^ *commonName *= *//p')
          rm -f "$RUNNER_TEMP/signing.p12"
          case "$identity" in
            'Developer ID Application: '*) ;;
            *) echo "::error::The PKCS#12 file must hold a Developer ID Application certificate"; exit 1 ;;
          esac
          printf '%s\n' "$APPLE_NOTARY_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "signed=true"
            echo "identity=$identity"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: supertag-native-${{ matrix.platform }}
          path: ${{ runner.temp }}/native
      - name: Unpack the signed macOS archive
        run: |
          archives=("$RUNNER_TEMP"/native/supertag-"$VERSION"-"$PLATFORM"*.tar.gz)
          [ "${#archives[@]}" = 1 ] && [ -f "${archives[0]}" ] || { echo "::error::expected one $PLATFORM archive"; exit 1; }
          mkdir -p "$RUNNER_TEMP/cli"
          tar -xzf "${archives[0]}" -C "$RUNNER_TEMP/cli"
          roots=("$RUNNER_TEMP"/cli/*/)
          [ "${#roots[@]}" = 1 ] && [ -x "${roots[0]}supertag" ] || { echo "::error::the archive has no supertag at its root"; exit 1; }
          test "$("${roots[0]}supertag" --version)" = "supertag $VERSION"
          echo "CLI_DIRECTORY=${roots[0]%/}" >> "$GITHUB_ENV"
      - name: Build the app
        # Unsigned, with its fuses flipped; the next step signs it once the CLI is inside it.
        env:
          ARCH: ${{ matrix.arch }}
        run: pnpm --filter @supertag/desktop package:mac --"$ARCH"
      - name: Put the CLI in the app, sign it, then build, sign, notarize, and check the disk image
        env:
          APP: ${{ matrix.app }}
          EXPECTED_ARCH: ${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          app=apps/desktop/release/$APP/SuperTag.app
          plist="$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$plist")" = 13.0
          # The app and the CLI inside it are both built for this runner's architecture.
          lipo -archs "$app/Contents/MacOS/SuperTag" | grep -Fxq "$EXPECTED_ARCH"
          lipo -archs "$CLI_DIRECTORY/supertag" | grep -Fxq "$EXPECTED_ARCH"
          image="SuperTag-$VERSION-$PLATFORM.dmg"
          mkdir -p "$RUNNER_TEMP/desktop"
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" scripts/package-desktop-macos.sh \
            "$app" "$CLI_DIRECTORY" "$RUNNER_TEMP/desktop/$image" \
            "$RUNNER_TEMP/desktop/${image%.dmg}.zip"
          test "$("$app/Contents/Resources/supertag/supertag" --version)" = "supertag $VERSION"
          cd "$RUNNER_TEMP/desktop"
          shasum -a 256 "$image" > "$image.sha256"
          cat "$image.sha256"
      - name: Remove the notary key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Check and launch the app inside the disk image
        run: |
          mount="$RUNNER_TEMP/desktop-mount"
          mkdir -p "$mount"
          hdiutil attach -quiet -readonly -nobrowse -noautoopen -mountpoint "$mount" \
            "$RUNNER_TEMP/desktop/SuperTag-$VERSION-$PLATFORM.dmg"
          trap 'hdiutil detach -quiet "$mount"' EXIT
          # A drag-to-install image: the app, Applications -> /Applications, the window layout,
          # and nothing else.
          python3 scripts/dmg_layout.py check "$mount"
          test "$(readlink "$mount/Applications")" = /Applications
          app="$mount/SuperTag.app"
          test "$("$app/Contents/Resources/supertag/supertag" --version)" = "supertag $VERSION"
          # ditto must have kept every relative symlink of the bridges' pnpm layout.
          broken=$(find "$app/Contents/Resources/supertag" -type l ! -exec test -e {} \; -print | wc -l)
          [ "$broken" -eq 0 ] || { echo "::error::$broken symlinks in the bundled CLI are broken"; exit 1; }
          # A fresh home with the bundled CLI opens on setup.
          pnpm --filter @supertag/desktop smoke "$app/Contents/MacOS/SuperTag" --expect="Set up SuperTag"
          du -sh "$app" "$RUNNER_TEMP/desktop/SuperTag-$VERSION-$PLATFORM.dmg"
      - name: Write the update zip's blockmap
        # The app's updater downloads the zip of the signed app that package-desktop-macos.sh
        # wrote, and with the last release's blockmap only the blocks that changed.
        working-directory: ${{ runner.temp }}/desktop
        run: |
          for zip in SuperTag-"$VERSION"-darwin-*.zip; do
            node "$GITHUB_WORKSPACE/apps/desktop/build/blockmap.mjs" "$zip"
            shasum -a 256 "$zip" > "$zip.sha256"
            shasum -a 256 "$zip.blockmap" > "$zip.blockmap.sha256"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: supertag-desktop-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/desktop/*.dmg
            ${{ runner.temp }}/desktop/*.dmg.sha256
            ${{ runner.temp }}/desktop/*.zip
            ${{ runner.temp }}/desktop/*.zip.blockmap
            ${{ runner.temp }}/desktop/*.zip*.sha256
          if-no-files-found: error
          retention-days: 7

  # A failed desktop job leaves its disk image out with a warning; the CLI archives still attach.
  # The Electron desktop app for Linux, as a Debian package for each release platform, and no
  # AppImage: Chromium's sandbox can't start from one under Ubuntu's restriction on unprivileged
  # user namespaces. The package installs an AppArmor profile that lets the app's own executable
  # create them; scripts/check-desktop-deb.sh installs it, launches it sandboxed with the
  # restriction on, and removes it. The app uses the supertag CLI from install.sh on PATH or in
  # ~/.local/bin, and bundles none. Linux needs no signing. For now a failure here leaves these
  # files out of the release with a warning instead of stopping it.
  desktop-linux:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.source.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the Debian package
        run: pnpm --filter @supertag/desktop package:linux
      - name: Name and check the Debian package
        run: |
          debs=(apps/desktop/release/*.deb)
          [ "${#debs[@]}" = 1 ] && [ -f "${debs[0]}" ] || { echo "::error::expected one Debian package"; exit 1; }
          # Debian spells a pre-release 0.3.0-alpha.1 as 0.3.0~alpha.1, which sorts before 0.3.0.
          test "$(dpkg-deb --field "${debs[0]}" Version)" = "${VERSION//-/\~}"
          test "$(dpkg-deb --field "${debs[0]}" Architecture)" = "${PLATFORM#linux-}"
          test "$(dpkg-deb --field "${debs[0]}" Package)" = supertag-desktop
          mkdir -p "$RUNNER_TEMP/desktop"
          cp "${debs[0]}" "$RUNNER_TEMP/desktop/SuperTag-$VERSION-$PLATFORM.deb"
          cd "$RUNNER_TEMP/desktop"
          for file in SuperTag-*; do sha256sum "$file" > "$file.sha256"; cat "$file.sha256"; done
          du -h SuperTag-*.deb
      - name: Install, launch sandboxed, and remove the package
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          scripts/check-desktop-deb.sh "$RUNNER_TEMP/desktop/SuperTag-$VERSION-$PLATFORM.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: supertag-desktop-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/desktop/SuperTag-*
          if-no-files-found: error
          retention-days: 7

  # The hosted service image (target "hosted" of deploy/docker/rust-service.Dockerfile) for
  # linux/amd64, built from the supertag binary in the package job's Linux archive, so the image
  # runs exactly the released binary. It is pushed to ghcr.io/OWNER/REPO-hosted as VERSION, and
  # its reference by digest becomes the release asset supertag-hosted-image.txt, which
  # SHA256SUMS lists: `version: X.Y.Z` in supertag-deploy.yaml resolves through it. The image is
  # pushed only when the release's assets are attached. For now a failure here leaves the image
  # out of the release with a warning instead of stopping it; `supertag deploy` then asks for
  # an explicit `image:`.
  hosted-image:
    needs: [source, package]
    if: github.event_name == 'push' || inputs.upload_assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: supertag-native-linux-amd64
          path: ${{ runner.temp }}/native
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build the image from the release's Linux binary and check it
        run: |
          archive="supertag-$VERSION-linux-amd64-complete.tar.gz"
          (cd "$RUNNER_TEMP/native" && sha256sum --check "$archive.sha256")
          mkdir -p "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/hosted"
          tar -xzf "$RUNNER_TEMP/native/$archive" -C "$RUNNER_TEMP/unpacked"
          roots=("$RUNNER_TEMP"/unpacked/*/)
          [ "${#roots[@]}" = 1 ] && [ -x "${roots[0]}supertag" ] || { echo "::error::the archive has no supertag at its root"; exit 1; }
          cp "${roots[0]}supertag" deploy/docker/rust-hosted-entrypoint.sh deploy/docker/rust-hosted-pair.sh \
            "$RUNNER_TEMP/hosted/"
          image="ghcr.io/${GITHUB_REPOSITORY,,}-hosted"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker buildx build --platform linux/amd64 --load --provenance=false --sbom=false \
            --file deploy/docker/rust-service.Dockerfile --target hosted \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t "$image:$VERSION" "$RUNNER_TEMP/hosted"
          # The image runs the released binary, and its entrypoint starts it as the service user.
          test "$(docker run --rm --entrypoint /usr/local/bin/supertag "$image:$VERSION" --version)" = "supertag $VERSION"
          docker run --rm "$image:$VERSION" --version | grep -Fxq "supertag $VERSION"
      - name: Publish to the GitHub Container Registry and record the digest
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # The same build, from the builder's cache, pushed as one linux/amd64 manifest.
          docker buildx build --platform linux/amd64 --push --provenance=false --sbom=false \
            --file deploy/docker/rust-service.Dockerfile --target hosted \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --metadata-file "$RUNNER_TEMP/image.json" \
            -t "$IMAGE:$VERSION" "$RUNNER_TEMP/hosted"
          digest=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/image.json")
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::the push reported no digest"; exit 1; }
          mkdir -p "$RUNNER_TEMP/image"
          cd "$RUNNER_TEMP/image"
          printf '%s@%s\n' "$IMAGE" "$digest" > supertag-hosted-image.txt
          sha256sum supertag-hosted-image.txt > supertag-hosted-image.txt.sha256
          cat supertag-hosted-image.txt
          # The reference pulls, and is what was built.
          docker pull --quiet "$(cat supertag-hosted-image.txt)"
          test "$(docker run --rm --entrypoint /usr/local/bin/supertag "$(cat supertag-hosted-image.txt)" --version)" = "supertag $VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: supertag-hosted-image
          path: |
            ${{ runner.temp }}/image/supertag-hosted-image.txt
            ${{ runner.temp }}/image/supertag-hosted-image.txt.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    if: >-
      always() && needs.source.result == 'success' && needs.package.result == 'success' &&
      (github.event_name == 'push' || inputs.upload_assets)
    needs: [source, package, desktop, desktop-linux, hosted-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      VERSION: ${{ needs.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.9'
      - uses: actions/download-artifact@v4
        with:
          pattern: supertag-native-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: needs.desktop.result != 'skipped'
        continue-on-error: true
        with:
          pattern: supertag-desktop-darwin-*
          path: release
          merge-multiple: true
      - name: Warn when a macOS disk image is missing
        working-directory: release
        run: |
          for platform in darwin-arm64 darwin-amd64; do
            [ -f "SuperTag-$VERSION-$platform.dmg" ] ||
              echo "::warning::This release attaches no SuperTag-$VERSION-$platform.dmg."
          done
      - uses: actions/download-artifact@v4
        if: needs.desktop-linux.result != 'skipped'
        continue-on-error: true
        with:
          pattern: supertag-desktop-linux-*
          path: release
          merge-multiple: true
      - name: Warn when a Linux desktop package is missing
        working-directory: release
        run: |
          for platform in linux-amd64 linux-arm64; do
            [ -f "SuperTag-$VERSION-$platform.deb" ] ||
              echo "::warning::This release attaches no SuperTag-$VERSION-$platform.deb."
          done
      - name: Verify the archives and write SHA256SUMS
        working-directory: release
        run: |
          : > SHA256SUMS
          for platform in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            archive="supertag-$VERSION-$platform-complete.tar.gz"
            sha256sum --check "$archive.sha256"
            cat "$archive.sha256" >> SHA256SUMS
          done
          test "$(wc -l < SHA256SUMS)" -eq 4
          # The FFmpeg source the terminal UI's native library links, as every archive's
          # licenses/opentui/FFMPEG-SOURCE.md names it; the script fails unless the download
          # matches the SHA-256 recorded there. The LGPL asks for it beside the binaries.
          source=$(python ../scripts/ffmpeg_source.py --output . \
            supertag-"$VERSION"-{darwin-arm64,darwin-amd64,linux-arm64,linux-amd64}-complete.tar.gz)
          echo "$source"
          ffmpeg=$(printf '%s' "$source" | python -c 'import json, sys; print(json.load(sys.stdin)["name"])')
          sha256sum --check "$ffmpeg.sha256"
          cat "$ffmpeg.sha256" >> SHA256SUMS
          rm "$ffmpeg.sha256"
          test "$(wc -l < SHA256SUMS)" -eq 5
          unexpected=$(find . -maxdepth 1 -type f -name 'ffmpeg-*' ! -name "$ffmpeg")
          [ -z "$unexpected" ] || { echo "::error::unexpected FFmpeg source files: $unexpected"; exit 1; }
          echo "FFMPEG_SOURCE=$ffmpeg" >> "$GITHUB_ENV"
          # The desktop app: the two dmgs and the two debs, whichever built.
          for image in SuperTag-"$VERSION"-darwin-arm64.dmg SuperTag-"$VERSION"-darwin-amd64.dmg \
            SuperTag-"$VERSION"-linux-amd64.deb SuperTag-"$VERSION"-linux-arm64.deb; do
            if [ -f "$image" ]; then
              sha256sum --check "$image.sha256"
              cat "$image.sha256" >> SHA256SUMS
            fi
          done
          # Nothing else, such as an AppImage, rides along.
          unexpected=$(find . -maxdepth 1 -type f -name 'SuperTag-*' ! -name "SuperTag-$VERSION-darwin-arm64.dmg*" \
            ! -name "SuperTag-$VERSION-darwin-amd64.dmg*" ! -name "SuperTag-$VERSION-linux-amd64.deb*" \
            ! -name "SuperTag-$VERSION-linux-arm64.deb*" ! -name "SuperTag-$VERSION-darwin-*.zip*")
          [ -z "$unexpected" ] || { echo "::error::unexpected desktop files: $unexpected"; exit 1; }
      - uses: actions/download-artifact@v4
        if: needs.hosted-image.result != 'skipped'
        continue-on-error: true
        with:
          name: supertag-hosted-image
          path: release
      - name: List the hosted image's reference, or warn that it is missing
        working-directory: release
        run: |
          if [ ! -f supertag-hosted-image.txt ]; then
            echo "::warning::This release attaches no supertag-hosted-image.txt; supertag deploy needs an explicit image for it."
            exit 0
          fi
          sha256sum --check supertag-hosted-image.txt.sha256
          grep -Eq "^ghcr\.io/${GITHUB_REPOSITORY,,}-hosted@sha256:[0-9a-f]{64}$" supertag-hosted-image.txt
          test "$(wc -l < supertag-hosted-image.txt)" -eq 1
          cat supertag-hosted-image.txt.sha256 >> SHA256SUMS
          rm supertag-hosted-image.txt.sha256
      - name: Write the desktop app's update feed
        # latest-mac.yml lists each Mac's update zip; installed Mac apps read it from the published
        # release (scripts/desktop_update_feed.py). Like the disk image, a missing zip only warns.
        working-directory: release
        run: |
          shopt -s nullglob
          zips=(SuperTag-"$VERSION"-darwin-*.zip)
          if [ "${#zips[@]}" = 0 ]; then
            echo "::warning::This release attaches no update zip; installed Mac apps won't update to it."
            exit 0
          fi
          for zip in "${zips[@]}"; do
            sha256sum --check "$zip.sha256" "$zip.blockmap.sha256"
            cat "$zip.sha256" "$zip.blockmap.sha256" >> SHA256SUMS
          done
          python ../scripts/desktop_update_feed.py --version "$VERSION" --output latest-mac.yml "${zips[@]}"
          sha256sum latest-mac.yml >> SHA256SUMS
      - name: Pin the installer to this release
        run: |
          sed -i "s/^RELEASE_DEFAULT_VERSION=\"latest\"$/RELEASE_DEFAULT_VERSION=\"$VERSION\"/" install.sh
          grep -Fxq "RELEASE_DEFAULT_VERSION=\"$VERSION\"" install.sh
          sh -n install.sh
          cp install.sh release/install.sh
      - name: Check the pinned installer against the archives
        run: |
          home=$(mktemp -d)
          env -i HOME="$home" PATH="$PATH" SUPERTAG_DOWNLOAD_URL="file://$GITHUB_WORKSPACE/release" \
            sh release/install.sh
          test "$("$home/.local/bin/supertag" --version)" = "supertag $VERSION"
      - name: Attach the archives and installer to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release
        run: |
          # A published release is never changed; its archives are what users already installed.
          draft=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .draft')
          case "$draft" in
            '') gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
                  --title "$RELEASE_TAG" --generate-notes ;;
            true) ;;
            *) echo "::error::$RELEASE_TAG is already published; publish a new version instead"; exit 1 ;;
          esac
          assets=(install.sh SHA256SUMS ./*-complete.tar.gz "./$FFMPEG_SOURCE")
          for image in ./*.dmg ./*.deb; do [ -f "$image" ] && assets+=("$image"); done
          for update in ./latest-mac.yml ./*.zip ./*.zip.blockmap ./supertag-hosted-image.txt; do
            if [ -f "$update" ]; then assets+=("$update"); fi
          done
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          {
            echo "Attached $FFMPEG_SOURCE, the FFmpeg source that supertag-tui's libopentui links (see NOTICE)."
            echo "Review the draft $RELEASE_TAG release notes, then publish it."
          } >> "$GITHUB_STEP_SUMMARY"
