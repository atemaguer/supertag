name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust-harness-interop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: tests/fixtures/rust-harness-interop
    env:
      PROTOC: ${{ github.workspace }}/tests/fixtures/rust-harness-interop/protoc.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/fixtures/rust-harness-interop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.9.5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tests/fixtures/rust-harness-interop/target
          key: rust-harness-${{ runner.os }}-${{ runner.arch }}-1.93.1-${{ hashFiles('tests/fixtures/rust-harness-interop/Cargo.lock') }}
      # Deterministic adapters exercise the real process and gRPC boundary without credentials.
      # Live Codex runs remain an explicit local opt-in and never run in PR CI.
      - run: bash run.sh
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
      - run: .venv/bin/python -c "import codex_adapter"
      - run: .venv/bin/python -m unittest discover -p test_live_project.py -v

  protocol-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: packages/operator-api/go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm proto:check
      - run: pnpm proto:breaking --self-test
      - run: go -C packages/operator-api/go vet ./...
      - run: go -C packages/operator-api/go test ./...

  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "./sdks/python[dev]"
      - run: ruff check sdks/python
      - run: pytest sdks/python/tests

  # The TypeScript that remains: the Node harness bridges and Workspace providers that Rust
  # Worker Hosts spawn, the Worker SDK they share, the desktop frontend, and repository checks.
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.13.0", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The capability ledger check confirms its committed lists against the freeze commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: packages/operator-api/go/go.sum
      - run: pnpm install --frozen-lockfile
      # SuperTag runs the user's installed Claude Code, so real-harness tests need it.
      - run: node scripts/install-harness-clis.mjs
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test
      # Documentation and script checks under scripts/, which Vitest does not collect.
      - run: node --test scripts/*.test.mjs

  tui:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: apps/tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/tui/go.mod
          cache-dependency-path: apps/tui/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: test -z "$(gofmt -l .)"
      - run: ./build.sh
      - run: ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: supertag-tui-${{ matrix.os }}
          path: apps/tui/dist
          retention-days: 7
