name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  internal-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # contributing/ holds internal notes and is gitignored; a force-added file must never ship.
      - name: No internal notes are tracked
        run: |
          tracked="$(git ls-files -- contributing)"
          if [ -n "$tracked" ]; then
            echo "These files under contributing/ are tracked; untrack them:" >&2
            echo "$tracked" >&2
            exit 1
          fi
  rust-harness-interop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: tests/fixtures/rust-harness-interop
    env:
      PROTOC: ${{ github.workspace }}/tests/fixtures/rust-harness-interop/protoc.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/fixtures/rust-harness-interop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.9.5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.1
      # Restores the registry and third-party dependency builds; workspace crates are never cached.
      # Only main saves, so pull requests reuse main's cache without evicting it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-harness-interop
          workspaces: tests/fixtures/rust-harness-interop -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Deterministic adapters exercise the real process and gRPC boundary without credentials.
      # Live Codex runs remain an explicit local opt-in and never run in PR CI.
      - run: bash run.sh
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
      - run: .venv/bin/python -c "import codex_adapter"
      - run: .venv/bin/python -m unittest discover -p test_live_project.py -v

  # install.sh, the release version gate, and native archive checks, on every change.
  release-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python -m pip install PyYAML==6.0.3
      - name: Every manifest carries the core/Cargo.toml version
        run: python scripts/release_version.py --check
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python -m unittest discover -s tests/evals/attention -p 'test_*.py'
      - run: node --test scripts/check-install-docs.test.mjs

  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "./sdks/python[dev]"
      - run: ruff check sdks/python
      - run: pytest sdks/python/tests

  # The TypeScript that remains: the Node harness bridges and Workspace providers that Rust
  # Worker Hosts spawn, the Worker SDK they share, the desktop frontend, and repository checks.
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.13.0", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The capability ledger check reads the paths at its freeze commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # SuperTag runs the user's installed Claude Code, so real-harness tests need it.
      - run: node scripts/install-harness-clis.mjs
      - run: pnpm check
      - run: pnpm build
      - run: pnpm --filter supertag-ai typecheck
      # The Docker reference provider's conformance test runs on this image and never pulls it.
      - run: |
          docker pull node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
          docker tag node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496 node:24-bookworm
      # The runner has Docker, so the real seal programs run in a container and never skip.
      - run: pnpm test
        env:
          SUPERTAG_TEST_REQUIRE_CONTAINER: "1"
      # Documentation and script checks under scripts/, which Vitest does not collect.
      - run: node --test scripts/*.test.mjs

  # The local-vm provider and the container reference provider against real containers, on
  # Docker and on Podman: the seal, the exec server, the relay, the dependency cache, and the
  # refusals of root, writable root programs, and setuid programs.
  local-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # local-vm refuses Podman: it fails five isolation checks (Task capabilities, relay signals,
    # the dependency cache volume, Codex configuration). Its leg runs the full suite with the
    # refusal bypassed (SUPERTAG_TEST_CONTAINER_RUNTIME=podman) and reports without failing the
    # run, so it shows when Podman reaches parity.
    continue-on-error: ${{ matrix.runtime == 'podman' }}
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      SUPERTAG_TEST_LOCAL_VM: "1"
      SUPERTAG_TEST_REQUIRE_CONTAINER: "1"
      SUPERTAG_TEST_CONTAINER_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@supertag/worker-environment-local-vm..." build
      - run: ${{ matrix.runtime }} info
      # The reference provider's conformance test runs on this image and never pulls it.
      - run: |
          ${{ matrix.runtime }} pull docker.io/library/node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
          ${{ matrix.runtime }} tag docker.io/library/node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496 node:24-bookworm
      # The base image's tag is a digest of its Dockerfile and platform: a cached build is reused
      # only while both are unchanged, and the provider builds it otherwise.
      - name: Name the local-vm base image
        id: base
        run: |
          # shellcheck disable=SC2016 # The single-quoted JavaScript expands its own template strings.
          tag=$(node --input-type=module -e '
            const { createHash } = await import("node:crypto");
            const { BASE_DOCKERFILE } = await import("./harnesses/environments/local-vm/dist/index.js");
            const platform = `linux/${process.arch === "arm64" ? "arm64" : "amd64"}`;
            const digest = createHash("sha256").update(`${platform}\n${BASE_DOCKERFILE}`).digest("hex");
            console.log(`supertag-workspace:${digest.slice(0, 32)}`);')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: ${{ runner.temp }}/local-vm-base.tar
          key: local-vm-base-${{ matrix.runtime }}-${{ steps.base.outputs.tag }}
      - if: steps.cache.outputs.cache-hit == 'true'
        run: ${{ matrix.runtime }} load -i "$RUNNER_TEMP/local-vm-base.tar"
      # The verbose reporter keeps what passing cases print, such as the Task capability sets.
      - run: >-
          pnpm exec vitest run --reporter=verbose
          harnesses/environments/local-vm
          harnesses/sdk/container-provider.container.test.ts
          harnesses/sdk/process-seal.container.test.ts
      - if: steps.cache.outputs.cache-hit != 'true'
        run: ${{ matrix.runtime }} save -o "$RUNNER_TEMP/local-vm-base.tar" "${{ steps.base.outputs.tag }}"

  tui:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: apps/tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/tui/go.mod
          cache-dependency-path: apps/tui/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: test -z "$(gofmt -l .)"
      - run: ./build.sh
      - run: ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: supertag-tui-${{ matrix.os }}
          path: apps/tui/dist
          retention-days: 7
