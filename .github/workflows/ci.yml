name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust-harness-interop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: tests/fixtures/rust-harness-interop
    env:
      PROTOC: ${{ github.workspace }}/tests/fixtures/rust-harness-interop/protoc.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/fixtures/rust-harness-interop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.9.5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.1
      # Restores the registry and third-party dependency builds; workspace crates are never cached.
      # Only main saves, so pull requests reuse main's cache without evicting it.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-harness-interop
          workspaces: tests/fixtures/rust-harness-interop -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Deterministic adapters exercise the real process and gRPC boundary without credentials.
      # Live Codex runs remain an explicit local opt-in and never run in PR CI.
      - run: bash run.sh
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
      - run: .venv/bin/python -c "import codex_adapter"
      - run: .venv/bin/python -m unittest discover -p test_live_project.py -v

  # install.sh, the release version gate, and native archive checks, on every change.
  release-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python -m pip install PyYAML==6.0.3
      - name: Every manifest carries the core/Cargo.toml version
        run: python scripts/release_version.py --check
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python -m unittest discover -s tests/evals/attention -p 'test_*.py'
      - run: node --test scripts/check-install-docs.test.mjs

  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "./sdks/python[dev]"
      - run: ruff check sdks/python
      - run: pytest sdks/python/tests

  # The TypeScript that remains: the Node harness bridges and Workspace providers that Rust
  # Worker Hosts spawn, the Worker SDK they share, the desktop frontend, and repository checks.
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.13.0", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The capability ledger check reads the paths at its freeze commit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # SuperTag runs the user's installed Claude Code, so real-harness tests need it.
      - run: node scripts/install-harness-clis.mjs
      - run: pnpm check
      - run: pnpm build
      - run: pnpm --filter supertag-ai typecheck
      # The Docker reference provider's conformance test runs on this image and never pulls it.
      - run: |
          docker pull node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496
          docker tag node@sha256:9d266751ca3d7fdbe651c878ffd5ad0a42fed49a18c283509267c97f025b7496 node:24-bookworm
      # The runner has Docker, so the real seal programs run in a container and never skip.
      - run: pnpm test
        env:
          SUPERTAG_TEST_REQUIRE_CONTAINER: "1"
      # Documentation and script checks under scripts/, which Vitest does not collect.
      - run: node --test scripts/*.test.mjs

  tui:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: apps/tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/tui/go.mod
          cache-dependency-path: apps/tui/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: test -z "$(gofmt -l .)"
      - run: ./build.sh
      - run: ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: supertag-tui-${{ matrix.os }}
          path: apps/tui/dist
          retention-days: 7
