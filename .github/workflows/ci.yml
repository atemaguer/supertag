name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust-harness-interop:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: tests/fixtures/rust-harness-interop
    env:
      PROTOC: ${{ github.workspace }}/tests/fixtures/rust-harness-interop/protoc.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/fixtures/rust-harness-interop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install uv==0.9.5
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tests/fixtures/rust-harness-interop/target
          key: rust-harness-${{ runner.os }}-${{ runner.arch }}-1.93.1-${{ hashFiles('tests/fixtures/rust-harness-interop/Cargo.lock') }}
      # Deterministic adapters exercise the real process and gRPC boundary without credentials.
      # Live Codex runs remain an explicit local opt-in and never run in PR CI.
      - run: bash run.sh
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
      - run: .venv/bin/python -c "import codex_adapter"
      - run: .venv/bin/python -m unittest discover -p test_live_project.py -v

  protocol-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: |
            tests/fixtures/go-worklet/go.sum
            packages/operator-api/go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm proto:check
      - run: pnpm proto:breaking --self-test
      - run: pnpm test:proto:python
      - run: pnpm test:proto:go
      - run: go -C packages/operator-api/go vet ./...
      - run: go -C packages/operator-api/go test ./...

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/spec tests/remote-worker-transport.test.ts tests/package-public-api.test.ts

  # install.sh, the release version gate, and native archive checks, on every change.
  release-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python -m pip install PyYAML==6.0.3
      - name: Every manifest carries the rust/Cargo.toml version
        run: python rust/scripts/release_version.py --check
      - run: python -m unittest discover -s rust/scripts -p 'test_*.py'
      - run: node --test scripts/check-install-docs.test.mjs

  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "./sdks/python[dev]"
      - run: ruff check sdks/python
      - run: pytest sdks/python/tests

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: supertag_test
          POSTGRES_USER: supertag
          # Not a common word: Workers redact credential values from errors wherever they appear.
          POSTGRES_PASSWORD: ci-pg-Q7v4mZ2x
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supertag -d supertag_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      SUPERTAG_POSTGRES_URL: postgresql://supertag:ci-pg-Q7v4mZ2x@localhost:5432/supertag_test
      SUPERTAG_SIMULATION_OUTPUT_DIR: ${{ github.workspace }}/.supertag/simulation-artifacts
      # tsup bundles declarations in a worker that outgrows Node's default heap on runners.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The job discards this database, and PostgreSQL suites create and drop one per test. On
      # the runner's disk each fsync makes that cost seconds per test, so skip durability here.
      - run: >-
          docker exec ${{ job.services.postgres.id }}
          psql -U supertag -d supertag_test -v ON_ERROR_STOP=1
          -c "COMMENT ON DATABASE supertag_test IS 'supertag-test-server'"
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"
      - run: mkdir -p .supertag
      - run: pnpm --filter @supertag/store db:migrate:sqlite
        env:
          SUPERTAG_DATABASE_URL: file:${{ github.workspace }}/.supertag/supertag.db
      - run: pnpm --filter @supertag/store db:migrate:postgresql
      # SuperTag runs the user's installed Claude Code and Codex, so real-harness tests need them.
      - run: node scripts/install-harness-clis.mjs
      - run: pnpm check
      - run: node --test scripts/with-test-postgres.test.mjs
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter supertag-ai test:package
      - run: pnpm test:cli-deployment

  tui:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: apps/tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/tui/go.mod
          cache-dependency-path: apps/tui/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: test -z "$(gofmt -l .)"
      - run: ./build.sh
      - run: ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: supertag-tui-${{ matrix.os }}
          path: apps/tui/dist
          retention-days: 7
