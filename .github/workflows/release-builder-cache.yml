name: Cache the release builder image

# Builds the Linux release builder image for each platform and saves its layers to the GitHub
# Actions cache under the scope the release job reads (release-builder-PLATFORM). A tag run can
# read caches saved on main but not on another tag, so main keeps this cache warm whenever the
# image's inputs change, and a release then loads the image instead of rebuilding it.
on:
  push:
    branches: [main]
    paths:
      - deploy/docker/rust-release.Dockerfile
      - scripts/native_release_container.sh
      - scripts/native_release_docker.py
      - .github/workflows/release-builder-cache.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-builder-cache
  cancel-in-progress: true

jobs:
  builder:
    if: github.repository == 'atemaguer/supertag' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.9'
      - run: python -m pip install PyYAML==6.0.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Let buildx reach the Actions cache
        uses: actions/github-script@v7
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RUNTIME_URL', 'ACTIONS_CACHE_URL',
                                'ACTIONS_RESULTS_URL', 'ACTIONS_CACHE_SERVICE_V2']) {
              const value = process.env[name];
              if (!value) continue;
              if (name === 'ACTIONS_RUNTIME_TOKEN') core.setSecret(value);
              core.exportVariable(name, value);
            }
      - name: Build the builder image and save its layers
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          python scripts/native_release_docker.py --platform "$BUILD_PLATFORM" --builder-only \
            --builder-cache "release-builder-$BUILD_PLATFORM" --save-builder-cache
