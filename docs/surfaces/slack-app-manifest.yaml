_metadata:
  major_version: 2
  minor_version: 1
display_information:
  name: SuperTag
  description: Invoke a configured multiplayer AI teammate from a Slack thread.
  background_color: "#171717"
features:
  bot_user:
    display_name: SuperTag
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
settings:
  event_subscriptions:
    # Replace with your public HTTPS URL that forwards to the Gateway's Slack listener.
    request_url: https://YOUR_PUBLIC_HOST/slack/events
    bot_events:
      - app_mention
      - message.channels
  org_deploy_enabled: false
  socket_mode_enabled: false
  is_hosted: false
  token_rotation_enabled: false
