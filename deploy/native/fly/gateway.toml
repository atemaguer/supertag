# SuperTag Gateway on Fly.io: the public native gRPC endpoint for operators and Worker Hosts.
# Port 443 passes raw TCP to the Gateway (handlers = []): the Gateway terminates TLS with its
# own certificate, so gRPC over HTTP/2 and optional client certificates reach it unchanged.
# It reaches the Control Plane privately over mutual TLS. Deploy the hosted image by digest:
#   fly deploy --config deploy/native/fly/gateway.toml --image IMAGE@sha256:DIGEST
# Secrets: gateway.env from `supertag setup deployment fly`, plus SUPERTAG_TLS_CERT_PEM,
# SUPERTAG_TLS_KEY_PEM, SUPERTAG_SERVER_CA_PEM, SUPERTAG_CLIENT_CERT_PEM, and
# SUPERTAG_CLIENT_KEY_PEM. Run exactly one Machine: its volume holds checkpoints and the file
# credential vault.
app = "supertag-gateway"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[deploy]
  strategy = "immediate"

[processes]
  app = "gateway --listen [::]:3434 --control-plane https://supertag-control-plane.internal:3435 --checkpoint-directory /var/lib/supertag/checkpoints"

[[mounts]]
  source = "supertag_gateway_state"
  destination = "/var/lib/supertag"

[[services]]
  protocol = "tcp"
  internal_port = 3434
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = []

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
