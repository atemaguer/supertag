# SuperTag Gateway on Fly.io, for collaboration surfaces. Optional: deploy it only to connect
# Slack, GitHub, Linear, Lark, or Microsoft Teams. It defines no public service; it reaches the
# Control Plane over the 6PN network as an ordinary client. Deploy the hosted image by digest:
#   fly deploy --config deploy/native/fly/gateway.toml --image IMAGE@sha256:DIGEST
# Secrets: gateway.env from `supertag setup deployment fly`, which holds the Gateway's enrolled
# credential (gateway:local), plus SUPERTAG_SERVER_CA_PEM when the Control Plane's certificate
# comes from a private CA, and SUPERTAG_CLIENT_CERT_PEM and SUPERTAG_CLIENT_KEY_PEM only when the
# Control Plane requires client certificates. Run exactly one Machine: its volume holds
# the file credential vault and connector state.
app = "supertag-gateway"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[deploy]
  strategy = "immediate"

[processes]
  app = "gateway --listen 127.0.0.1:3436 --control-plane https://supertag-control-plane.internal:3434"

[[mounts]]
  source = "supertag_gateway_state"
  destination = "/var/lib/supertag"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
