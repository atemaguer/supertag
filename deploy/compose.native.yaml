# Native split services.
# Supply per-role env files and TLS directories; no credentials belong in this file.
# The Control Plane uses the database in its env file's SUPERTAG_DATABASE_URL. To run PostgreSQL
# here instead, add deploy/compose.native.postgres.yaml.
# The internal network intentionally publishes no ports. deploy/compose.native.ingress.yaml
# publishes the Control Plane, the public endpoint for operators, Worker Hosts, and Gateways.
# The Gateway, for collaboration surfaces, runs only with `--profile gateway`.
services:
  control-plane:
    image: ${SUPERTAG_CONTROL_IMAGE:?provide the verified native Control Plane image}
    command: ["control-plane", "--listen", "0.0.0.0:3434", "--checkpoint-directory", "/var/lib/supertag/checkpoints"]
    env_file: ${SUPERTAG_CONTROL_ENV_FILE:?provide the private Control Plane env file}
    volumes:
      - control-state:/var/lib/supertag
      - type: bind
        source: ${SUPERTAG_CONTROL_TLS_DIRECTORY:?provide the Control Plane TLS directory}
        target: /run/supertag-tls
        read_only: true
    read_only: true
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [runtime]
    healthcheck:
      test: ["CMD", "/usr/local/bin/supertag", "health", "--endpoint", "https://control-plane:3434"]
      interval: 2s
      timeout: 8s
      retries: 30
      start_period: 2s
    stop_grace_period: 15s

  gateway:
    profiles: [gateway]
    image: ${SUPERTAG_GATEWAY_IMAGE:?provide the verified native Gateway image}
    command: ["gateway", "--listen", "127.0.0.1:3436", "--control-plane", "https://control-plane:3434"]
    env_file: ${SUPERTAG_GATEWAY_ENV_FILE:?provide the private Gateway env file}
    volumes:
      - gateway-state:/var/lib/supertag
      - type: bind
        source: ${SUPERTAG_GATEWAY_TLS_DIRECTORY:?provide the Gateway TLS directory}
        target: /run/supertag-tls
        read_only: true
    read_only: true
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=0700"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    networks: [runtime]
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/supertag", "health", "--endpoint", "http://127.0.0.1:3436", "--service", "supertag.runtime.v2.OperatorNotificationTest"]
      interval: 2s
      timeout: 8s
      retries: 30
      start_period: 2s
    stop_grace_period: 15s

networks:
  runtime:
    internal: true
volumes:
  control-state:
  gateway-state:
