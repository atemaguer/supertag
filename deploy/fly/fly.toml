# Generated by deploy/generate.ts. Select the app with --app and its region below.
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "deploy/docker/Dockerfile"

[deploy]
  release_command = "node dist/index.js migrate"
  strategy = "immediate"

[env]
  SUPERTAG_DEPLOYMENT_PLATFORM = "fly"
  SUPERTAG_STATE_DIR = "/var/lib/supertag"
  SUPERTAG_WORKLET_TRANSPORT = "remote"
  SUPERTAG_DEPLOYMENT_RPC_TRANSPORT = "websocket"
  SUPERTAG_CREDENTIAL_VAULT = "file"
  PORT = "3434"

[[mounts]]
  source = "supertag_state"
  destination = "/var/lib/supertag"

[http_service]
  internal_port = 3434
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
