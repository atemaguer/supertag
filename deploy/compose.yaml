name: supertag

x-supertag-image: &supertag-image
  image: ${SUPERTAG_IMAGE:-supertag:local}
  build:
    context: ..
    dockerfile: deploy/docker/Dockerfile

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: supertag
      POSTGRES_USER: supertag
      POSTGRES_PASSWORD: ${SUPERTAG_POSTGRES_PASSWORD:?set SUPERTAG_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${SUPERTAG_POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supertag -d supertag"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - supertag-postgres:/var/lib/postgresql/data

  migrate:
    <<: *supertag-image
    command: ["node", "dist/index.js", "migrate"]
    environment:
      SUPERTAG_DATABASE_URL: postgresql://supertag:${SUPERTAG_POSTGRES_PASSWORD}@postgres:5432/supertag
      SUPERTAG_STATE_DIR: /var/lib/supertag
    depends_on:
      postgres:
        condition: service_healthy

  control-plane:
    <<: *supertag-image
    command: ["node", "dist/index.js", "up", "--foreground", "control-plane"]
    environment:
      SUPERTAG_DATABASE_URL: postgresql://supertag:${SUPERTAG_POSTGRES_PASSWORD}@postgres:5432/supertag
      SUPERTAG_STATE_DIR: /var/lib/supertag
      SUPERTAG_WORKLET_TRANSPORT: remote
      SUPERTAG_ADMIN_TOKEN: ${SUPERTAG_ADMIN_TOKEN:?set SUPERTAG_ADMIN_TOKEN in .env}
    ports:
      - "${SUPERTAG_GATEWAY_BIND:-127.0.0.1}:${SUPERTAG_GATEWAY_PORT:-3434}:3434"
    volumes:
      - supertag-state:/var/lib/supertag
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3434/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  supertag-postgres:
  supertag-state:
