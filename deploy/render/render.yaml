services:
  - type: web
    name: supertag-control-plane
    runtime: docker
    dockerfilePath: ./deploy/docker/Dockerfile
    dockerContext: .
    preDeployCommand: node dist/index.js migrate
    dockerCommand: node dist/index.js up --foreground control-plane
    healthCheckPath: /healthz
    envVars:
      - key: SUPERTAG_DATABASE_URL
        fromDatabase:
          name: supertag-postgres
          property: connectionString
      - key: SUPERTAG_DEPLOYMENT_PLATFORM
        value: render
      - key: SUPERTAG_STATE_DIR
        value: /var/lib/supertag
      - key: SUPERTAG_WORKLET_TRANSPORT
        value: remote
      - key: SUPERTAG_DEPLOYMENT_RPC_TRANSPORT
        value: websocket
      - key: SUPERTAG_CREDENTIAL_VAULT
        value: file
      - key: SUPERTAG_COORDINATION_URL
        sync: false
      - key: SUPERTAG_ADMIN_TOKEN
        sync: false
    disk:
      name: supertag-state
      mountPath: /var/lib/supertag
      sizeGB: 1
databases:
  - name: supertag-postgres
    databaseName: supertag
    user: supertag
    ipAllowList: []
