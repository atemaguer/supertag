# Publishes the Control Plane, and only the Control Plane, from deploy/compose.native.yaml:
#   docker compose -f deploy/compose.native.yaml -f deploy/compose.native.ingress.yaml up -d
# The Control Plane terminates TLS itself; its certificate must name the host clients use.
# PostgreSQL and the Gateway stay on the internal network with no published port.
services:
  control-plane:
    networks: [runtime, ingress]
    ports:
      - "${SUPERTAG_CONTROL_PLANE_PUBLISH:-127.0.0.1:3434}:3434"

networks:
  ingress: {}
