message HarnessExecutionProfile {
  repeated string model_ids = 1;
  optional string default_model = 2;
  bool allow_unsandboxed_commands = 3;
  bool remote_file_workspace = 4;
  repeated McpServerCapability mcp_servers = 5;
  SharedExecutionCapability shared_execution = 6;
  bool declared_task_outputs = 7;
  bool task_artifact_inputs = 8;
  repeated WorkspaceMountCapability workspace_mounts = 9;
  // OAuth MCP servers whose login lapsed on this host. They are advertised here instead of in
  // `mcp_servers`, so Tasks that need them wait for `supertag mcp login NAME`.
  repeated string mcp_login_servers = 1800;
  // Names of the network credentials this host injects through its egress proxy. Only names;
  // the values never leave the host.
  repeated string network_credentials = 1900;
  // This Claude Code lane can run Claude Code's own sandbox (macOS, or Linux with bubblewrap and
  // socat), which sends sandboxed commands' traffic only to the egress proxy.
  bool network_sandbox = 1901;
  // With `remote_file_workspace`: the sandbox provider is an operator's own
  // (`--workspace-provider`), not E2B or Modal. SuperTag has not verified that it keeps a
  // network scope, so placement never gives it a Task with one.
  bool unverified_workspace_provider = 2000;
  // This host's remote Workspace provider relays sandbox traffic to the Attempt's egress proxy,
  // so a remote lane can apply a network scope.
  bool remote_egress_relay = 1902;
  // File Volumes this host maps and writes to directly. The Control Plane derives the label
  // `volume:ID` for each; the host checks its mapping against the registered source before it
  // writes.
  repeated VolumeMapping volumes = 2100;
  // This Claude Code lane runs commands in Claude Code's own operating-system sandbox
  // (`sandbox-commands`), confined to the Task's Workspace and path scope with no network beyond
  // its web:fetch grant. It runs Tasks with commands:execute without `allow_unsandboxed_commands`,
  // keeps their hidden paths from commands, and is preferred over an unsandboxed lane.
  bool command_sandbox = 2200;
}

