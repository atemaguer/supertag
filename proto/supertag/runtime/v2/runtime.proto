  HARNESS_KIND_UNSPECIFIED = 0;
  HARNESS_KIND_CODEX = 1;
  HARNESS_KIND_CLAUDE_CODE = 2;
  HARNESS_KIND_OPENAI_AGENTS = 3;
  HARNESS_KIND_OPENCODE = 4;
  HARNESS_KIND_CURSOR = 5;
}

message PutTagRequest {
  string tag_id = 1;
  string instructions = 2;
  repeated string allowed_actions = 3;
  WorkspaceSpec workspace = 4;
  HarnessKind harness_kind = 5;
  repeated ApprovalRule approval_rules = 6;
  PolicyExecutionSettings execution = 7;
  // A display name can be reused after retirement. The Tag ID is permanent.
  optional string name = 8;
  // Zero requires a new identity; a positive value fences an existing revision.
  optional uint64 expected_revision = 9;
  // Makes this the Control Plane's lead Tag, or not. At most one active Tag is the lead, and
  // `supertag init` makes the Tag it creates the lead. Omitted keeps the current value; a new
  // Tag is not the lead.
  optional bool lead = 6600;
  // How many Work Sessions the Tag may have open at once, across all its conversations and
  // Objectives; from 1 to 64. Omitted keeps the current value; a new Tag gets 8.
  optional uint32 max_work_sessions = 6700;
  // Whether the Tag keeps memory: its harness's own memory, which the Worker Host keeps, and a
  // daily review of its work. Omitted keeps the current value; a new Tag keeps memory.
  optional bool memory = 6800;
  // At most how many of the Tag's Task Attempts start per period. Omitted keeps the current
  // value; `starts` 0 removes the limit. A new Tag has none.
  optional StartRate start_rate = 7000;
  // The Volume that keeps the Tag's work beyond any one Worker Host: a copy of every capture of
  // its Tasks, written by the capturing host directly. A capture fails when its copy cannot be
  // written. Omitted keeps the current value; empty removes it. A new Tag has none.
  optional string volume = 7100;
}

// A cap on how often a Tag's Task Attempts start: at most `starts` in any `per_ms` window. A
// Task over it stays queued until the window has room; a person's turn always starts, and
// counts.
message StartRate {
  // 1 to 10,000; 0 in PutTagRequest removes the limit.
  uint32 starts = 1;
  // 1 minute to 7 days.
  uint64 per_ms = 2;
}

message Tag {
  string tag_id = 1;
  string instructions = 2;
  repeated string allowed_actions = 3;
  uint64 revision = 4;
  WorkspaceSpec workspace = 5;
  HarnessKind harness_kind = 6;
  repeated ApprovalRule approval_rules = 7;
  PolicyExecutionSettings execution = 8;
  string name = 9;
  optional int64 retired_at_ms = 10;
  // Labels a bound Worker Host must carry to run this Tag's Tasks.
  repeated string runs_on = 1400;
  // Whether this is the Control Plane's lead Tag: the default Tag `supertag init` creates, which
  // clients show first. At most one active Tag is the lead.
  bool lead = 6600;
  // How many Work Sessions the Tag may have open at once.
  uint32 max_work_sessions = 6700;
  // How many Work Sessions the Tag has open now, when the Tag is read with GetTag or ListTags.
  uint32 open_work_sessions = 6701;
  // Whether the Tag keeps memory (see PutTagRequest.memory).
  bool memory = 6800;
  // When the Tag last queued a daily review of one of its memory stores.
  optional int64 memory_reviewed_at_ms = 6801;
  // How the Tag's unprompted messages were received over the last `window_days`; read with GetTag.
  AttentionSummary attention = 6900;
  // The Tag's start rate, when it has one.
  StartRate start_rate = 7000;
  // The Volume that keeps the Tag's work (see PutTagRequest.volume); empty for none.
  string volume = 7100;
  // How many of its Task Attempts started in the start rate's current window; read with GetTag.
  uint32 starts_in_window = 7001;
  // What Worker Hosts hold of the Tag's harness-native memory, newest first; read with GetTag.
  repeated NativeMemoryStore native_memory = 7200;
  // Its working Objectives that sit idle, which the caller may see; read with GetTag.
  repeated IdleObjective idle_objectives = 7300;
}

// A working Objective whose owner's last turn left nothing running and asked nothing.
message IdleObjective {
  string objective_id = 1;
  string outcome = 2;
  int64 idle_since_ms = 3;
}

// A Tag's unprompted messages: the replies of turns no person asked for (Schedule fires and
// Objective notices) that reached a person, and the checks that found nothing and stayed quiet.
message AttentionSummary {
  uint32 posted = 1;
  // Posted messages a person read in their conversation; surfaces have no read receipts.
  uint32 read = 2;
  // Posted messages a person answered in the same Session within a day.
  uint32 answered = 3;
  uint32 quiet = 4;
  uint32 window_days = 5;
}

message ListTasksRequest {
  string tag_id = 1;
  string session_id = 2;
  // Most Tasks on one page: 20 when 0, at most 100.
  uint32 limit = 3;
  // The cursor the previous page returned; empty for the first page.
  string cursor = 4;
}

message ListTasksResponse {
  repeated Task tasks = 1;
  // Empty on the last page.
  string next_cursor = 2;
}

message ListTagsRequest {
  uint32 limit = 1;
  string cursor = 2;
  bool include_retired = 3;
}

message ListTagsResponse {
  repeated Tag tags = 1;
  string next_cursor = 2;
}

message GetTagRequest {
  string tag_id = 1;
}

message RetireTagRequest {
  string tag_id = 1;
  bool dry_run = 2;
}

message RetireTagResponse {
  Tag tag = 1;
  repeated string blockers = 2;
  uint64 surface_locations = 3;
  uint64 host_bindings = 4;
  uint64 mailbox_grants = 5;
  uint64 role_assignments = 6;
}

// The caller's conversation with one Tag.
message Conversation {
  string tag_id = 1;
  // Identifies the conversation. It changes only when the conversation is replaced, such as when
  // the Control Plane's state is reset, so a client discards a copy kept under another ID.
  string conversation_id = 2;
  // The Session the next message continues.
  string session_id = 3;
  // The latest message's text, at most 200 characters: the Tag's reply when it has one,
  // otherwise the caller's message.
  string preview = 4;
  // The preview is the Tag's reply.
  bool preview_from_tag = 5;
  // When the latest message was sent or answered.
  int64 last_activity_at_ms = 6;
  // The latest message's order.
  uint64 latest_order = 7;
  // How far the caller has read, as a message order; zero when it never has.
  uint64 read_order = 8;
  // Finished replies after `read_order`, without quiet turns.
  uint32 unread_count = 9;
  // A Task of this conversation is queued or running.
  bool working = 10;
  // Set when the latest message is a Work Session's report turn, which has no caller message.
  optional string latest_work_session_report_id = 11;
  // The latest message is the Tag's question, still unanswered: its turn asked an Objective
  // question that waits for an answer.
  bool asking = 12;
}

message ConversationMessage {
  Task task = 1;
  LiveInput live_input = 3;
  // Set for a report turn in the conversation, which has no operator message.
  optional string work_session_report_id = 4;
  // What the turn shows beside its prompt and result, oldest first: every message the Tag wrote
  // while it ran, and its latest activity or plan event. Its last event is the turn's latest, so
  // a client follows a running turn with Operator.ListEvents after that sequence. Every event is
  // in Operator.ListEvents.
  repeated TaskEvent events = 5;
  // Set when the turn's earliest messages were left out to keep the page within its size
  // limit. Operator.ListEvents reads them.
  bool events_truncated = 6;
  // The message's place in its conversation. Later messages have larger orders.
  uint64 order = 7;
  // When the Control Plane accepted the message; zero when it did not record it.
  int64 sent_at_ms = 8;
  // When the turn finished, if it has.
  optional int64 completed_at_ms = 9;
  // Set for a turn a Schedule queued, which has no operator message: the conversation shows
  // only its reply.
  optional string schedule_id = 10;
  // For a report turn whose Work Session has since closed: why it closed.
  WorkSessionCloseReason work_session_close_reason = 11;
}

message ListConversationsRequest {}

message ListConversationsResponse {
  // The latest active first.
  repeated Conversation conversations = 1;
}

// Without `after`, a page of the conversation, newest first, before `cursor`. With `after` and
// the `conversation_id` the client's copy came from, only what changed since: messages after
// that order, and the current state of `refresh_task_ids`, the turns the copy holds unfinished.
message ListMessagesRequest {
  string tag_id = 1;
  uint32 limit = 3;
  string cursor = 4;
  uint64 after = 5;
  string conversation_id = 6;
  // At most 128.
  repeated string refresh_task_ids = 7;
}

message ListMessagesResponse {
  // Newest first.
  repeated ConversationMessage messages = 1;
  string next_cursor = 2;
  // Empty before the caller's first message to the Tag.
  string conversation_id = 3;
  // The page holds only changes after the request's `after`. Otherwise it is the newest page,
  // which replaces any copy the client kept: the conversation was replaced, or more than a page
  // of messages arrived since.
  bool incremental = 4;
}

message SendMessageRequest {
  string tag_id = 1;
  string text = 3;
  string operation_id = 4;
  ExecutionLimits execution_limits = 5;
  TaskOutputPolicy output_policy = 6;
}

// As ListMessagesRequest with `after`: the conversation the client's copy came from, the latest
// message order it holds, and the turns it holds unfinished. A client without a copy sends none,
// and the first response is the newest page. A client that reconnects sends what it holds: the
// stream replays what changed after it, then pushes. When that cannot be replayed, because the
// conversation was replaced or more than a page arrived since, the first response is the newest
// page, not incremental, and the client replaces its copy with it.
message FollowConversationRequest {
  string tag_id = 1;
  string conversation_id = 2;
  uint64 after = 3;
  // At most 128.
  repeated string refresh_task_ids = 4;
}

message FollowConversationResponse {
  // Set when messages changed. With `incremental` it holds only the messages that changed;
  // otherwise it is the newest page, which replaces any copy the client kept.
  ListMessagesResponse messages = 1;
  // Why queued turns still wait for a Worker Host, once a turn has waited a moment; an empty
  // reason says an earlier one no longer holds. Sent to operators only.
  repeated TurnWait waits = 2;
  // The text of the message a running turn's Tag is writing now, as it is written. It is never
  // stored: the message, once recorded as one of the turn's events, or the turn's result replaces
  // it. Empty text clears what was shown.
  repeated TurnText texts = 3;
}

message TurnWait {
  string task_id = 1;
  string reason = 2;
}

message TurnText {
  string task_id = 1;
  // The turn's event the text follows; the message it becomes has a later sequence.
  uint64 after_sequence = 2;
  string text = 3;
}

message MarkConversationReadRequest {
  string tag_id = 1;
  // The order of the latest message read. A smaller order than one recorded before changes
  // nothing.
  uint64 order = 2;
}

message GetMessageRequest {
  string tag_id = 1;
  string task_id = 2;
}

message SubmitTaskRequest {
  string tag_id = 1;
  string session_id = 2;
  string operation_id = 3;
  string prompt = 4;
  ExecutionLimits execution_limits = 5;
  TaskOutputPolicy output_policy = 6;
  repeated TaskArtifactInputSelection input_artifacts = 7;
}

message ReportedCostLimit {
  string currency = 1;
  uint64 amount_minor = 2;
}

message ExecutionLimits {
  optional uint64 max_reported_tokens = 1;
  ReportedCostLimit max_reported_cost = 2;
  optional uint64 max_native_agents = 3;
}

message Task {
  string task_id = 1;
  string tag_id = 2;
  string session_id = 3;
  string prompt = 4;
  string instructions = 5;
  repeated string allowed_actions = 6;
  uint64 tag_revision = 7;
  TaskState state = 8;
  optional string result = 9;
  optional string attempt_id = 10;
  WorkspaceSpec workspace = 11;
  WorkspaceDeliveryReference workspace_delivery = 12;
  HarnessKind harness_kind = 13;
  repeated ApprovalRule approval_rules = 14;
  TaskPolicySnapshot policy_snapshot = 15;
  // Accepted once when work is queued. Subsequent usage changes later allocations.
  ExecutionLimits execution_limits = 16;
  ExecutionSelection execution_selection = 17;
  AttemptExecutionSelection attempt_execution = 18;
  repeated ArtifactSelection artifacts = 19;
  // Optional output requirements frozen when the Task is accepted.
  TaskOutputPolicy output_policy = 20;
  repeated AcceptedTaskArtifactInput input_artifacts = 21;
  // The turn succeeded quietly: it found nothing that needs attention, so nothing was posted and
  // its conversation does not show it. Its result says why.
  bool quiet = 22;
  reserved 3500;
  // Limits the current Attempt's adapter confirmed it applies, and how; absent until it does.
  AppliedExecutionLimits applied_execution_limits = 5001;
  // What each Attempt's read-write Workspace copies wrote back to their Volumes. Set only by
  // GetTask; the Control Plane records the summary, never the bytes.
  repeated AttemptWorkspaceMountWrites workspace_mount_writes = 5100;
  // What the current Attempt's durable records show about its limits and its cleanup. Set only
  // by GetTask.
  TaskExecutionReport execution_report = 5200;
  // Each Attempt's network log from its Worker Host's egress proxy, for a Task with a network
  // scope. Set only by GetTask.
  repeated AttemptNetworkLog network_logs = 5300;
  // The Worker Host holding the Session's last delivery, which the running Attempt waits for
  // before its harness starts: that host is not connected. Cleared when the Attempt goes on or
  // a new Attempt claims the Task.
  optional string waiting_for_holder = 5400;
}

message ReportWaitingForHolderRequest {
  InspectAttemptRequest attempt = 1;
  // True while the Attempt waits for the holder of its Session's last delivery; false once its
  // Workspace is prepared.
  bool waiting = 2;
}

// How the current Attempt ended against its execution limits.
enum ExecutionLimitOutcome {
  EXECUTION_LIMIT_OUTCOME_UNSPECIFIED = 0;
  // No limit was requested or applied.
  EXECUTION_LIMIT_OUTCOME_NOT_REQUESTED = 1;
  // The Attempt has not ended and no threshold was reached yet.
  EXECUTION_LIMIT_OUTCOME_PENDING = 2;
  EXECUTION_LIMIT_OUTCOME_WITHIN_LIMITS = 3;
  EXECUTION_LIMIT_OUTCOME_THRESHOLD_REACHED = 4;
  // The Attempt ended, but its records cannot show whether every limit held.
  EXECUTION_LIMIT_OUTCOME_UNKNOWN = 5;
}

// One limited dimension of the current Attempt. Unspecified: the dimension has no limit.
enum ExecutionThreshold {
  EXECUTION_THRESHOLD_UNSPECIFIED = 0;
  EXECUTION_THRESHOLD_NOT_REACHED = 1;
  EXECUTION_THRESHOLD_REACHED = 2;
  // No applied limit, or no observation that decides it.
  EXECUTION_THRESHOLD_UNDETERMINED = 3;
}

// Whether the current Attempt's execution was proven stopped.
enum AttemptCleanup {
  ATTEMPT_CLEANUP_UNSPECIFIED = 0;
  // No Attempt, or one whose execution never started.
  ATTEMPT_CLEANUP_NOT_STARTED = 1;
  // The Attempt still holds execution authority.
  ATTEMPT_CLEANUP_PENDING = 2;
  // The host confirmed execution stopped, or an operator recorded that it did.
  ATTEMPT_CLEANUP_CONFIRMED = 3;
  // Execution may still be running: the host could not confirm cleanup or lost its authority.
  ATTEMPT_CLEANUP_UNKNOWN = 4;
}

message TaskExecutionReport {
  ExecutionLimitOutcome limit_outcome = 1;
  ExecutionThreshold max_reported_tokens = 2;
  ExecutionThreshold max_reported_cost = 3;
  ExecutionThreshold max_native_agents = 4;
  // Every requested limit has an applied limit at or below it.
  bool limits_applied = 5;
  // Whether the Attempt's usage records are final. Absent when no token or cost limit applies.
  optional bool usage_complete = 6;
  // The report classifies every limited dimension of an ended Attempt.
  bool complete = 7;
  AttemptCleanup cleanup = 8;
  // The host's redacted reasons when it could not confirm cleanup: at most 8, each at most 160
  // characters. Cleared when the host later confirms cleanup.
  repeated string cleanup_failure = 9;
  // Why the Worker Host failed the Attempt, behind the Task's fixed result: the host's redacted
  // reasons, at most 8, each at most 160 characters. Shown to operators only; empty for every
  // other caller and when the host gave none.
  repeated string failure_detail = 10;
}

message ReportCleanupFailureRequest {
  InspectAttemptRequest attempt = 1;
  repeated string reasons = 2;
}

message ReportCleanupFailureResponse {}

// One request the Attempt's egress proxy decided. Never headers or bodies; the path has no query
// and is redacted by the host.
message NetworkRequestRecord {
  int64 at_ms = 1;
  string method = 2;
  // `https://name[:port]`.
  string origin = 3;
  string path = 4;
  bool allowed = 5;
  // Why a request was denied; empty when allowed.
  string reason = 6;
  // The upstream's HTTP status; 0 when the request never reached it.
  uint32 status = 7;
  // The credential name injected into the request, or empty.
  string credential = 8;
}

// The first requests an Attempt's egress proxy decided, with totals.
message NetworkLog {
  repeated NetworkRequestRecord requests = 1;
  uint64 allowed = 2;
  uint64 denied = 3;
  // Requests counted but not kept, beyond the host's limit.
  uint64 unrecorded = 4;
}

message AttemptNetworkLog {
  string attempt_id = 1;
  NetworkLog log = 2;
}

// The Attempt's network log so far. Each report replaces the previous one.
message ReportNetworkLogRequest {
  reserved 1;
  reserved "attempt";
  NetworkLog log = 2;
}

message ReportNetworkLogResponse {}

// Where a client can read a Task's files itself. The Control Plane returns locations only, never
// file content: today a running Attempt's local checkout, when the caller is on the Worker Host's
// own machine (contributing/client-file-access-design.md, slice 1).
service TaskFiles {
  rpc Locate(LocateTaskFilesRequest) returns (TaskFileLocations);
}

message LocateTaskFilesRequest {
  string task_id = 1;
  // The caller's own ~/.supertag/machine-id; empty when it has none.
  string machine_id = 2;
}

message TaskFileLocations {
  repeated TaskFileLocation locations = 1;
}

message TaskFileLocation {
  // Stable for the Attempt: the client keeps one view per location.
  string id = 1;
  oneof kind {
    // An absolute directory on the caller's own machine, which it lists and reads itself.
    TaskFilesLocalPath local_path = 2;
  }
  // The files can still change: the Attempt is running.
  bool live = 6;
  // Set instead of a location the caller can read, such as "Files on Worker Host laptop are
  // unreachable from here".
  string unavailable_reason = 7;
  // The Worker Host that holds the files.
  string host_id = 8;
}

message TaskFilesLocalPath {
  string path = 1;
}

