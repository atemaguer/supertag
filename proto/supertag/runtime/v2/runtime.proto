  // Task of a Tag that names `base_ref` has it empty until its first Attempt resolves the branch.
  string base_commit = 2;
  // A remote Workspace's settings, set by admission from the catalog, never accepted from PutTag
  // input. Absent for a Workspace a Worker Host maps from a local repository.
  Workspace remote = 3;
  repeated WorkspaceCopyMount mounts = 4;
  // Servers the Workspace's `.mcp.json` declares that its Tasks may use. Each Attempt reads them
  // from a Worker-owned snapshot of `base_commit`, never from the Task worktree.
  repeated string mcp_servers = 1800;
  // A local Workspace branch the Tag follows instead of a pinned commit. A Session's first
  // Attempt resolves it on its Worker Host through `ResolveWorkspaceRef`, and every Task of the
  // Session keeps that commit.
  string base_ref = 5;
  // Set only on a merge follow-up Task: the target commit its Session must merge. The Worker
  // Host starts the merge in the checkout, leaving conflict markers, and records the Task's
  // commit with this commit as its second parent.
  string merge_commit = 6;
  // The Tag's name and SuperTag no-reply address that author the Session's commits, and the
  // requester as a `Co-authored-by` trailer value. Set by admission, never accepted from input.
  string author_name = 7;
  string author_email = 8;
  string co_author = 9;
}

message WorkspaceCopyMount {
  string volume_id = 1;
  string destination = 2;
  uint64 max_bytes = 3;
  // Resolved and frozen by the Control Plane at Task admission.
  WorkspaceVolume volume = 4;
  // The Worker Host writes changed and created files back to the Volume after a successful
  // Attempt. Requires `files:write`.
  bool read_write = 5100;
}

message WorkspaceMountCapability {
  string volume_id = 1;
  string source = 2;
  string destination_root = 3;
  // The credential name an object-store mapping holds; empty for file Volumes.
  string credential = 5100;
}

message WorkspaceVolume {
  string volume_id = 1;
  string source = 2;
  uint64 revision = 3;
  // The name of the credential each Worker Host maps to reach an object-store source, never its
  // value. Empty for file Volumes, whose host mapping is the consent.
  string credential = 5100;
}

enum WorkspaceMountWriteStatus {
  WORKSPACE_MOUNT_WRITE_STATUS_UNSPECIFIED = 0;
  // Every changed and created file was written.
  WORKSPACE_MOUNT_WRITE_STATUS_COMPLETE = 1;
  // Writing stopped at the first failure; `files` lists what was written.
  WORKSPACE_MOUNT_WRITE_STATUS_PARTIAL = 2;
  // The change set exceeded a bound, so nothing was written.
  WORKSPACE_MOUNT_WRITE_STATUS_REFUSED = 3;
}

message WorkspaceMountWrittenFile {
  // Path relative to the Volume source, with `/` separators.
  string key = 1;
  uint64 size = 2;
  // Lowercase hex SHA-256 of the written bytes.
  string sha256 = 3;
}

// One read-write copy's write-back, reported by the Worker Host that ran the Attempt.
message WorkspaceMountWrite {
  string volume_id = 1;
  string destination = 2;
  WorkspaceMountWriteStatus status = 3;
  repeated WorkspaceMountWrittenFile files = 4;
  // Files unchanged since the copy.
  uint64 skipped = 5;
  // The failed or refused key and why; empty when complete. A refusal
  // whose entry has no Volume key names its nearest directory, or none
  // for the copy root.
  string error_key = 6;
  string error_reason = 7;
  // Changed keys not written, including a non-empty `error_key`.
  repeated string not_attempted = 8;
}

message AttemptWorkspaceMountWrites {
  string attempt_id = 1;
  repeated WorkspaceMountWrite writes = 2;
}

message WorkspaceSourceBundle {
  Workspace workspace = 1;
  BlobReference bundle = 2;
  // The commit the bundle holds: the Workspace's pinned commit, or the Task's merge commit.
  string commit = 3;
}

message DownloadWorkspaceSourceRequest {
  InspectAttemptRequest attempt = 1;
  // The Task's `merge_commit` instead of its base commit.
  bool merge = 2;
}

message VerifyWorkspaceOutputRemoteRequest {
  InspectAttemptRequest attempt = 1;
  string commit = 2;
}

message VerifyWorkspaceOutputRemoteResponse {
  optional string remote = 1;
}

enum WorkspaceGitPermission {
  WORKSPACE_GIT_PERMISSION_UNSPECIFIED = 0;
  WORKSPACE_GIT_PERMISSION_READ = 1;
  // Push a landing the calling Worker Host holds the lease of: only with `landing`.
  WORKSPACE_GIT_PERMISSION_PUSH = 2;
}

message MintWorkspaceGitAccessRequest {
  InspectAttemptRequest attempt = 1;
  // The Task's `merge_commit` instead of its base commit.
  bool merge = 2;
  WorkspaceGitPermission permission = 3;
  // Instead of `attempt`, for PUSH: a landing the calling Worker Host has claimed, and its
  // lease token (a `WorkspaceLandingLease`).
  string landing_id = 4;
  string landing_lease_token = 5;
  // Instead of the Attempt's own source, for READ: the delivery of a review request this Attempt
  // reviews, read from its Session's branch.
  string review_id = 6;
}

// What a Worker Host needs to read one commit of a remote Workspace. The credential lives only in
// the Worker Host's memory for the operation; it never reaches a harness or a sandbox.
message WorkspaceGitGrant {
  // The Workspace as the Task recorded it, and the commit this Attempt may read.
  Workspace workspace = 1;
  string commit = 2;
  // Absent for a remote that needs none, such as a `file://` repository.
  oneof credential {
    HttpsGitCredential https = 3;
    SshGitCredential ssh = 4;
  }
  // When a minted token expires, in milliseconds since the epoch; 0 for a credential that does not.
  int64 expires_at_ms = 5;
  // For a review read: the Session branch that holds the commit.
  string branch = 6;
}

// An HTTPS user name and token: a GitHub App token minted for this one repository and permission,
// or the Workspace Credential's own token.
message HttpsGitCredential {
  string username = 1;
  string token = 2;
}

// The Workspace Credential's SSH private key, and the server host keys to trust when it names them.
message SshGitCredential {
  string private_key = 1;
  string known_hosts = 2;
}

message BlobReference {
  string sha256 = 1;
  uint64 byte_length = 2;
}

message WorkspaceDeliveryReference {
  string workspace_id = 1;
  string delivery_id = 2;
  string base_commit = 3;
  string start_commit = 4;
  string head_commit = 5;
  bool committed = 6;
  uint64 changed_files = 7;
  BlobReference patch = 8;
  BlobReference bundle = 9;
}

message WorkspaceDeliveryRequest {
  InspectAttemptRequest attempt = 1;
  WorkspaceDeliveryReference delivery = 2;
}

message WorkspaceContinuation {
  WorkspaceDeliveryReference delivery = 1;
  BlobHolder holder = 2;
}

message WorkspaceDownload {
