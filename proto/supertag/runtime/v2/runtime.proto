  repeated string workspace_ids = 2;
  HarnessKind harness_kind = 3;
  repeated ContextContract context_contracts = 4;
  HarnessExecutionProfile execution_profile = 5;
  repeated string gateway_workspace_ids = 6;
  // How long the Control Plane may hold a claim that finds no Task, waiting for one; it answers
  // as soon as one can be claimed. Zero answers at once. The Control Plane holds a claim for at
  // most 8 seconds, and a host's claims beyond a few at once are answered at once.
  uint32 wait_ms = 7;
}

message ClaimTaskResponse {
  Assignment assignment = 1;
}

message Assignment {
  Task task = 1;
  string attempt_id = 2;
  string lease_token = 3;
  // Later messages from the same Session that this Attempt answers together with `task`,
  // oldest first. The Worker Host renders them into the harness prompt.
  repeated JoinedMessage joined = 4;
  // The harness-native memory store this Attempt may use, if any.
  NativeMemoryGrant native_memory = 5;
  // The Tag's Volume when it names one, as of the claim: where the host writes the Attempt's
  // captures and, for a file Volume, which of its own mappings it uses.
  AssignedVolume volume = 6;
  // Set when an earlier Attempt of this Task was interrupted after its harness started and the
  // Task was queued again. The Worker Host tells the harness in its prompt.
  Redelivery redelivery = 7;
}

// What a redelivered Attempt is told about the Attempts of its Task that were interrupted.
message Redelivery {
  // How many earlier Attempts of this Task were interrupted and run again.
  uint32 interrupted_attempts = 1;
  // What those Attempts already said to the person, their message events, oldest first.
  repeated string already_said = 2;
}

// A Tag's harness-native memory: the files a harness keeps itself, such as Claude Code's
// auto-memory. Worker Hosts keep the files, one store per Tag, harness, and audience (shared,
// or private to one person's conversations); the Control Plane keeps only this record of what
// each host holds. A host that is gone takes its copy with it.
message NativeMemoryStore {
  string tag_id = 1;
  // The harness that writes it, such as `claude-code`.
  string harness = 2;
  // Unset for the shared store; the principal whose conversations a private store serves.
  optional string audience = 3;
  // The Worker Host holding this copy.
  string host_id = 4;
  // Increases with every turn that changed the copy.
  uint64 revision = 5;
  uint32 files = 6;
  uint64 bytes = 7;
  // SHA-256 over the copy's paths and contents.
  string digest = 8;
  int64 updated_at_ms = 9;
  // The turn that last reported it.
  string task_id = 10;
  // Set when this is the store on the Tag's Volume, which any host that reaches the Volume uses;
  // `host_id` is then empty and `digest` is the SHA-256 of the store's manifest.
  string volume_id = 11;
}

// The harness-native store a turn may use, sent with its Assignment. Absent when the Tag keeps
// no memory, when an outside event such as a webhook started the turn, or when the turn has no
// audience.
message NativeMemoryGrant {
  // The store within the Tag and harness: `shared`, or `person-` and a digest of the principal.
  string scope = 1;
  // A host drops copies of this Tag's stores made before the Tag's latest reset.
  uint64 reset_generation = 2;
  // When the Tag names a Volume, the store lives there instead of on the host: `volume_head` is
  // its current manifest, unset while the store on this Volume is empty. A host reads the manifest
  // and the files it names as NATIVE_MEMORY_BLOB objects, and after the turn writes the new ones
  // and moves the head with AttemptMemory.AdvanceNative.
  NativeMemoryVolumeHead volume_head = 3;
  // Memory the host writes into the store before the turn starts, once, and then acknowledges
  // with AttemptMemory.AcknowledgeSeeds: the notes this Tag kept before its harness's own memory
  // became its memory, for this audience. Granted only to a turn on the Tag's own harness whose
  // changes are kept.
  repeated NativeMemorySeed seeds = 4;
  // Whether what the turn changes in the store is the Tag's own (AttemptCapabilities.memory_trusted).
  // Otherwise the host keeps the turn's changes beside the store as proposals, which the Tag's
  // review of that store merges or drops.
  bool trusted = 5;
}

// One memory to write into a store as the harness's own: a Claude Code memory file, a Codex ad
// hoc note.
message NativeMemorySeed {
  string seed_id = 1;
  // At most 500 characters.
  string text = 2;
  int64 created_at_ms = 3;
}

// A native memory store's current manifest on the Tag's Volume. The manifest is an immutable
// blob: JSON `{"files": {PATH: {"sha256": HEX, "bytes": N}}}`, PATH relative to the store and
// `/`-separated. Only this pointer changes, so no reader sees a half-written store.
message NativeMemoryVolumeHead {
  // Increases with every turn that changed the store.
  uint64 revision = 1;
  BlobReference manifest = 2;
}

message AssignedVolume {
  string volume_id = 1;
  // `file:///…` or `s3://bucket/prefix`.
  string source = 2;
  uint64 revision = 3;
}

