  optional uint64 budget_limit_minor = 7;
  optional string budget_currency = 8;
  // An Objective names no Team: its Session reaches other Tags only through its Tag's inbox.
  reserved 9;
  reserved "team_id";
  // Omit to capture the owner's current runtime grants. An empty selection grants none.
  RuntimeActions runtime_actions = 10;
  // A surface Task whose thread gets the Objective's limit notices and completion
  // report, in place of the thread it was started in or the deployment default.
  optional string notification_task_id = 5300;
}

