service AttemptTaskFiles {
  rpc ReportLocation(ReportTaskFilesLocationRequest) returns (ReportTaskFilesLocationResponse);
}

message ReportTaskFilesLocationRequest {
  reserved 1;
  reserved "attempt";
  // The checkout's absolute path on the host.
  string local_path = 2;
}

message ReportTaskFilesLocationResponse {}

