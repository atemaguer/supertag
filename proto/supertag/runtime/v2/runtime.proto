  REPLY_STATE_UNCERTAIN = 5;
}

message Reply {
  string reply_id = 1;
  string task_id = 2;
  string account_id = 3;
  ReplyDestination destination = 4;
  string text = 5;
  ReplyState state = 6;
  optional string provider_receipt = 7;
  // Verified delivery data the Surface may show beside the text. Set only on a claim.
  ReplyResultCard result_card = 1200;
  // A delivered acknowledgement this final reply replaces in place. Set only on a claim.
  optional string replace_provider_receipt = 1201;
}

// A completed Work Session's verified delivery, reported to the Session that started it.
message ReplyResultCard {
  optional string branch = 1;
  optional string pull_request_url = 2;
}

message ClaimReplyRequest {
  string operation_id = 1;
  // How long the Control Plane may hold a claim that finds no ready reply, waiting for one; it
  // answers as soon as one is ready. Zero answers at once. The Control Plane holds a claim for at
  // most 8 seconds, and answers at once beyond a few held claims per account. A held claim that
  // finds nothing writes nothing.
  uint32 wait_ms = 2;
  // The account's current connector ownership lease. Only its owner claims replies.
  string connector_lease_token = 1300;
}

message ClaimReplyResponse {
  Reply reply = 1;
  string lease_token = 2;
}

message SettleReplyRequest {
  string reply_id = 1;
  string lease_token = 2;
  ReplyState state = 3;
  optional string provider_receipt = 4;
}

// A claim is never automatically reassigned. Expiry exposes an uncertain delivery.
message RenewReplyRequest { string reply_id = 1; string lease_token = 2; }
message ReplyLease { uint64 valid_for_ms = 1; }
message GetReplyDeliveryRequest { string reply_id = 1; }
message ReplyDeliveryAudit {
  string kind = 1;
  string principal = 2;
  string evidence = 3;
  int64 recorded_at_ms = 4;
  ReplyState state = 5;
  optional string provider_receipt = 6;
}
message ReplyDelivery {
  Reply reply = 1;
  optional int64 lease_expires_at_ms = 2;
  repeated ReplyDeliveryAudit audit = 3;
}
message ListReplyDeliveriesRequest {
  string account_id = 1;
  ReplyState state = 2;
  uint32 limit = 3;
  int64 before_order = 4;
}
message ListReplyDeliveriesResponse {
  repeated ReplyDelivery deliveries = 1;
  int64 next_before_order = 2;
}
// Evidence-backed reconciliation only. Pending/Claimed/Uncertain are not decisions.
message ResolveReplyRequest {
  string reply_id = 1;
  string operation_id = 2;
  ReplyState state = 3;
  optional string provider_receipt = 4;
  string evidence = 5;
}

// Exact, revocable cross-Objective approval provenance on an accepted input.
message ArtifactPublicationPin {
  string publication_id = 1;
  uint64 publication_revision = 2;
  string consumption_id = 3;
  uint64 consumption_revision = 4;
  string source_objective_id = 5;
  string destination_objective_id = 6;
}

// A stable owner ID survives a Gateway restart with the same private state, so
// the restarted process reclaims at once. Any other owner waits for release or expiry.
message ClaimConnectorRequest { string owner_id = 1; }
message RenewConnectorRequest { string lease_token = 1; }
message ReleaseConnectorRequest { string lease_token = 1; }
message ReleaseConnectorResponse {}
message ConnectorLease {
  bool granted = 1;
  string lease_token = 2;
  uint64 fence = 3;
  uint64 valid_for_ms = 4;
  // Set when another owner holds the account.
  uint64 retry_after_ms = 5;
}
