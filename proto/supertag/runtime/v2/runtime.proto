}

message Objective {
  string objective_id = 1;
  string owner_tag_id = 2;
  string session_id = 3;
  string outcome = 4;
  bool ongoing = 5;
  string starting_task_id = 6;
  ObjectiveStatus status = 7;
  uint64 revision = 8;
  optional int64 deadline_ms = 9;
  optional uint64 budget_limit_minor = 10;
  optional string budget_currency = 11;
  optional int64 paused_at_ms = 12;
  optional uint64 reported_spend_minor = 13;
  reserved 14;
  reserved "team_id";
  RuntimeActions runtime_actions = 15;
  // The owner's or operator's assessment recorded when the Objective was
  // submitted for review or completed.
  optional string completion_summary = 3800;
  optional int64 cancelled_at_ms = 3801;
  optional string cancellation_reason = 3802;
  // The principal that created it, such as `operator:local` or
  // `client:alice-laptop`. Empty for an Objective a surface thread started.
  string created_by = 4100;
  // The surface Task an operator chose for the Objective's notices.
  optional string notification_task_id = 5300;
  // Set while a working Objective sits idle: when its owner's turn last ended with nothing
  // running and nothing asked. It stays working; only report_objective changes its status from a
  // turn, and new work clears this.
  optional int64 idle_since_ms = 7100;
}

// How often Tags may wake each other through messages; an unset value keeps the default. People's
// messages never count. Over a limit, notes wait for the recipient's next turn and questions and
// blockers are delivered later; nothing is dropped.
message TeamWakeLimits {
  // Wakes between two Tags for one originating Task, both directions (default 3).
  optional uint32 mutual_per_task = 1;
  // Tag-originated wakes of one Tag per hour (default 20).
  optional uint32 per_tag_per_hour = 2;
  // Tag-originated wakes in one Objective per hour (default 60).
  optional uint32 per_objective_per_hour = 3;
}

