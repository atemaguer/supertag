syntax = "proto3";

package supertag.runtime.v2;

import "supertag/runtime/v2/policy.proto";
import "supertag/runtime/v2/workspaces.proto";
import "supertag/runtime/v2/mcp.proto";

// The Control Plane's public endpoint serves these services to operators,
// clients and enrolled hosts. Its API tier authenticates every caller and calls
// the state owner with the same messages.
service Operator {
  rpc CreateAuthKey(CreateAuthKeyRequest) returns (AuthKey);
  rpc ListHosts(ListHostsRequest) returns (ListHostsResponse);
  rpc GetHost(GetHostRequest) returns (WorkerHostStatus);
  rpc SetHostDraining(SetHostDrainingRequest) returns (WorkerHostStatus);
  rpc PutTag(PutTagRequest) returns (Tag);
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc SubmitTask(SubmitTaskRequest) returns (Task);
  rpc GetTask(GetTaskRequest) returns (Task);
  // The Tasks the caller may see, newest first, optionally of one Tag or Session.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc GetSessionDelivery(GetSessionDeliveryRequest) returns (SessionDelivery);
  rpc ListNativeUsage(ListNativeUsageRequest) returns (ListNativeUsageResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc CancelTask(CancelTaskRequest) returns (Task);
  // Records a decision for an uncertain Task Attempt. An operator decides for any Task it sees;
  // a client only for its own conversation's turn once the host confirmed execution stopped.
  rpc ResolveAttempt(ResolveAttemptRequest) returns (AttemptResolution);
  rpc GetTag(GetTagRequest) returns (Tag);
  rpc RetireTag(RetireTagRequest) returns (RetireTagResponse);
  rpc GetReplyDelivery(GetReplyDeliveryRequest) returns (ReplyDelivery);
  rpc ListReplyDeliveries(ListReplyDeliveriesRequest) returns (ListReplyDeliveriesResponse);
  rpc ResolveReply(ResolveReplyRequest) returns (ReplyDelivery);
}

// An operator or client has one conversation with each Tag it may talk to, and reads and sends
// its messages here.
service Conversations {
  // The caller's conversations, one per Tag it has talked to, with what a conversation list
  // shows: the latest message, when it was active, unread replies, and whether the Tag works.
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc SendMessage(SendMessageRequest) returns (ConversationMessage);
  rpc GetMessage(GetMessageRequest) returns (ConversationMessage);
  // Records that the caller has read its conversation with a Tag up to a message.
  rpc MarkConversationRead(MarkConversationReadRequest) returns (Conversation);
  // Follows the caller's conversation with a Tag as it changes. The first response holds what
  // changed since the client's copy, as ListMessages does with `after`; each later one holds what
  // changed since the response before it: new messages, and turns whose state, events or result
  // changed. A response with nothing set is a heartbeat, sent at least every 15 seconds.
  rpc FollowConversation(FollowConversationRequest) returns (stream FollowConversationResponse);
}

// Operator-visible invalidation notices. Task event replay has its own cursor.
service OperatorEvents {
  rpc Watch(WatchRequest) returns (stream WatchEvent);
}

// Applies owned Tag relationships under one serialized Control Plane write.
service ManifestRelationships {
  rpc ReconcileTag(ReconcileTagRelationshipsRequest) returns (ReconcileTagRelationshipsResponse);
  rpc ProvisionTags(ProvisionTagsRequest) returns (ProvisionTagsResponse);
  // Records an apply set's members and, with prune, removes the members its
  // input no longer declares, all in one serialized Control Plane write.
  rpc ReconcileApplySet(ReconcileApplySetRequest) returns (ReconcileApplySetResponse);
  // Checks and records which manager (an apply set, default apply) owns each
  // field a manifest sets. Changing a field another manager owns, or one
  // changed outside apply since, is a conflict unless forced.
  rpc ReconcileManifestFields(ReconcileManifestFieldsRequest) returns (ReconcileManifestFieldsResponse);
}

// One field a manifest sets, by its manifest path, with SHA-256 hex digests
// of its stored and declared values. An empty digest is an unset field.
message ManifestField {
  string path = 1;
  string current_digest = 2;
  string desired_digest = 3;
}

message ManifestFieldResource {
  // SurfaceAccount, Volume, Workspace, ContextSet, PermissionSet, Role, Tag,
  // Team or SurfaceLocation.
  string kind = 1;
  // The manifest's metadata.name.
  string name = 2;
  repeated ManifestField fields = 3;
}

message ReconcileManifestFieldsRequest {
  // An apply set name; empty is the default manager, apply.
  string manager = 1;
  repeated ManifestFieldResource resources = 2;
  // Takes ownership of conflicting fields instead of reporting them.
  bool force_conflicts = 3;
  // Reports conflicts and records nothing.
  bool preview = 4;
}

message ManifestFieldConflict {
  string kind = 1;
  string name = 2;
  string path = 3;
  // The owning manager; cli for a value set outside apply.
  string manager = 4;
}

message ReconcileManifestFieldsResponse {
  // Without force: when any field conflicts, nothing is recorded.
  repeated ManifestFieldConflict conflicts = 1;
}

// One resource an apply set's input declares. Kinds are SurfaceLocation,
// Team, Tag, Role, PermissionSet, ContextSet, Workspace and Volume.
message ApplySetDeclaration {
  string kind = 1;
  // The manifest's metadata.name.
  string name = 2;
  // The resource's revision as this apply left it: the revision its write
  // returned, or the revision it planned against when it did not write.
  uint64 revision = 3;
  // True when this apply is about to create the resource. Declaring a missing
  // resource as created claims it for the set before the write, and the next
  // reconcile that finds it records it as a member. Only a resource an apply
  // set claimed joins it; an existing resource is never adopted.
  bool created = 4;
}

message ReconcileApplySetRequest {
  // 1 to 63 lowercase letters, digits, hyphens or underscores.
  string apply_set = 1;
  // Every resource of a prunable kind the input declares.
  repeated ApplySetDeclaration declared = 2;
  // Removes the set's members the input no longer declares.
  bool prune = 3;
  // Reports what reconciling would do and changes nothing.
  bool preview = 4;
}

enum ApplySetPruneAction {
  APPLY_SET_PRUNE_ACTION_UNSPECIFIED = 0;
  // The member is deleted, or retired for a Tag or Role.
  APPLY_SET_PRUNE_ACTION_DELETE = 1;
  // The member is still in use. It stays in the set for the next prune.
  APPLY_SET_PRUNE_ACTION_KEEP = 2;
  // Another writer changed the member after this apply set last applied it,
  // or the set claimed it but never recorded creating it. It is left in place
  // and leaves the set.
  APPLY_SET_PRUNE_ACTION_RELEASE = 3;
  // The member no longer exists. It leaves the set.
  APPLY_SET_PRUNE_ACTION_FORGET = 4;
}

message ApplySetPrune {
  string kind = 1;
  string name = 2;
  ApplySetPruneAction action = 3;
  // For KEEP and RELEASE: why.
  string reason = 4;
}

message ReconcileApplySetResponse {
  // In removal order: dependents before what they use.
  repeated ApplySetPrune pruned = 1;
}

// Creates the declared Tags and their policy relationships atomically. A Tag
// that already exists is left as-is.
message ProvisionTagsRequest {
  repeated ProvisionTag tags = 1;
}

message ProvisionTag {
  PutTagRequest tag = 1;
  repeated string role_ids = 2;
  repeated string mailbox_senders = 3;
}

message ProvisionTagsResponse {}

message ReconcileTagRelationshipsRequest {
  string tag_id = 1;
  // An empty manager denotes the default apply manager.
  string manager = 2;
  repeated string role_ids = 3;
  repeated string mailbox_senders = 4;
  bool preview = 5;
  // The Tag's runsOn labels this manager declares, merged by value: a label another manager or
  // the CLI added stays. Unset leaves every label alone.
  optional TagRunsOnLabels runs_on = 5500;
}

message TagRunsOnLabels {
  repeated string labels = 1;
}

message ManifestRelationshipChange {
  string path = 1;
  bool present = 2;
  // True if the relationship already matches and only ownership changes.
  bool ownership_only = 3;
}

message ReconcileTagRelationshipsResponse {
  repeated ManifestRelationshipChange changes = 1;
}

enum WatchKind {
  WATCH_KIND_UNSPECIFIED = 0;
  WATCH_KIND_TAG = 1;
  WATCH_KIND_TASK = 2;
  // A message in a conversation, or its principal marking the conversation read. The change's
  // tag_id names the conversation.
  WATCH_KIND_CONVERSATION_MESSAGE = 3;
  WATCH_KIND_OBJECTIVE = 4;
  WATCH_KIND_TEAM = 5;
  WATCH_KIND_WORKSTREAM_POST = 6;
  // A Schedule was created or changed: paused, resumed, fired, done, or cancelled. The change's
  // tag_id names its Tag.
  WATCH_KIND_SCHEDULE = 7;
  reserved 8;
  reserved "WATCH_KIND_MEMORY";
  // A Tag's direct message to another Tag (Mailbox). The change's id names the message, its
  // tag_id the recipient, and its objective_id the sender's Objective. A Workstream post addressed
  // to a Tag is a WATCH_KIND_WORKSTREAM_POST change only.
  WATCH_KIND_MAILBOX_MESSAGE = 9;
}

enum WatchReason {
  WATCH_REASON_UNSPECIFIED = 0;
  WATCH_REASON_CREATED = 1;
  WATCH_REASON_CHANGED = 2;
  WATCH_REASON_DELETED = 3;
}

message WatchRequest {
  string resume_token = 1;
  repeated WatchKind kinds = 2;
}

message WatchEvent {
  string resume_token = 1;
  oneof update {
    WatchHeartbeat heartbeat = 2;
    WatchResync resync = 3;
    WatchChange change = 4;
  }
}

message WatchHeartbeat {}
message WatchResync {}

message WatchChange {
  WatchKind kind = 1;
  string id = 2;
  string tag_id = 3;
  string session_id = 4;
  string objective_id = 5;
  string team_id = 6;
  int64 changed_at_ms = 8;
  WatchReason reason = 9;
}

service Objectives {
  rpc CreateObjective(CreateObjectiveRequest) returns (Objective);
  rpc GetObjective(GetObjectiveRequest) returns (Objective);
  rpc ListObjectives(ListObjectivesRequest) returns (ListObjectivesResponse);
  rpc ListCommitReviews(ListObjectiveCommitReviewsRequest) returns (ListObjectiveCommitReviewsResponse);
  rpc SetLimits(SetObjectiveLimitsRequest) returns (Objective);
  rpc SetRuntimeActions(SetObjectiveRuntimeActionsRequest) returns (Objective);
  rpc PauseObjective(ObjectiveActionRequest) returns (Objective);
  rpc ResumeObjective(ObjectiveActionRequest) returns (Objective);
  rpc CancelObjective(ObjectiveActionRequest) returns (Objective);
  rpc ReviewObjective(ReviewObjectiveRequest) returns (Objective);
  // An operator completes an Objective with an assessment of its outcome.
  rpc CompleteObjective(CompleteObjectiveRequest) returns (Objective);
}

service Inbox {
  rpc ListItems(ListInboxItemsRequest) returns (ListInboxItemsResponse);
  rpc GetQuestion(GetQuestionRequest) returns (ObjectiveQuestion);
  rpc AnswerQuestion(AnswerQuestionRequest) returns (Task);
  rpc GetApproval(GetApprovalRequest) returns (Approval);
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  rpc DecideApproval(DecideApprovalRequest) returns (Approval);
}

enum InboxItemKind {
  INBOX_ITEM_KIND_UNSPECIFIED = 0;
  INBOX_ITEM_KIND_QUESTION = 1;
  INBOX_ITEM_KIND_OBJECTIVE_BUDGET = 2;
  INBOX_ITEM_KIND_OBJECTIVE_LIMIT = 3;
  INBOX_ITEM_KIND_TASK_ATTENTION = 4;
  INBOX_ITEM_KIND_APPROVAL = 5;
  // Tags hit a wake limit: their messages waited for a later turn instead of waking the recipient.
  INBOX_ITEM_KIND_WAKE_LIMIT = 6;
  // A queued Task needs an OAuth MCP server whose login lapsed on every Worker Host serving it.
  INBOX_ITEM_KIND_MCP_LOGIN = 1800;
}

message ListInboxItemsRequest {
  string objective_id = 1;
  InboxItemKind kind = 2;
  uint32 page_size = 3;
  string cursor = 4;
}

message ListInboxItemsResponse {
  int64 as_of_ms = 1;
  repeated InboxItem items = 2;
  string next_cursor = 3;
  repeated InboxItemKind truncated_kinds = 4;
}

message InboxItem {
  string key = 1;
  string occurrence = 2;
  InboxItemKind kind = 3;
  string objective_id = 4;
  string task_id = 5;
  optional string attempt_id = 6;
  bool operator_eligible = 7;
  int64 actionable_since_ms = 8;
  string reason = 9;
  InboxQuestion question = 10;
  InboxApproval approval = 11;
  // Whether the operator heard about this item: through this operator's notify
  // destinations or, for a budget or limit item, the Objective's notice thread.
  InboxNotification notification = 5300;
  // For a TASK_ATTENTION item about an uncertain Task Attempt: what it blocks, what its Worker
  // Host confirmed, and whether SuperTag settles it on its own.
  InboxUncertainAttempt uncertain_attempt = 5400;
}

// An uncertain Task Attempt waiting for a decision. Its Session runs no later turn until then.
message InboxUncertainAttempt {
  string tag_id = 1;
  string session_id = 2;
  // The Session's queued Tasks that wait for this decision.
  uint32 blocked_tasks = 3;
  // The Task execution report of the Attempt, as the caller may read it.
  TaskExecutionReport execution_report = 4;
  // When SuperTag will record it as failed on its own: its host confirmed it stopped and it
  // recorded no effect a person must judge. Zero when a person must decide.
  int64 auto_resolve_at_ms = 5;
  // Why a person must decide, such as an effect the Attempt recorded. Empty when it is settled
  // automatically.
  string held_reason = 6;
}

enum InboxNotificationStatus {
  INBOX_NOTIFICATION_STATUS_UNSPECIFIED = 0;
  // No destination is configured for this item.
  INBOX_NOTIFICATION_STATUS_NOT_CONFIGURED = 1;
  INBOX_NOTIFICATION_STATUS_PENDING = 2;
  INBOX_NOTIFICATION_STATUS_DELIVERED = 3;
  INBOX_NOTIFICATION_STATUS_FAILED = 4;
  reserved 5;
  reserved "INBOX_NOTIFICATION_STATUS_UNAVAILABLE";
}

message InboxNotification {
  InboxNotificationStatus status = 1;
  // Where it was delivered, the next retry, or why it failed.
  string reason = 2;
}

message InboxApproval {
  string approval_id = 1;
  string tag_id = 2;
  string action = 3;
  string resource = 4;
  string summary = 5;
}

message ApprovalRule {
  string action = 1;
  repeated string operator_ids = 2;
}

enum ApprovalState {
  APPROVAL_STATE_UNSPECIFIED = 0;
  APPROVAL_STATE_PENDING = 1;
  APPROVAL_STATE_APPROVED = 2;
  APPROVAL_STATE_DENIED = 3;
  APPROVAL_STATE_EXPIRED = 4;
}

enum ApprovalScope {
  APPROVAL_SCOPE_UNSPECIFIED = 0;
  APPROVAL_SCOPE_ONCE = 1;
  APPROVAL_SCOPE_OBJECTIVE = 2;
}

message Approval {
  string approval_id = 1;
  string task_id = 2;
  string attempt_id = 3;
  string tag_id = 4;
  string session_id = 5;
  optional string objective_id = 6;
  string action = 7;
  string arguments_digest = 8;
  string summary = 9;
  // Who may decide: operators by operator ID, such as `local`, and clients by `client:NAME`.
  // Empty means any operator and no client.
  repeated string operator_ids = 10;
  ApprovalState state = 11;
  ApprovalScope scope = 12;
  int64 requested_at_ms = 13;
  optional int64 decided_at_ms = 14;
  // The principal that decided it, such as `operator:local` or `client:alice-laptop`.
  optional string decided_by = 15;
  optional string reason = 16;
  optional int64 valid_until_ms = 17;
  optional int64 consumed_at_ms = 18;
  optional string continuation_task_id = 19;
  string resource = 20;
  string canonical_arguments_json = 21;
  optional string grant_approval_id = 22;
  optional int64 covered_at_ms = 23;
}

message GetApprovalRequest { string approval_id = 1; }

message ListApprovalsRequest {
  string objective_id = 1;
  string task_id = 2;
  ApprovalState state = 3;
  uint32 limit = 4;
  string cursor = 5;
}

message ListApprovalsResponse {
  repeated Approval approvals = 1;
  string next_cursor = 2;
}

message DecideApprovalRequest {
  string approval_id = 1;
  string operation_id = 2;
  bool approve = 3;
  ApprovalScope scope = 4;
  optional int64 valid_until_ms = 5;
  string reason = 6;
}

message RequestApprovalRequest {
  InspectAttemptRequest attempt = 1;
  string operation_id = 2;
  string action = 3;
  string arguments_json = 4;
  string summary = 5;
  string resource = 6;
}

message RequestApprovalResponse {
  Approval approval = 1;
  bool granted = 2;
}

message InboxQuestion {
  string text = 1;
  int64 asked_at_ms = 2;
  bool truncated = 3;
}

message GetQuestionRequest { string task_id = 1; }

message AnswerQuestionRequest {
  string task_id = 1;
  string operation_id = 2;
  string text = 3;
}

message ObjectiveQuestion {
  string task_id = 1;
  string attempt_id = 2;
  string objective_id = 3;
  string text = 4;
  int64 asked_at_ms = 5;
  optional int64 published_at_ms = 6;
  optional string answer_task_id = 7;
}

message AskQuestionRequest {
  reserved 1;
  reserved "attempt";
  string operation_id = 2;
  string text = 3;
}

message AttemptCapabilities {
  bool may_ask_objective_question = 1;
  bool may_use_workstream = 2;
  bool may_read_mailbox = 3;
  bool may_send_tag_message = 4;
  bool may_start_work_session = 5;
  bool may_continue_work_session = 6;
  bool may_ask_work_session_question = 7;
  // An Objective owner report may request review of its own child delivery.
  bool may_request_commit_review = 8;
  // A root turn reads the Tag's other Sessions and its Objectives
  // (AttemptTagSessions); a Work Session's own Task reads only its own Session
  // (`may_read_own_session`).
  bool may_read_tag_sessions = 9;
  // A person's `/goal <outcome>` message creates its Objective in the Control
  // Plane and never reaches a turn.
  reserved 10;
  reserved "may_create_objective";
  // The Tag's open Objectives and how to recall its other Sessions, for the
  // turn's context. State, not instructions. Empty when `may_read_tag_sessions` is false.
  string tag_portfolio = 11;
  // With `may_ask_objective_question`: the Objective is ongoing, so only an operator ends it
  // and its owner may report it ready for review or blocked, never completed.
  bool objective_ongoing = 12;
  // A root turn whose admitted actions include `schedule:create` may schedule a later turn of
  // its Tag in its Session (AttemptSchedules).
  bool may_schedule = 13;
  // The Control Plane's IANA time zone, in which `schedule` reads a time that names none.
  string time_zone = 14;
  // With `may_start_work_session`: how many Work Sessions the Tag has open, across all its
  // conversations and Objectives, and how many it may have (the Tag's `max_work_sessions`).
  uint32 open_work_sessions = 15;
  uint32 max_work_sessions = 16;
  // What this turn changes in its Tag's harness memory is kept as the Tag's own: a root turn or
  // the daily memory review of a Tag with memory that no outside event, such as a GitHub or
  // Linear webhook, started. Any other turn's changes become proposals the review merges or drops.
  bool memory_trusted = 17;
  // No person is waiting on this turn (a Schedule fire, a memory review, an inbox turn, or an
  // Objective notice), so it may finish quietly: FinishTaskRequest.quiet. A person's message is
  // always answered.
  bool may_stay_quiet = 18;
  // A Work Session's own Task rereads its own Session's earlier turns with `read_session` and
  // `read_turn` (AttemptTagSessions), and no other Session. Root turns have
  // `may_read_tag_sessions` instead.
  bool may_read_own_session = 19;
  // An Objective's Session asks its own Tag's inbox Session (AttemptMailbox.AskTag); the inbox
  // answers with SendMessage to the Objective, and the answer is the Objective's next turn. Only
  // the inbox Session and person conversations reach other Tags, so an Objective's Session has no
  // `may_send_tag_message`, `may_read_mailbox`, or `may_use_workstream`.
  bool may_ask_tag = 20;
}

// Operators see the work started in Sessions they can access.
service WorkSessions {
  rpc Get(GetWorkSessionRequest) returns (WorkSession);
  rpc List(ListWorkSessionsRequest) returns (ListWorkSessionsResponse);
  // Closes a Work Session, so it no longer counts toward its Tag's open Work Sessions. Continuing
  // a closed one reopens it when the Tag is under its limit. Closing a closed one changes nothing.
  rpc Close(CloseWorkSessionRequest) returns (WorkSession);
}

service AttemptWorkSessions {
  rpc Start(StartWorkSessionRequest) returns (WorkSession);
  rpc Continue(ContinueWorkSessionRequest) returns (WorkSession);
  rpc Ask(AskWorkSessionQuestionRequest) returns (WorkSessionQuestion);
  // The `close_session` tool, for a Work Session the turn's Tag started that the turn may see.
  rpc Close(CloseAttemptWorkSessionRequest) returns (WorkSession);
}

// Why a Work Session closed.
enum WorkSessionCloseReason {
  WORK_SESSION_CLOSE_REASON_UNSPECIFIED = 0;
  // Its Tag closed it with `close_session`.
  WORK_SESSION_CLOSE_REASON_TAG = 1;
  // An operator or client closed it.
  WORK_SESSION_CLOSE_REASON_OPERATOR = 2;
  // Its delivery was pulled into a repository with `supertag fetch`.
  WORK_SESSION_CLOSE_REASON_DELIVERY_PULLED = 3;
  // Its Objective closed.
  WORK_SESSION_CLOSE_REASON_OBJECTIVE_CLOSED = 4;
  // It had finished when SuperTag began counting open Work Sessions.
  WORK_SESSION_CLOSE_REASON_UPGRADE = 5;
  // Closed after 14 days without activity: no turn, continuation, or delivery change.
  // Continuing it reopens it when the Tag is under its limit.
  WORK_SESSION_CLOSE_REASON_IDLE = 6;
  // The pull request its review landing opened was merged.
  WORK_SESSION_CLOSE_REASON_MERGED = 7;
}

// An operator or client closes a Work Session it may see. `delivery_pulled` records that its
// delivery was pulled, as `supertag fetch` does.
message CloseWorkSessionRequest {
  string work_session_id = 1;
  bool delivery_pulled = 2;
}

message CloseAttemptWorkSessionRequest {
  reserved 1;
  reserved "attempt";
  string work_session_id = 2;
}

message WorkSession {
  string work_session_id = 1;
  string title = 2;
  string parent_tag_id = 3;
  string parent_session_id = 4;
  string starter_task_id = 5;
  string tag_id = 6;
  string latest_task_id = 7;
  TaskState latest_task_state = 8;
  optional string report_task_id = 9;
  TaskState report_task_state = 10;
  optional string objective_id = 11;
  WorkspaceDeliveryReference workspace_delivery = 12;
  uint64 created_order = 13;
  WorkSessionQuestion question = 14;
  // Set while it is closed. An open Work Session counts toward its parent Tag's
  // `max_work_sessions`. Only an idle close is undone: continuing it reopens it.
  optional int64 closed_at_ms = 15;
  WorkSessionCloseReason close_reason = 16;
}

message WorkSessionQuestion {
  string work_session_id = 1;
  string task_id = 2;
  string attempt_id = 3;
  string text = 4;
  int64 asked_at_ms = 5;
  optional int64 published_at_ms = 6;
  optional string answer_task_id = 7;
}

message StartWorkSessionRequest {
  reserved 1;
  reserved "attempt";
  string operation_id = 2;
  string title = 3;
  string instruction = 4;
  // A Work Session always works in its parent Task's Workspace.
  reserved 5;
  reserved "workspace_id";
  // A Work Session always runs on its parent Task's Tag: another Tag's work is that Tag's to take,
  // through its inbox.
  reserved 6;
  reserved "target_tag_id";
  // A built-in harness for the Work Session, such as `claude-code`: by default, the Tag's own.
  // The Work Session keeps it for its whole life.
  optional string harness = 7;
}

message GetWorkSessionRequest {
  string work_session_id = 1;
  // Select the child Task and report from this turn of the Work Session.
  optional string report_task_id = 2;
}

message ContinueWorkSessionRequest {
  reserved 1;
  reserved "attempt";
  string operation_id = 2;
  string work_session_id = 3;
  string message = 4;
}

message AskWorkSessionQuestionRequest {
  reserved 1;
  reserved "attempt";
  string operation_id = 2;
  string text = 3;
}

message ListWorkSessionsRequest {
  string parent_tag_id = 1;
  string parent_session_id = 2;
  optional string starter_task_id = 3;
  uint32 limit = 4;
  string cursor = 5;
}

message ListWorkSessionsResponse {
  repeated WorkSession work_sessions = 1;
  string next_cursor = 2;
  // The parent Tag's open Work Sessions, across all its conversations and Objectives, and its
  // `max_work_sessions`.
  uint32 open_work_sessions = 3;
  uint32 max_work_sessions = 4;
}

service Teams {
  rpc CreateTeam(CreateTeamRequest) returns (Team);
  rpc GetTeam(GetTeamRequest) returns (Team);
  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse);
  rpc UpdateTeam(UpdateTeamRequest) returns (Team);
  rpc DeleteTeam(DeleteTeamRequest) returns (Team);
  rpc ListWorkstreamPosts(ListWorkstreamPostsRequest) returns (ListWorkstreamPostsResponse);
}

service AttemptWorkstreams {
  rpc ReadAttemptWorkstream(ReadAttemptWorkstreamRequest) returns (ReadAttemptWorkstreamResponse);
  rpc PostAttemptWorkstream(PostAttemptWorkstreamRequest) returns (PostAttemptWorkstreamResponse);
}

service Mailbox {
  rpc ListMessages(ListMailboxMessagesRequest) returns (ListMailboxMessagesResponse);
  rpc ChangeGrant(ChangeMailboxGrantRequest) returns (ChangeMailboxGrantResponse);
  rpc ListGrants(ListMailboxGrantsRequest) returns (ListMailboxGrantsResponse);
}

service AttemptMailbox {
  rpc ReadMailbox(ReadMailboxRequest) returns (ListMailboxMessagesResponse);
  rpc SendMessage(SendAttemptTagMessageRequest) returns (SendTagMessageResponse);
  // An Objective's turn asks its own Tag's inbox Session.
  rpc AskTag(AskAttemptTagRequest) returns (AskTagResponse);
}

message AskAttemptTagRequest {
  string operation_id = 1;
  string text = 2;
}

message AskTagResponse {
  // The stored message, in the Objective's conversation with its Tag.
  string message_id = 1;
  bool duplicate = 2;
  // Why the inbox Session was not woken now, such as a wake limit; empty when it was. The message
  // is stored either way.
  string wake_deferred = 3;
}

// What a Mailbox message is for. Questions and blockers wake their recipient sooner than notes.
// REVIEW marks a commit review request: the Control Plane sets it, and a request that names it is
// refused. Workstream posts have no type.
enum MessageKind {
  // Treated as a note.
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_NOTE = 1;
  MESSAGE_KIND_QUESTION = 2;
  MESSAGE_KIND_BLOCKER = 3;
  MESSAGE_KIND_EVIDENCE = 4;
  MESSAGE_KIND_DECISION = 5;
  MESSAGE_KIND_REVIEW = 6;
}

enum TagMessageOrigin {
  TAG_MESSAGE_ORIGIN_UNSPECIFIED = 0;
  TAG_MESSAGE_ORIGIN_DIRECT = 1;
  TAG_MESSAGE_ORIGIN_WORKSTREAM = 2;
}

enum TagMessageState {
  TAG_MESSAGE_STATE_UNSPECIFIED = 0;
  TAG_MESSAGE_STATE_PENDING = 1;
  TAG_MESSAGE_STATE_HANDLED = 2;
  TAG_MESSAGE_STATE_FAILED = 3;
}

message TagMessage {
  string message_id = 1;
  string sender_tag_id = 2;
  // Empty for an inbox Session's answer to one of its Tag's Objectives, which `objective_id`
  // names.
  string recipient_tag_id = 3;
  string source_task_id = 4;
  optional string workstream_post_id = 5;
  optional string objective_id = 6;
  string text = 7;
  uint32 hops = 8;
  optional string task_id = 9;
  TagMessageState state = 10;
  int64 created_at_ms = 11;
  TagMessageOrigin origin = 12;
  CommitReview review = 13;
  MessageKind kind = 14;
}

enum CommitReviewDecision {
  COMMIT_REVIEW_DECISION_UNSPECIFIED = 0;
  COMMIT_REVIEW_DECISION_APPROVED = 1;
  COMMIT_REVIEW_DECISION_CHANGES_REQUESTED = 2;
}

message CommitReviewSubmission {
  oneof kind {
    string commit = 1;
    CommitReviewResponse response = 2;
  }
}

message CommitReviewResponse {
  string request_id = 1;
  CommitReviewDecision verdict = 2;
}

message CommitReviewVerdict {
  CommitReviewDecision decision = 1;
  string summary = 2;
  string task_id = 3;
  int64 recorded_at_ms = 4;
}

message CommitReview {
  string request_id = 1;
  string objective_id = 2;
  string commit = 3;
  string workspace_id = 4;
  string source_task_id = 5; // Successful child Task that published this commit.
  string requester_tag_id = 6;
  string reviewer_tag_id = 7;
  int64 requested_at_ms = 8;
  CommitReviewVerdict verdict = 9;
}

message SendAttemptTagMessageRequest {
  reserved 1;
  reserved "attempt";
  string operation_id = 2;
  // Exactly one recipient: another Tag, or, from the inbox Session, one of its Tag's Objectives
  // that asked it.
  string recipient_tag_id = 3;
  string text = 4;
  CommitReviewSubmission review = 5;
  MessageKind kind = 6;
  string recipient_objective_id = 7;
}

message SendTagMessageResponse {
  TagMessage message = 1;
  bool duplicate = 2;
  Approval approval = 3;
  // A recorded verdict returns the original review without a new Mailbox message.
  CommitReview review = 4;
  // Why the message did not wake its recipient now, such as a wake limit; empty when it did or
  // needed no wake. The message is stored either way.
  string wake_deferred = 5;
}

message ChangeMailboxGrantRequest {
  string operation_id = 1;
  string sender_tag_id = 2;
  string recipient_tag_id = 3;
  bool granted = 4;
}

message ChangeMailboxGrantResponse { bool changed = 1; }

message ListMailboxGrantsRequest {
  string tag_id = 1;
  uint32 limit = 2;
  string cursor = 3;
}

message MailboxGrant {
  string sender_tag_id = 1;
  string recipient_tag_id = 2;
  string granted_by = 3;
  int64 granted_at_ms = 4;
}

message ListMailboxGrantsResponse {
  repeated MailboxGrant grants = 1;
  string next_cursor = 2;
}

message ListMailboxMessagesRequest {
  string tag_id = 1;
  uint32 limit = 2;
  string cursor = 3;
}

message ListMailboxMessagesResponse {
  repeated TagMessage messages = 1;
  string next_cursor = 2;
}

message ReadMailboxRequest {
  reserved 1;
  reserved "attempt";
  uint32 limit = 2;
  string cursor = 3;
}

// The Worker Host API. Lease operations are called with the host's enrolled credential; the data
// calls a running Attempt makes (events, text, questions, usage, milestones, its network log, its
// history, capabilities, and Context Item pins) with that Attempt's credential, which names it.
service WorkerHost {
  rpc RegisterHost(RegisterHostRequest) returns (HostRecord);
  rpc ReportHost(ReportHostRequest) returns (WorkerHostStatus);
  rpc ClaimTask(ClaimTaskRequest) returns (ClaimTaskResponse);
  rpc StartTask(StartTaskRequest) returns (StartTaskResponse);
  rpc InspectAttempt(InspectAttemptRequest) returns (Task);
  rpc GetAttemptCapabilities(GetAttemptCapabilitiesRequest) returns (AttemptCapabilities);
  rpc GetAttemptHistory(GetAttemptHistoryRequest) returns (AttemptHistory);
  rpc GetContextPins(GetContextPinsRequest) returns (ContextResolutionManifest);
  rpc CommitContextResolution(CommitContextResolutionRequest) returns (ContextResolutionManifest);
  rpc RenewAttempt(InspectAttemptRequest) returns (AttemptAuthority);
  rpc GetAttemptResolution(InspectAttemptRequest) returns (GetAttemptResolutionResponse);
  rpc ReportAttemptUsage(ReportAttemptUsageRequest) returns (ReportAttemptUsageResponse);
  rpc AppendEvent(AppendEventRequest) returns (TaskEvent);
  // The text of the message the running Attempt's Tag is writing now, redacted, while it is
  // written. The Control Plane keeps it in memory only and shows it to the turn's conversation
  // until the message is recorded as an event.
  rpc PublishText(PublishTaskTextRequest) returns (PublishTaskTextResponse);
  rpc AskQuestion(AskQuestionRequest) returns (ObjectiveQuestion);
  rpc FinishTask(FinishTaskRequest) returns (Task);
  // The restarted host of an interrupted Attempt proves every process it recorded for the
  // Attempt has stopped. Records a failed Attempt whose outcome stays unknown; never a retry.
  rpc ReclaimAttempt(ReclaimAttemptRequest) returns (AttemptResolution);
  // Limits the Attempt's adapter confirmed it applies, for the Task execution report.
  rpc ReportAppliedLimits(ReportAppliedLimitsRequest) returns (ReportAppliedLimitsResponse);
  // Why the host could not confirm the Attempt's cleanup, redacted by the host, for the Task
  // execution report. The Attempt stays uncertain until the host or an operator resolves it.
  rpc ReportCleanupFailure(ReportCleanupFailureRequest) returns (ReportCleanupFailureResponse);
  // The Attempt's egress proxy log, for the Task's network log. Each report replaces the last.
  rpc ReportNetworkLog(ReportNetworkLogRequest) returns (ReportNetworkLogResponse);
  // The commit the running Attempt's host resolved for its Task's Workspace `base_ref`. The first
  // resolution in a Session wins and is recorded on every unresolved Task of the Session; the
  // returned Task carries the recorded commit.
  rpc ResolveWorkspaceRef(ResolveWorkspaceRefRequest) returns (Task);
  // The running Attempt waits for the Worker Host holding its Session's last delivery, which is
  // not connected, or no longer waits. The Control Plane names that host from the delivery.
  rpc ReportWaitingForHolder(ReportWaitingForHolderRequest) returns (Task);
  // The Session checkpoint this Attempt may resume, and the Worker Host holding its bytes. The
  // Control Plane keeps only this metadata; the bytes stay with the host that wrote them.
  rpc GetCheckpoint(InspectAttemptRequest) returns (GetCheckpointResponse);
  // Records the checkpoint the calling host now holds for this Attempt, then commits it. The
  // holder is always the caller.
  rpc ReserveCheckpoint(CommitCheckpointRequest) returns (CheckpointReference);
  rpc CommitCheckpoint(CommitCheckpointRequest) returns (CheckpointReference);
  // The digests of the checkpoints the calling host holds that a Session still resumes, so it
  // deletes every other file it holds. Paged by digest.
  rpc ListHeldCheckpoints(ListHeldCheckpointsRequest) returns (ListHeldCheckpointsResponse);
  // A point the running Attempt reached, which the Control Plane stamps with its own clock for
  // `supertag metrics`. The first stamp of each milestone wins.
  rpc ReportAttemptMilestone(ReportAttemptMilestoneRequest) returns (ReportAttemptMilestoneResponse);
}

enum AttemptMilestone {
  ATTEMPT_MILESTONE_UNSPECIFIED = 0;
  // The Attempt's Workspace (checkout or sandbox) is ready for its tools.
  ATTEMPT_MILESTONE_WORKSPACE_READY = 1;
  // Its harness adapter attached to the Worker Host.
  ATTEMPT_MILESTONE_ADAPTER_ATTACHED = 2;
  // Its harness finished the turn; the Worker Host then captures and delivers the Workspace.
  ATTEMPT_MILESTONE_HARNESS_FINISHED = 3;
}

message ReportAttemptMilestoneRequest {
  reserved 1;
  reserved "attempt";
  AttemptMilestone milestone = 2;
  // With ATTEMPT_MILESTONE_HARNESS_FINISHED, when the harness finished the turn successfully and
  // it waits for no approval: the turn's reply, as FinishTask will report it, with its `quiet`
  // and `objective_signal`. The Control Plane shows the reply at once as the running Task's
  // result while the Worker Host finalizes, and keeps the quiet decision it makes now.
  optional string reply = 3;
  bool quiet = 4;
  ObjectiveSignal objective_signal = 5;
}

message ReportAttemptMilestoneResponse {}

message ListHeldCheckpointsRequest {
  // Digests after this one; empty for the first page.
  string after_sha256 = 1;
  // At most this many, 1 to 1000; 0 means 1000.
  uint32 limit = 2;
}

message ListHeldCheckpointsResponse {
  repeated string sha256 = 1;
  // Present when more follow: the next request's `after_sha256`.
  optional string next_after_sha256 = 2;
}

enum HostPhase {
  HOST_PHASE_UNSPECIFIED = 0;
  HOST_PHASE_PENDING = 1;
  HOST_PHASE_READY = 2;
  HOST_PHASE_BUSY = 3;
  HOST_PHASE_SUPPRESSED = 4;
  HOST_PHASE_OFFLINE = 5;
  HOST_PHASE_DRAINING = 6;
  HOST_PHASE_REVOKED = 7;
}

enum HostReadiness {
  HOST_READINESS_UNSPECIFIED = 0;
  HOST_READINESS_PENDING = 1;
  HOST_READINESS_READY = 2;
  HOST_READINESS_SUPPRESSED = 3;
}

enum HostReadinessReason {
  HOST_READINESS_REASON_UNSPECIFIED = 0;
  HOST_READINESS_REASON_STARTING = 1;
  HOST_READINESS_REASON_RECOVERY_REQUIRED = 2;
  HOST_READINESS_REASON_STOPPING = 3;
}

message ReportHostRequest {
  uint64 sequence = 1;
  uint32 capacity = 2;
  uint32 available_slots = 3;
  HostReadiness readiness = 4;
  HostReadinessReason reason = 5;
  HarnessKind harness_kind = 6;
  repeated string workspace_ids = 7;
  HarnessExecutionProfile execution_profile = 8;
  // Free space where the host allocates Workspaces and scratch, sampled with each report.
  HostDiskSpace disk_space = 2000;
  // Operating system, architecture and operator-declared placement labels.
  repeated string labels = 1400;
  // Each harness of a Host that serves several harnesses or Attempts at once. capacity and
  // available_slots above are then the Host's whole pool, which its harnesses share: each
  // entry is at most what one harness may run within it, and none exceeds the pool.
  repeated HostHarnessCapacity harnesses = 1500;
  // A random identifier of the machine and user the host runs as, from ~/.supertag/machine-id.
  // A client presenting the same identifier is on that machine and may read its Task files there.
  string machine_id = 2100;
}

message HostDiskSpace {
  uint64 free_bytes = 1;
  uint64 total_bytes = 2;
}

// One harness profile a Worker Host serves. capacity is how many of its Attempts may run at once
// within the Host's pool: the harness's own limit, or the whole pool when it has none.
// available_slots is how many more it can start now, at most the Host's free slots.
message HostHarnessCapacity {
  HarnessKind harness_kind = 1;
  HarnessExecutionProfile execution_profile = 2;
  uint32 capacity = 3;
  uint32 available_slots = 4;
}

// Stored form of a Host's reported harness slots.
message HostHarnessCapacities {
  repeated HostHarnessCapacity harnesses = 1;
}

message WorkerHostStatus {
  string host_id = 1;
  uint64 generation = 2;
  HostPhase phase = 3;
  bool draining = 4;
  uint32 capacity = 5;
  uint32 available_slots = 6;
  uint32 active_attempts = 7;
  HostReadinessReason reason = 8;
  HarnessKind harness_kind = 9;
  repeated string workspace_ids = 10;
  int64 enrolled_at_ms = 11;
  optional int64 last_seen_at_ms = 12;
  optional int64 presence_expires_at_ms = 13;
  optional int64 revoked_at_ms = 14;
  HarnessExecutionProfile execution_profile = 15;
  // From the current generation's latest report; absent until the host reports it.
  HostDiskSpace disk_space = 2000;
  // Every placement label: reported, derived, and granted by the Auth Key.
  repeated string labels = 1400;
  repeated string granted_labels = 1401;
  bool ephemeral = 1402;
  // Set when an offline ephemeral host was removed.
  optional int64 removed_at_ms = 1403;
  repeated HostHarnessCapacity harnesses = 1500;
  // Increases with every credential rotation, from 1.
  uint64 credential_revision = 3300;
  // Task Attempts of this host that may have executed and need an operator's recovery
  // decision: uncertain, or cancelled with execution cleanup not confirmed after the lease
  // lapsed. Each keeps a slot until it is resolved. At most 20 are listed, oldest first.
  repeated HostUncertainAttempt uncertain_attempts = 5400;
  uint32 total_uncertain_attempts = 5401;
}

message HostUncertainAttempt {
  string task_id = 1;
  string attempt_id = 2;
  HarnessKind harness_kind = 3;
  // Why the Attempt is uncertain, in words.
  string reason = 4;
  // When its execution lease lapsed.
  int64 since_ms = 5;
  // The host reported that its execution stopped, so `confirmed_stopped` is not needed.
  bool cleanup_observed = 6;
  // A cancelled Task can only be marked failed by recovery, never retried.
  bool cancelled = 7;
}

message ListHostsRequest {
  uint32 limit = 1;
  string cursor = 2;
}

message ListHostsResponse {
  repeated WorkerHostStatus hosts = 1;
  string next_cursor = 2;
}

message GetHostRequest { string host_id = 1; }

message SetHostDrainingRequest {
  string host_id = 1;
  bool draining = 2;
}

// Operator commands and durable history for input directed into a running Task.
service LiveInputs {
  rpc QueueInput(QueueInputRequest) returns (LiveInput);
  rpc GetInput(GetInputRequest) returns (LiveInput);
  rpc ResolveInput(ResolveInputRequest) returns (LiveInput);
}

// A separate lane for Worklets to take input and record native delivery evidence.
service AttemptInputs {
  rpc TakeInput(TakeInputRequest) returns (TakeInputResponse);
  rpc SettleInput(SettleInputRequest) returns (LiveInput);
}

// Gateway calls to the Control Plane. Each call names the connector account it
// acts for in the `x-supertag-connector-account` metadata header, and the
// Control Plane refuses an account that is not bound to the calling Gateway;
// provider request bodies cannot select it. See
// docs/reference/connector-contract.md.
service Connector {
  rpc AcceptEvent(AcceptEventRequest) returns (Task);
  rpc AcceptSlackEvent(AcceptSlackEventRequest) returns (AcceptSlackEventResponse);
  rpc AcceptGithubEvent(AcceptGithubEventRequest) returns (AcceptGithubEventResponse);
  rpc AcceptLinearEvent(AcceptLinearEventRequest) returns (AcceptLinearEventResponse);
  rpc AcceptLarkEvent(AcceptLarkEventRequest) returns (AcceptLarkEventResponse);
  rpc AcceptMicrosoftTeamsActivity(AcceptMicrosoftTeamsActivityRequest) returns (AcceptMicrosoftTeamsActivityResponse);
  rpc GetMicrosoftTeamsReplyRoute(GetMicrosoftTeamsReplyRouteRequest) returns (MicrosoftTeamsReplyRoute);
  rpc ClaimReply(ClaimReplyRequest) returns (ClaimReplyResponse);
  rpc RenewReply(RenewReplyRequest) returns (ReplyLease);
  rpc SettleReply(SettleReplyRequest) returns (Reply);
  // One fenced Gateway owns an account's outbound delivery. A draining Gateway
  // releases ownership so another Gateway takes over without waiting for expiry.
  rpc ClaimConnector(ClaimConnectorRequest) returns (ConnectorLease);
  rpc RenewConnector(RenewConnectorRequest) returns (ConnectorLease);
  rpc ReleaseConnector(ReleaseConnectorRequest) returns (ReleaseConnectorResponse);
}

// Attempt-authorized Workspace deliveries and their reads.
service Transfers {
  // Records a delivery whose patch and bundle the calling Worker Host already holds.
  rpc CommitWorkspace(WorkspaceDeliveryRequest) returns (WorkspaceDeliveryReference);
  // The Session's last delivery, which this Attempt continues, and the Worker Host holding it.
  // No bytes: the host reads the commit from its own repository, or from the remote Workspace's
  // Session branch, where the delivering host pushed it.
  rpc GetWorkspaceContinuation(InspectAttemptRequest) returns (WorkspaceContinuation);
  // The delivery a review request names, and where it is: the Worker Host holding it and, for a
  // remote Workspace, the Workspace and the Session branch that hold its commits. No bytes.
  rpc GetReviewDelivery(GetReviewArtifactRequest) returns (HeldWorkspaceDelivery);
  rpc VerifyWorkspaceOutputRemote(VerifyWorkspaceOutputRemoteRequest) returns (VerifyWorkspaceOutputRemoteResponse);
}

// A Worker Host reads a remote Workspace itself, with a credential the Control Plane hands it for
// one Attempt and one operation. The Control Plane passes no source bytes.
service WorkspaceGitAccess {
  rpc Mint(MintWorkspaceGitAccessRequest) returns (WorkspaceGitGrant);
}

// Internal authorization and commit for work product the API tier stores.
service WorkspaceDirectory {
  // The remote Workspace and the commit a live Attempt may download: its base commit, or with
  // `merge` its merge follow-up's target commit. The bundle is left empty.
  rpc GetSource(DownloadWorkspaceSourceRequest) returns (WorkspaceSourceBundle);
  rpc GetContinuation(InspectAttemptRequest) returns (WorkspaceContinuation);
  rpc ReserveDelivery(WorkspaceDeliveryRequest) returns (WorkspaceDeliveryReference);
  rpc CommitDelivery(WorkspaceDeliveryRequest) returns (WorkspaceDeliveryReference);
  rpc GetReviewArtifact(GetReviewArtifactRequest) returns (HeldWorkspaceDelivery);
}

// The Worker Host holding a blob, and the Attempt whose bytes it holds.
message BlobHolder {
  string host_id = 1;
  string attempt_id = 2;
}

message HeldWorkspaceDelivery {
  WorkspaceDeliveryReference delivery = 1;
  BlobHolder holder = 2;
  // The delivering Task's remote Workspace, absent for a local Workspace, and its Session branch.
  Workspace workspace = 3;
  string session_branch = 4;
}

// An adapter connects only to its supervising Worker Host. The launch pipe
// provides its endpoint and an execution-scoped credential.
service Harness {
  rpc Attach(HarnessAttachRequest) returns (HarnessRun);
  rpc ConfirmExecutionLimits(AppliedExecutionLimits) returns (ConfirmExecutionLimitsResponse);
  rpc TakeLiveInput(HarnessTakeLiveInputRequest) returns (TakeInputResponse);
  rpc SettleLiveInput(HarnessSettleLiveInputRequest) returns (LiveInput);
  rpc Publish(HarnessPublishRequest) returns (TaskEvent);
  // Text of the message the harness is writing now, as it arrives. The Worker Host batches and
  // redacts it; the completed message is published as a MESSAGE event, which replaces it.
  rpc PublishText(HarnessPublishTextRequest) returns (HarnessPublishTextResponse);
  rpc ReportUsage(HarnessUsageRequest) returns (ReportAttemptUsageResponse);
  rpc Complete(HarnessCompleteRequest) returns (HarnessCompleteResponse);
}

// The supervising Worker Host supplies the Attempt and its remote Workspace.
// An adapter cannot select the sandbox, working directory, or environment.
service HarnessWorkspace {
  rpc Execute(HarnessWorkspaceRequest) returns (HarnessWorkspaceResult);
}

message HarnessWorkspaceRequest {
  oneof operation {
    WorkspaceRead read = 1;
    WorkspaceWrite write = 2;
    WorkspaceEdit edit = 3;
    WorkspaceGlob glob = 4;
    WorkspaceGrep grep = 5;
    WorkspaceList list = 6;
    WorkspaceCommand command = 7;
  }
}

message WorkspaceRead {
  string path = 1;
  optional uint32 offset = 2;
  optional uint32 limit = 3;
}

message WorkspaceWrite {
  string path = 1;
  string content = 2;
}

message WorkspaceEdit {
  string path = 1;
  string old_text = 2;
  string new_text = 3;
  bool replace_all = 4;
}

message WorkspaceGlob {
  string pattern = 1;
  optional string path = 2;
}

enum WorkspaceGrepMode {
  WORKSPACE_GREP_MODE_UNSPECIFIED = 0;
  WORKSPACE_GREP_MODE_CONTENT = 1;
  WORKSPACE_GREP_MODE_FILES_WITH_MATCHES = 2;
  WORKSPACE_GREP_MODE_COUNT = 3;
}

message WorkspaceGrep {
  string pattern = 1;
  optional string path = 2;
  optional string glob = 3;
  WorkspaceGrepMode mode = 4;
  optional uint32 head_limit = 5;
  optional uint32 offset = 6;
}

message WorkspaceList {
  optional string path = 1;
}

message WorkspaceCommand {
  string command = 1;
  optional uint32 timeout_ms = 2;
}

message HarnessWorkspaceResult {
  string text = 1;
  bool is_error = 2;
  // Set only by a remote Workspace provider, and only once it confirmed that the operation's
  // sandbox no longer exists. The Worker Host then replaces the sandbox from the Attempt's
  // starting files and tells the Harness; a Harness never receives it set.
  bool sandbox_lost = 3;
}

// Private to a Worker Host and its provider helper. The Harness never receives
// this service's credentials or sandbox allocation identifiers.
service RemoteWorkspaceProvider {
  rpc Allocate(RemoteWorkspaceAllocateRequest) returns (RemoteWorkspaceAllocation);
  rpc Stage(stream RemoteWorkspaceStageChunk) returns (RemoteWorkspaceStageResponse);
  rpc Capture(RemoteWorkspaceCaptureRequest) returns (stream RemoteWorkspaceCaptureChunk);
  rpc Stop(RemoteWorkspaceStopRequest) returns (RemoteWorkspaceStopResponse);
  // One stdio server started inside the staged sandbox: a Workspace MCP server from its trusted
  // copy, or Codex's exec-server for a Codex Attempt. The first input is the start record; later
  // inputs are its stdin. Outputs are its stdout. Ending or cancelling the call stops the server
  // process, never the sandbox.
  rpc RunStdioServer(stream RemoteStdioServerInput) returns (stream RemoteStdioServerOutput);
  // One Workspace Volume copy the Worker Host staged, uploaded after Stage and before the
  // Harness starts: the header, then for each file its record and exactly its bytes, and each
  // empty directory. The provider seals a read-only copy, and Capture leaves every copy out of
  // the returned tree.
  rpc StageCopy(stream RemoteWorkspaceCopyUpload) returns (RemoteWorkspaceCopyStaged);
  // After a successful Capture, a read-write copy's changed and created regular files: each
  // record, then the summary, then each recorded file's bytes in record order.
  rpc CaptureCopy(RemoteWorkspaceCaptureCopyRequest) returns (stream RemoteWorkspaceCopyDownload);
  // Records the staged preparation sandbox as a prepared artifact, which later allocations start
  // from. Only a sandbox allocated with `prepare` is snapshotted, never a Task sandbox.
  rpc Snapshot(RemoteWorkspaceSnapshotRequest) returns (RemoteWorkspaceSnapshot);
  // Deletes a prepared artifact; deleting one that is already gone succeeds.
  rpc RemoveArtifact(RemoteWorkspaceRemoveArtifactRequest) returns (RemoteWorkspaceRemoveArtifactResponse);
}

// A Volume-relative file of a copy and its exact bytes' length and SHA-256.
message RemoteWorkspaceCopyFile {
  string key = 1;
  uint64 size = 2;
  string sha256 = 3;
}

message RemoteWorkspaceCopyHeader {
  // `volumes/<SHA-256 of the Attempt ID>/<name>`, relative to the checkout.
  string path = 1;
  bool read_write = 2;
}

message RemoteWorkspaceCopyUpload {
  oneof part {
    RemoteWorkspaceCopyHeader header = 1;
    RemoteWorkspaceCopyFile file = 2;
    bytes payload = 3;
    // An empty directory of the copy, by its Volume-relative path.
    string directory = 4;
  }
}

message RemoteWorkspaceCopyStaged {
  uint64 files = 1;
}

message RemoteWorkspaceCaptureCopyRequest {
  string path = 1;
  // The copy's byte limit. Listing refuses a change set over it, or a changed file over it or
  // 5 GiB, before reading that file, so it hashes at most the staged bytes and this limit.
  uint64 max_bytes = 2;
}

// What the provider found in a read-write copy, after its changed and created file records.
message RemoteWorkspaceCopyListed {
  // Unchanged files, links, and other entries that are never written back.
  uint64 skipped = 1;
  // The first entry that refuses the copy: an unwritable name, a hard link, a directory
  // nested too deeply, too many entries, or a change over the copy's byte limits. No bytes
  // follow a refusal.
  string error_key = 2;
  string error_reason = 3;
}

message RemoteWorkspaceCopyDownload {
  oneof part {
    RemoteWorkspaceCopyFile file = 1;
    RemoteWorkspaceCopyListed listed = 2;
    bytes payload = 3;
  }
}

message RemoteWorkspaceProviderBootstrap {
  string token = 1;
}

message RemoteWorkspaceOwner {
  string host_id = 1;
  uint64 host_generation = 2;
  string task_id = 3;
  string attempt_id = 4;
  string allocation_id = 5;
}

message RemoteWorkspaceAllocateRequest {
  RemoteWorkspaceOwner owner = 1;
  uint32 timeout_ms = 2;
  repeated string allowed_actions = 3;
  // The trusted commit's devcontainer subset, translated by the Worker Host. Absent when the
  // commit declares none: the sandbox starts from the operator's template or image.
  optional RemoteWorkspaceEnvironment environment = 3400;
  // Start from a prepared artifact this host recorded instead of building `environment`'s
  // image. Stage then updates the prepared checkout, which keeps its untracked setup output.
  optional string prepared_artifact = 3500;
  // A preparation sandbox: Stage takes a bundle of the trusted commit alone and runs the setup
  // lines, and Snapshot records the result. With `prepared_artifact`, preparation is warm.
  bool prepare = 3501;
  // The Task's path scope, which the provider's file tools apply after resolving symlinks.
  FileScope file_scope = 3600;
  // Present only for a Task with a network scope on a provider that offers the relay.
  optional RemoteWorkspaceEgress egress = 3700;
  // A dependency cache the Task's commands may reuse across this Tag's Task Attempts on this
  // Workspace: a SHA-256 of the Worker Host, Workspace, and Tag, never their names. Empty for a
  // preparation sandbox. A provider that keeps no cache ignores it.
  string dependency_cache = 3800;
  // For a Codex Attempt, the Worker Host's Codex version (`codex --version` without its
  // `codex-cli ` prefix). The image must contain a `codex` of exactly this version, or allocation
  // fails naming the version needed. Empty for every other harness.
  string codex_version = 3900;
}

// A sandbox image and setup derived only from the trusted commit's devcontainer subset.
message RemoteWorkspaceEnvironment {
  // Registry image the build starts from. Absent: the operator's configured template or image.
  optional string image = 1;
  // Dockerfile instructions applied after the base, ending as `user` when one is set. Every
  // process the provider starts in the sandbox, including staging, runs as the image's user,
  // so that user owns the checkout and the trusted MCP copy.
  repeated string dockerfile_commands = 2;
  // The user the image ends as: remoteUser, containerUser, or the Dockerfile's last literal USER.
  optional string user = 3;
  // Shell lines run in order after staging, in the checkout, as the image's user. "$1" is the
  // checkout path; exports carry the resolved containerEnv and remoteEnv.
  repeated string setup_commands = 4;
}

message RemoteWorkspaceAllocation {
  string sandbox_id = 1;
}

// Network for a Task with a network scope. The sandbox keeps the provider's no-network policy, DNS
// included. A relay in the sandbox accepts the Task's clients on loopback and carries each
// connection over the provider's own exec stream to the provider helper, which connects it to the
// Attempt's egress proxy on the Worker Host. No real secret is here.
message RemoteWorkspaceEgress {
  // The Attempt's egress proxy on the Worker Host's loopback, as `127.0.0.1:PORT`.
  string proxy = 1;
  // Variables every Workspace command gets: the proxy URL through the relay with the Attempt's
  // proxy credential, and each network credential's placeholder.
  map<string, string> variables = 2;
  // The egress proxy's CA certificate, which the sandbox's clients trust.
  string ca_pem = 3;
}

message RemoteWorkspaceSnapshotRequest {}

message RemoteWorkspaceSnapshot {
  // The provider's artifact: an E2B snapshot ID or a Modal image ID.
  string artifact = 1;
}

message RemoteWorkspaceRemoveArtifactRequest {
  string artifact = 1;
}

message RemoteWorkspaceRemoveArtifactResponse {}

message RemoteWorkspaceStageHeader {
  string start_commit = 1;
  BlobReference bundle = 2;
  // Bodies follow the bundle bytes, in this exact manifest order.
  repeated ArtifactInputFile input_files = 3;
  // When set, the provider also materializes this commit from the bundle as the trusted copy
  // its Workspace stdio MCP servers run in, outside the checkout the Harness can change.
  optional string mcp_commit = 3400;
}

message RemoteWorkspaceStageChunk {
  oneof part {
    RemoteWorkspaceStageHeader header = 1;
    bytes payload = 2;
  }
}

message RemoteWorkspaceStageResponse {
  // Echoed only after the provider verifies the files in its private checkout.
  repeated ArtifactInputFile input_files = 1;
}

message RemoteWorkspaceCaptureRequest {
  // Checkout paths returned even when the checkout's ignore rules match them, such as the Task
  // output directory. Every other ignored untracked path, and every `.git` entry, stays in the
  // sandbox. Workspace-relative, at most 64.
  repeated string keep = 1;
}

message RemoteWorkspaceCaptureChunk {
  oneof part {
    BlobReference tree = 1;
    bytes payload = 2;
  }
}

message RemoteWorkspaceStopRequest {
  RemoteWorkspaceOwner owner = 1;
  optional string sandbox_id = 2;
}

// A sandbox ID is present only after a definitive provider absence check.
message RemoteWorkspaceStopResponse {
  optional string stopped_sandbox_id = 1;
}

// The server runs with no Worker Host variable: only a fixed PATH and LANG.
message RemoteMcpServerStart {
  string name = 1;
  string command = 2;
  repeated string args = 3;
}

// `codex exec-server --listen stdio`, run in the checkout as the Workspace user with the
// environment a Workspace command gets, and `CODEX_HOME` set to an empty directory the user cannot
// write, so nothing in the sandbox adds Codex configuration such as MCP servers. Only a sandbox
// allocated with `codex_version` starts it.
message RemoteCodexExecServerStart {}

message RemoteStdioServerStart {
  oneof server {
    RemoteMcpServerStart mcp = 1;
    RemoteCodexExecServerStart codex_exec_server = 2;
  }
}

message RemoteStdioServerInput {
  oneof part {
    RemoteStdioServerStart start = 1;
    bytes stdin = 2;
  }
}

message RemoteStdioServerOutput {
  bytes stdout = 1;
}

