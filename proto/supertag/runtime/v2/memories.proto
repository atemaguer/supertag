syntax = "proto3";

package supertag.runtime.v2;

import "supertag/runtime/v2/runtime.proto";

// A Tag's memory is its harness's own memory, such as Claude Code's auto-memory or Codex's
// memories folder. Worker Hosts keep the files (NativeMemoryStore); the Control Plane never holds
// them, and people read and delete them on the Worker Host's machine.
service Memories {
  // Operators only. Drops a Tag's harness-native memory (NativeMemoryStore): every Worker Host
  // deletes its copies before it next runs one of the Tag's Tasks, and the records go now.
  rpc ResetNative(ResetNativeMemoryRequest) returns (ResetNativeMemoryResponse);
}

// Called by a Worker Host for the turn it runs.
service AttemptMemory {
  // After a turn's harness stops, its Worker Host records what it now holds of the store the
  // turn was granted (Assignment.native_memory). Never file contents.
  rpc ReportNative(ReportNativeMemoryRequest) returns (ReportNativeMemoryResponse);
  // Moves the turn's store on its Tag's Volume to a new manifest the host has written, when the
  // store is still at `expected_revision`; otherwise it changes nothing and returns the current
  // head, so the host merges again.
  rpc AdvanceNative(AdvanceNativeMemoryRequest) returns (AdvanceNativeMemoryResponse);
  // The host has written the grant's seeds (NativeMemoryGrant.seeds) into the turn's store; the
  // Control Plane drops them and grants them to no later turn.
  rpc AcknowledgeSeeds(AcknowledgeNativeMemorySeedsRequest) returns (AcknowledgeNativeMemorySeedsResponse);
}

message ResetNativeMemoryRequest {
  string tag_id = 1;
}

message ResetNativeMemoryResponse {
  // The records dropped.
  repeated NativeMemoryStore stores = 1;
  uint64 reset_generation = 2;
}

message ReportNativeMemoryRequest {
  reserved 1;
  reserved "attempt";
  // Of the store as the host holds it after the turn.
  uint64 revision = 2;
  uint32 files = 3;
  uint64 bytes = 4;
  string digest = 5;
  // The reset generation of the grant the copy was made under.
  uint64 reset_generation = 6;
}

message ReportNativeMemoryResponse {}

message AdvanceNativeMemoryRequest {
  reserved 1;
  reserved "attempt";
  // The head the host merged onto; 0 when the store on the Volume was empty.
  uint64 expected_revision = 2;
  // The new manifest, already written to the Volume.
  BlobReference manifest = 3;
  uint32 files = 4;
  uint64 bytes = 5;
  // The reset generation of the turn's grant. A store reset since then is not moved.
  uint64 reset_generation = 6;
  // Every object the new manifest names, each once. Objects the store no longer names, and the
  // manifest it replaces, are deleted from the Volume.
  repeated BlobReference objects = 7;
}

message AdvanceNativeMemoryResponse {
  // Whether the head moved to `manifest`.
  bool advanced = 1;
  // The store's head now: the new one, or the one another turn moved it to. Unset while empty.
  NativeMemoryVolumeHead head = 2;
}

message AcknowledgeNativeMemorySeedsRequest {
  // The seeds written, by `seed_id`.
  repeated string seed_ids = 1;
}

message AcknowledgeNativeMemorySeedsResponse {}
