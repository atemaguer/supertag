syntax = "proto3";
package supertag.session.v1;

// Private native Session persistence. Authority is per-Attempt bearer metadata,
// never a Worker Host credential. Archive bytes have their own bounded stream.
// Every call must specify a deadline of at most 60 seconds.
service SessionService {
  rpc Save(stream SaveRequest) returns (SaveResponse);
  rpc Load(LoadRequest) returns (stream LoadResponse);
}

message SessionRef {
  string id = 1;
  string uri = 2;
  string format = 3;
  optional string media_type = 4;
  optional string digest = 5;
  optional bytes provenance_json = 6;
  optional string artifact_id = 7;
  optional string path = 8;
}

message SaveHeader {
  SessionRef ref = 1;
  string harness_id = 2;
  uint64 write_version = 3;
  uint32 archive_size = 4;
  string archive_sha256 = 5;
}

// Exactly one header followed by nonempty chunks of at most 256 KiB.
// The archive is one UTF-8 JSON object; at most 16 MiB and 1024 chunks in total.
message SaveRequest {
  oneof frame {
    SaveHeader header = 1;
    bytes chunk = 2;
  }
}

// A reply proves the ordered write was committed by the existing Session owner.
// A lost reply does not prove failure; retry only the exact same version/content.
message SaveResponse {
  uint64 write_version = 1;
}

message LoadRequest {
  SessionRef ref = 1;
}

message StateHeader {
  SessionRef ref = 1;
  string harness_id = 2;
  uint32 archive_size = 3;
  string archive_sha256 = 4;
}

message LoadResponse {
  oneof frame {
    StateHeader header = 1;
    bytes chunk = 2;
    bool not_found = 3;
  }
}
