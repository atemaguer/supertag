syntax = "proto3";
package supertag.coordination.v1;

// Worker-owned adapter for the existing manager MCP boundary. This is not a
// generic resource API. The Control Plane decides the allowed tools on every call.
service CoordinationService {
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
  rpc CallTool(CallToolRequest) returns (CallToolResponse);
}
// Existing extensible MCP input/schema boundary; version 1 UTF-8 JSON object.
message ToolDocument { uint32 version = 1; bytes json = 2; }
message Tool {
  string name = 1;
  string description = 2;
  ToolDocument input_schema = 3;
}
message ListToolsRequest {}
message ListToolsResponse { repeated Tool tools = 1; }
message CallToolRequest { string name = 1; ToolDocument arguments = 2; }
message TextContent { string text = 1; }
message CallToolResponse { bool is_error = 1; repeated TextContent content = 2; }
