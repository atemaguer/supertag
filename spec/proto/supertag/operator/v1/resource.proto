  string app_id = 1 [(supertag.operator.v1.manifest_field) = {
    required: true
    min_length: 1
  }];
  // The tenant's ID. It may not name another account's tenant.
  string tenant_id = 2 [(supertag.operator.v1.manifest_field) = {
    required: true
    min_length: 1
  }];
}

// Where a Microsoft Teams Surface Account's secrets come from.
message TeamsAccountSecrets {
  // The bot's app secret.
  SurfaceSecretReference app_secret = 1 [(supertag.operator.v1.manifest_field) = {required: true}];
}

// An Objective as a manifest declares it. Its status, history and spend are
// `ObjectiveService`'s.
message DeclaredObjective {
  // `name` is the Objective's ID.
  Metadata metadata = 1;
  // What is declared.
  ObjectiveDeclaration spec = 2;
}

// The `spec` of an `Objective` manifest: standing work declared beside the
// Tags that do it. `metadata.name` is the Objective's ID. Owner, outcome,
// `ongoing`, Workspaces and which Team it names are fixed once it exists, and
// apply refuses a change to them. The deadline and runtime actions change,
// the budget only increases, and its own Team's fields change in place. A
// manifest that stops setting the budget, deadline or runtime actions leaves
// the stored value. A manifest has no `status`.
message ObjectiveDeclaration {
  option (supertag.operator.v1.manifest) = {
    kind: "Objective"
    name: {min_length: 1}
  };

  // The owner Tag's name.
  string owner = 1 [(supertag.operator.v1.manifest_field) = {
    required: true
    min_length: 1
  }];
  // One natural-language statement: the result, how success is verified,
  // what must not change, and when to ask a person.
  string outcome = 2 [(supertag.operator.v1.manifest_field) = {
    required: true
    min_length: 1
    max_length: 8000
  }];
  // A continuing responsibility that only an operator can end.
  bool ongoing = 3;
  // Names of existing Workspaces its work may use.
  repeated string workspaces = 4 [(supertag.operator.v1.manifest_field) = {
    pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
    max_items: 16
  }];
  // Its allocation limit.
  ObjectiveBudgetDeclaration budget = 5;
  // Its deadline.
  google.protobuf.Timestamp deadline = 6;
  // Runtime actions, such as `files:write`, for turns admitted afterwards. A
  // list narrows what the owner's Permission Sets allow. Omitted from a new
  // Objective: what they allow when it is created.
  repeated string runtime_actions = 7 [(supertag.operator.v1.manifest_field) = {
    min_length: 1
    max_items: 50
  }];
  // The Team whose members the owner may hand work to. In a manifest it is
  // one field, `team`: a Team's name, or the Objective's own Team.
  oneof team {
    option (supertag.operator.v1.manifest_oneof) = {field: "team"};
    // An existing Team, by name. Apply leaves it as it is.
    string team_name = 8 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
    // The Objective's own Team, whose ID is the Objective's ID. Apply creates
    // and updates it.
    ObjectiveTeamDeclaration own_team = 9;
  }
}

// An Objective's budget as a manifest declares it.
message ObjectiveBudgetDeclaration {
  // The limit in minor units of `currency`, or in allocation units without
  // one.
  int64 minor = 1 [(supertag.operator.v1.manifest_field) = {
    required: true
    minimum: 0
  }];
  // The ISO 4217 code, such as `USD`. With one, the budget caps
  // provider-reported cost.
  string currency = 2 [(supertag.operator.v1.manifest_field) = {pattern: "^[A-Z]{3}$"}];
}

// An Objective's own Team as a manifest declares it.
message ObjectiveTeamDeclaration {
  // The Team's name. Empty: the Objective's ID.
  string name = 1 [(supertag.operator.v1.manifest_field) = {
    min_length: 1
    max_length: 200
  }];
  // The member Tags, by name.
  repeated string members = 2 [(supertag.operator.v1.manifest_field) = {
    required: true
    min_length: 1
    min_items: 1
    max_items: 100
  }];
  // At most this many turns run at once across the Team's Objectives.
  // Unset: only Worker Host capacity limits them.
  optional int32 max_concurrency = 3 [(supertag.operator.v1.manifest_field) = {
    minimum: 1
    maximum: 1000
  }];
}
