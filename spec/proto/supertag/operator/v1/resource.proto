syntax = "proto3";
package supertag.operator.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "supertag/operator/v1/common.proto";
import "supertag/operator/v1/host.proto";
import "supertag/operator/v1/options.proto";
import "supertag/operator/v1/surface.proto";
import "supertag/operator/v1/task.proto";
import "supertag/operator/v1/work.proto";

option go_package = "github.com/atemaguer/supertag/packages/operator-api/go/operatorv1;operatorv1";

// The organization's configuration as manifests: `supertag apply -f`, `diff
// -f`, `get`, `describe` and `delete` of a resource, the `provision:`
// entries `supertag up` applies, the starter resources `supertag init`
// writes, and `create tag`.
//
// A manifest declares one resource: `apiVersion: supertag/v1`, `kind`,
// `metadata.name` and `spec`. `ApplyManifests` and `DiffManifests` take
// manifest documents as they were read, and the Control Plane validates
// them, merges each field under its field manager, applies them in
// dependency order and prunes apply sets. The messages below define each
// kind's `spec`; the options in `options.proto` say how they are written in
// a manifest, and the JSON Schemas under `spec/manifests/` are generated from
// them.
//
// The kinds and their manifests:
//
// | Kind | Manifest | Delete |
// | --- | --- | --- |
// | `Tag` | `TagSpec` | Retires it |
// | `Role` | `RoleSpec` | Retires it |
// | `PermissionSet` | `PermissionSetSpec` | Deletes it |
// | `ContextSet` | `ContextSetSpec` | Deletes it |
// | `Volume` | `VolumeSpec` | Deletes it |
// | `Workspace` | `WorkspaceSpec` | Deletes it |
// | `SurfaceAccount` | `SurfaceAccountManifestSpec` | Retires it |
// | `Objective` | `ObjectiveDeclaration` | Refused: cancel it with `ObjectiveService.CancelObjective` |
// | `WorkerProfile` | None: observed, never applied | Refused |
//
// Worker Hosts, Auth Keys, Operator Tokens, Tasks, Sessions and Teams have
// their own services and are not resources of this one.
//
// Access. The admin token and Operator Tokens may call every RPC; a scoped
// coordination credential is refused with `PermissionDenied`. Every caller
// sees every resource.
//
// Every RPC that names a resource takes its kind and name, and fails with
// `InvalidArgument` for an unset kind or an empty name, and `NotFound` for a
// resource that does not exist. A call while the Control Plane drains fails
// with `Unavailable` and `ERROR_REASON_DRAINING`.
service ResourceService {
  // Reads one resource, as `supertag get` and `supertag describe` of a named
  // resource show it. A Workspace read this way also reports
  // `WorkspaceStatus.environments`, which `ListResources` leaves out. A Tag is
  // read by name even once retired; when several retired Tags share the name
  // and no active Tag holds it, the latest retired is returned.
  //
  // With `manifest`, `Resource.manifest` is also set. It fails with
  // `FailedPrecondition` and `ERROR_REASON_CONFLICT` for `manifest` on a
  // Surface Account that `supertag setup surface` set up, which has no
  // secret references to export, and with `InvalidArgument` for `manifest` on
  // a Worker Profile.
  rpc GetResource(GetResourceRequest) returns (Resource) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (supertag.operator.v1.action) = "read_resource";
  }

  // Lists the resources of one kind, as `supertag get` and `supertag list` of
  // a kind show them. Tags, Roles, Permission Sets, Context Sets, Volumes,
  // Workspaces and Surface Accounts come by name; Worker Profiles by Worker
  // Host ID, then in the order each host advertises them. Retired Tags and
  // retired Surface Accounts are left out.
  //
  // With `manifest`, each `Resource.manifest` is also set, and Surface
  // Accounts that `supertag setup surface` set up are left out, since they
  // have no manifest.
  //
  // It fails with `InvalidArgument` for `RESOURCE_KIND_OBJECTIVE`, whose
  // listing is `ObjectiveService.ListObjectives`, for `manifest` with
  // `RESOURCE_KIND_WORKER_PROFILE`, and for a malformed `page_token`.
  rpc ListResources(ListResourcesRequest) returns (ListResourcesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (supertag.operator.v1.action) = "read_resource";
  }

  // Plans an apply without changing anything, as `supertag diff -f` does: what
  // `ApplyManifests` with the same documents and flags would create, update,
  // leave unchanged, refuse, or find in conflict, and with `prune` what it
  // would delete, cancel or keep. It never reads Surface Account secrets: it
  // compares their declared fields and references only.
  //
  // It fails as `ApplyManifests` does for an invalid input, without the
  // "Nothing was applied." prefix, and with `InvalidArgument` when a
  // document carries `secrets`. Conflicts and refusals are plan entries, not
  // errors.
  rpc DiffManifests(DiffManifestsRequest) returns (DiffManifestsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (supertag.operator.v1.action) = "read_resource";
  }

  // Applies manifests, as `supertag apply -f` does.
  //
  // The Control Plane first validates every document, without writing:
  // its shape and kind, that the input defines each resource once, that
  // every Role, Permission Set, Context Set, Tag and Workspace it names is in
  // the input or already exists, and each field's manager. A Surface Account
  // that is new, or whose resolved `secrets` differ from its stored
  // credentials, is verified with its provider, as `supertag setup surface`
  // does; an unchanged one is neither verified nor rewritten. It then
  // applies the documents in dependency order: Surface Accounts, Volumes,
  // Workspaces, Context Sets, Permission Sets, Roles, Tags, then Objectives,
  // each kind in input order. A Tag that accepts messages from a Tag later in
  // the input is applied after that sender exists. With `prune` it then
  // removes the apply set's members the input no longer declares.
  //
  // Applying is not one transaction. When one document fails, the documents
  // before it stay applied, the rest are not applied, prune does not run, and
  // the call still succeeds with `complete` false; `results` say which
  // document failed and why.
  //
  // Applying the same input again changes nothing more, so a retry is safe:
  // an Objective that started is not started again, and a member already
  // pruned is not pruned again.
  //
  // It fails, and nothing is applied, with:
  //
  // - `InvalidArgument` and `ERROR_REASON_INVALID_ARGUMENT` when any document
  //   is invalid, including credentials the provider rejects. The message is
  //   `Nothing was applied. Invalid manifests:` and one line per problem,
  //   sorted, each starting with the document's `source`. `fields` has one
  //   entry per problem, with `path` `documents[INDEX]` and the line as its
  //   `description`.
  // - `FailedPrecondition` and `ERROR_REASON_CONFLICT` when a document changes
  //   a field that cannot change, such as an Objective's outcome. The message
  //   is `Nothing was applied. The input changes what cannot change:` and one
  //   line per field, `KIND/NAME: PATH: REASON`. `fields` has one entry per
  //   field, with `path` `documents[INDEX].PATH` and the reason as its
  //   `description`.
  // - `FailedPrecondition` and `ERROR_REASON_CONFLICT` when, without
  //   `force_conflicts`, a document changes a field another field manager
  //   owns and no field is refused. The message is `Nothing was applied. The
  //   input changes fields another manager owns:` and one line per field,
  //   `KIND/NAME: PATH is owned by MANAGER`. `fields` has one entry per field,
  //   with `path` `documents[INDEX].PATH` and `manager` set.
  // - `InvalidArgument` for no documents, `prune` without `apply_set`, a
  //   malformed `apply_set`, or `imperative` with `apply_set`, `prune` or an
  //   Objective.
  rpc ApplyManifests(ApplyManifestsRequest) returns (ApplyManifestsResponse) {
    option (supertag.operator.v1.action) = "apply_resource";
    option (supertag.operator.v1.audit_action) = "resource.apply";
  }

  // Deletes or retires one resource, as `supertag delete` of a resource does,
  // with what goes with it. Deletion never erases history: a retired Tag, Role or
  // Surface Account keeps its record, and Tasks keep the policy and Workspace
  // they recorded. Deleting also removes the resource's field-manager record
  // and apply-set membership. With `dry_run` it answers the same way and
  // changes nothing.
  //
  // It fails with `FailedPrecondition` and `ERROR_REASON_CONFLICT` while
  // something still uses the resource, such as a Tag that owns an open
  // Objective or a Permission Set a Role lists; the message names every
  // reference. There is no force option. It fails with `InvalidArgument` for
  // `RESOURCE_KIND_OBJECTIVE` and `RESOURCE_KIND_WORKER_PROFILE`. A repeat
  // after the resource is gone fails with `NotFound`.
  rpc DeleteResource(DeleteResourceRequest) returns (DeleteResourceResponse) {
    option (supertag.operator.v1.action) = "delete_resource";
    option (supertag.operator.v1.audit_action) = "resource.delete";
  }
}

// A kind of resource. Its `manifest_value` is the manifest's `kind`.
enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  // A Tag.
  RESOURCE_KIND_TAG = 1 [(supertag.operator.v1.manifest_value) = "Tag"];
  // A Role.
  RESOURCE_KIND_ROLE = 2 [(supertag.operator.v1.manifest_value) = "Role"];
  // A Permission Set.
  RESOURCE_KIND_PERMISSION_SET = 3 [(supertag.operator.v1.manifest_value) = "PermissionSet"];
  // A Context Set.
  RESOURCE_KIND_CONTEXT_SET = 4 [(supertag.operator.v1.manifest_value) = "ContextSet"];
  // A Volume.
  RESOURCE_KIND_VOLUME = 5 [(supertag.operator.v1.manifest_value) = "Volume"];
  // A Workspace.
  RESOURCE_KIND_WORKSPACE = 6 [(supertag.operator.v1.manifest_value) = "Workspace"];
  // A Surface Account.
  RESOURCE_KIND_SURFACE_ACCOUNT = 7 [(supertag.operator.v1.manifest_value) = "SurfaceAccount"];
  // A declared Objective.
  RESOURCE_KIND_OBJECTIVE = 8 [(supertag.operator.v1.manifest_value) = "Objective"];
  // A Worker Profile a Worker Host advertises. It cannot be applied.
  RESOURCE_KIND_WORKER_PROFILE = 9 [(supertag.operator.v1.manifest_value) = "WorkerProfile"];
}

message GetResourceRequest {
  // The resource's kind.
  ResourceKind kind = 1;
  // Its `metadata.name`. A Surface Account is also named
  // `PROVIDER:EXTERNAL_ACCOUNT_ID`, such as `slack:T0123456789`, and a manifest
  // name wins over that form. A Worker Profile is named `ID@REVISION` or by its
  // `metadata.id`. A declared Objective is named by its ID.
  string name = 2;
  // Also return the resource's manifest in `Resource.manifest`.
  bool manifest = 3;
}

message ListResourcesRequest {
  // The kind to list.
  ResourceKind kind = 1;
  // At most this many resources; 0 means 100, and more than 500 means 500.
  int32 page_size = 2;
  // The `next_page_token` of the previous page.
  string page_token = 3;
  // Also return each resource's manifest in `Resource.manifest`.
  bool manifest = 4;
}

message ListResourcesResponse {
  // The resources, in the order `ListResources` describes.
  repeated Resource resources = 1;
  // Fetches the next page. Empty on the last page.
  string next_page_token = 2;
}

// One resource of any kind.
message Resource {
  // The resource. Exactly one is set.
  oneof resource {
    // A Tag.
    Tag tag = 1;
    // A Role.
    Role role = 2;
    // A Permission Set.
    PermissionSet permission_set = 3;
    // A Context Set.
    ContextSet context_set = 4;
    // A Volume.
    Volume volume = 5;
    // A Workspace.
    Workspace workspace = 6;
    // A Surface Account.
    SurfaceAccount surface_account = 7;
    // A declared Objective. Its status and history are
    // `ObjectiveService.GetObjective`'s.
    DeclaredObjective objective = 8;
    // A Worker Profile.
    WorkerProfile worker_profile = 9;
  }
  // The resource's manifest, set only when the request asks for it: the
  // document `ApplyManifests` takes, with `apiVersion`, `kind`,
  // `metadata.name` and the declarable `spec` fields. It leaves out what the
  // Control Plane sets, such as IDs and timestamps, and an Objective's
  // fields at their defaults. A Surface Account's has its secret references,
  // never a value.
  google.protobuf.Struct manifest = 10;
}

// One manifest document as the caller read it.
message ManifestDocument {
  // The document: `apiVersion`, `kind`, `metadata` and `spec`, as parsed from
  // YAML or JSON. `metadata.name` is required.
  google.protobuf.Struct manifest = 1;
  // Names the document in messages, such as `tags.yaml` or `tags.yaml
  // document 2`. Empty uses `documents[INDEX]`.
  string source = 2;
  // A Surface Account's secret values by secret name, such as `botToken`,
  // resolved from the manifest's `secrets` references by the caller: `env`
  // and `file` from where the caller runs, `secretRef` from a secrets map such
  // as the one in `supertag.yaml`. Set them for a SurfaceAccount document
  // only, one per reference. The Control Plane verifies them with the
  // provider and stores them in its credential vault. They are never
  // returned, logged or recorded in the audit trail.
  map<string, string> secrets = 3;
}

message DiffManifestsRequest {
  // The documents, at most 16 MB in all.
  repeated ManifestDocument documents = 1;
  // Plans as a member of this apply set, as `ApplyManifestsRequest.apply_set`
  // does.
  string apply_set = 2;
  // Also plans pruning the apply set.
  bool prune = 3;
  // Plans as `force_conflicts` would apply.
  bool force_conflicts = 4;
}

message DiffManifestsResponse {
  // One plan per document, in the order `ApplyManifests` would apply them.
  repeated ManifestPlan plans = 1;
  // With `prune`, what pruning would do to each member the input no longer
  // declares, Objectives first.
  repeated PruneResult pruned = 2;
}

message ApplyManifestsRequest {
  // The documents, at most 16 MB in all.
  repeated ManifestDocument documents = 1;
  // Applies the input as this apply set: each resource becomes a member, and
  // the set's name is the field manager. 1 to 63 lowercase letters, digits,
  // hyphens or underscores. Empty writes as field manager `apply`.
  string apply_set = 2;
  // After applying, removes the apply set's members the input no longer
  // declares: cancels Objectives first, then deletes Tags, sets, Workspaces
  // and Volumes, and retires Surface Accounts last, as `DeleteResource` does.
  // A member still in use is kept, stays in the set, and is reported.
  // Requires `apply_set`.
  bool prune = 3;
  // Applies changes to fields another manager owns, and moves them to this
  // apply's manager.
  bool force_conflicts = 4;
  // Applies only documents whose resource does not exist yet and leaves
  // existing ones untouched, as `supertag up` provisions.
  bool create_only = 5;
  // Writes as field manager `cli`, as `supertag create tag` does: the fields
  // a document lists replace the stored ones, and the fields it omits stay.
  bool imperative = 6;
}

message ApplyManifestsResponse {
  // One result per document, in the order they were applied. With
  // `create_only`, documents whose resource existed are reported as
  // `MANIFEST_OUTCOME_EXISTED`.
  repeated ManifestResult results = 1;
  // True when every document applied. False when one failed: it is the
  // result with `MANIFEST_OUTCOME_FAILED`, those after it are
  // `MANIFEST_OUTCOME_NOT_APPLIED`, and pruning did not run.
  bool complete = 2;
  // With `prune` and `complete`, what pruning did to each member the input
  // no longer declares, Objectives first.
  repeated PruneResult pruned = 3;
}

// What applying one document would change.
message ManifestPlan {
  // The document's index in the request.
  int32 document = 1;
  // Its kind.
  ResourceKind kind = 2;
  // Its `metadata.name`.
  string name = 3;
  // Whether applying it creates, updates or leaves the resource.
  PlanAction action = 4;
  // Each field applying would change. For a Tag location whose Surface
  // Account the same input creates, an addition of the whole location.
  repeated FieldChange changes = 5;
  // Each field another manager owns that the document changes.
  repeated FieldConflict conflicts = 6;
  // Each field the document changes that cannot change, such as an
  // Objective's outcome. Applying refuses the whole input.
  repeated FieldRefusal refusals = 7;
  // An Objective only: applying starts its conversation, because it is new
  // or did not start before.
  bool starts_objective = 8;
  // An Objective only: why applying leaves it as it is, such as a cancelled
  // Objective. Empty otherwise.
  string held = 9;
}

// Whether an apply creates, updates or leaves a resource.
enum PlanAction {
  PLAN_ACTION_UNSPECIFIED = 0;
  // The resource does not exist yet.
  PLAN_ACTION_CREATE = 1;
  // At least one field changes.
  PLAN_ACTION_UPDATE = 2;
  // Nothing changes.
  PLAN_ACTION_UNCHANGED = 3;
}

// One field an apply changes.
message FieldChange {
  // The field's path, such as `spec.purpose`, or `spec.roles[Reviewer]` for
  // one entry of a list field, keyed as the field manager rules key it.
  string path = 1;
  // How it changes.
  FieldChangeAction action = 2;
  // The value before. Unset for an addition.
  google.protobuf.Value before = 3;
  // The value after. Unset for a removal.
  google.protobuf.Value after = 4;
}

// How a field changes.
enum FieldChangeAction {
  FIELD_CHANGE_ACTION_UNSPECIFIED = 0;
  // The field or list entry is added.
  FIELD_CHANGE_ACTION_ADD = 1;
  // The field or list entry is removed, or a single value returns to its
  // default.
  FIELD_CHANGE_ACTION_REMOVE = 2;
  // The value changes.
  FIELD_CHANGE_ACTION_CHANGE = 3;
}

// A field another field manager owns.
message FieldConflict {
  // The field's path, as in `FieldChange.path`.
  string path = 1;
  // The manager that owns it: `apply`, `init`, `cli`, an apply set's name,
  // or `tag:NAME`.
  string manager = 2;
}

// A field that cannot change.
message FieldRefusal {
  // The field's path, as in `FieldChange.path`.
  string path = 1;
  // Why, in one sentence.
  string reason = 2;
}

// What applying one document did.
message ManifestResult {
  // The document's index in the request.
  int32 document = 1;
  // Its kind.
  ResourceKind kind = 2;
  // Its `metadata.name`.
  string name = 3;
  // What happened.
  ManifestOutcome outcome = 4;
  // For `MANIFEST_OUTCOME_APPLIED`: whether it was created, updated or left
  // unchanged.
  PlanAction action = 5;
  // Conditions that would hold an Objective's turns or limit what they may
  // do, and why an apply left an Objective unchanged. The apply still
  // succeeded.
  repeated string warnings = 6;
  // An Objective only: the Task its first turn started as, when applying
  // started it.
  string started_task_id = 7;
  // An Objective only: why it could not start, such as an owner without a
  // connected Worker Host. Applying again once that is fixed starts it.
  string not_started = 8;
  // A Surface Account only: the provider account its credentials verified
  // as. Unset when its credentials were unchanged and not verified.
  SurfaceVerification verification = 9;
  // For `MANIFEST_OUTCOME_FAILED`: why, in prose for people. A failure of
  // the Control Plane itself, with `ERROR_REASON_INTERNAL`, names no internal
  // detail.
  string failure_message = 10;
  // For `MANIFEST_OUTCOME_FAILED`: the stable reason and fields, as a refused
  // call's `ErrorDetail` carries them.
  ErrorDetail failure = 11;
}

// What happened to one document of an apply.
enum ManifestOutcome {
  MANIFEST_OUTCOME_UNSPECIFIED = 0;
  // It was applied.
  MANIFEST_OUTCOME_APPLIED = 1;
  // With `create_only`, its resource already existed and was left untouched.
  MANIFEST_OUTCOME_EXISTED = 2;
  // Applying it failed. Nothing after it was applied.
  MANIFEST_OUTCOME_FAILED = 3;
  // It was not applied because a document before it failed.
  MANIFEST_OUTCOME_NOT_APPLIED = 4;
}

// The provider account a Surface Account's credentials verified as.
message SurfaceVerification {
  // The account's collaboration surface.
  SurfaceProvider provider = 1;
  // Its name for people, such as the Slack workspace name.
  string display_name = 2;
  // Its ID at the provider.
  string external_account_id = 3;
}

// What pruning does to one apply-set member the input no longer declares.
message PruneResult {
  // The member's kind.
  ResourceKind kind = 1;
  // Its name; an Objective's ID.
  string name = 2;
  // What pruning does.
  PruneAction action = 3;
  // For `PRUNE_ACTION_KEEP`: why, such as what still uses it.
  string reason = 4;
}

// What pruning does to one member.
enum PruneAction {
  PRUNE_ACTION_UNSPECIFIED = 0;
  // It is deleted, or retired, as `DeleteResource` does.
  PRUNE_ACTION_DELETE = 1;
  // An Objective is cancelled and keeps its history.
  PRUNE_ACTION_CANCEL = 2;
  // It is kept because something still uses it, or an Objective completed.
  // It stays in the set for the next prune.
  PRUNE_ACTION_KEEP = 3;
}

message DeleteResourceRequest {
  // The resource's kind.
  ResourceKind kind = 1;
  // Its name, as `GetResourceRequest.name` takes it.
  string name = 2;
  // Answers as a deletion would, and changes nothing.
  bool dry_run = 3;
}

message DeleteResourceResponse {
  // The resource's kind.
  ResourceKind kind = 1;
  // Its name.
  string name = 2;
  // True when nothing was changed.
  bool dry_run = 3;
  // Whether it was deleted or retired.
  DeletionAction action = 4;
  // What was removed with it, one line for people each, such as a Tag's
  // location with its set activations.
  repeated string removed = 5;
  // Effects outside the Control Plane's configuration, one line for people
  // each, such as a Worker Host that keeps a deleted Workspace's checkout.
  repeated string notes = 6;
}

// How a deletion removes a resource.
enum DeletionAction {
  DELETION_ACTION_UNSPECIFIED = 0;
  // The record stays for history, and the name is free again.
  DELETION_ACTION_RETIRE = 1;
  // The record is deleted.
  DELETION_ACTION_DELETE = 2;
}

// The harness, models and reasoning efforts a Role or Tag allows. A Tag's
// settings override its Roles' field by field; when several Roles set a
// field, the first Role by name wins. `execution` is one field to the field
// manager rules.
message ExecutionSettings {
  // The one harness Tasks run on, such as `codex` or `claude-code`. Empty
  // allows any harness the Worker Host offers.
  string harness = 1 [(supertag.operator.v1.manifest_field) = {pattern: "^[a-z0-9][a-z0-9._-]{0,62}$"}];
  // The models allowed; the first is the default. Empty allows any, and uses
  // the Worker Host's default.
  repeated string model = 2 [(supertag.operator.v1.manifest_field) = {
    min_length: 1
    max_items: 32
    accepts_single: true
  }];
  // The efforts allowed; the first is the default. Empty starts Tasks at
  // `low` and allows `medium` and `high`.
  repeated ExecutionEffort effort = 3 [(supertag.operator.v1.manifest_field) = {accepts_single: true}];
}

// A reasoning effort. Each harness maps it to its own option.
enum ExecutionEffort {
  EXECUTION_EFFORT_UNSPECIFIED = 0;
  // Low effort.
  EXECUTION_EFFORT_LOW = 1 [(supertag.operator.v1.manifest_value) = "low"];
  // Medium effort.
  EXECUTION_EFFORT_MEDIUM = 2 [(supertag.operator.v1.manifest_value) = "medium"];
  // High effort.
  EXECUTION_EFFORT_HIGH = 3 [(supertag.operator.v1.manifest_value) = "high"];
}

// A persistent AI actor with a stable identity, responsibilities, permissions,
// and work history. It exists independently of the model or harness that
// executes its work.
message Tag {
  // Its identity and version.
  Metadata metadata = 1;
  // What is declared.
  TagSpec spec = 2;
  // What the Control Plane observes.
  TagStatus status = 3;
}

// A Tag's declared configuration, and the `spec` of a `Tag` manifest. Apply
// merges each list entry by entry: a Role name, a Worker Host ID, a label, a
// location by provider and scope ID, and a sender Tag.
message TagSpec {
  option (supertag.operator.v1.manifest) = {
    kind: "Tag"
    name: {min_length: 1}
  };

  // The Roles it holds, by name.
  repeated string roles = 1 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
  // The Worker Hosts that may run its Tasks, by ID. An empty pool is valid,
  // but its Tasks are refused until a host is bound. A manifest that lists
  // them is authoritative and unbinds hosts that joined with an Auth Key but
  // are missing.
  repeated string worker_hosts = 2 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
  // Labels a bound Worker Host must carry to run its Tasks; placement only.
  // Labels are lowercased.
  repeated string runs_on = 3 [(supertag.operator.v1.manifest_field) = {
    pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,62}$"
    max_items: 64
  }];
  // The harness, models and efforts it allows, overriding its Roles'.
  ExecutionSettings execution = 4;
  // Where it answers, each with the sets activated there and the Workspaces
  // its Objectives get.
  repeated TagLocation locations = 5;
  // The Tags it accepts Mailbox messages from beyond its Teams, by name.
  repeated string accepts_messages_from = 6 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
}

// One place on a collaboration surface where a Tag answers. In a manifest
// it is `provider` beside that provider's scope fields, such as `provider:
// slack` with `channelId`. A stored Tag reports the resolved `account` and
// stable IDs, such as `repo_id` for a GitHub repository.
message TagLocation {
  // The provider and its scope.
  oneof place {
    option (supertag.operator.v1.manifest_oneof) = {
      required: true
      discriminator: "provider"
    };
    // A Slack channel.
    SlackLocation slack = 1;
    // A GitHub repository.
    GithubLocation github = 2;
    // A Lark chat.
    LarkLocation lark = 3;
    // A Linear team.
    LinearLocation linear = 4;
    // A Microsoft Teams channel.
    TeamsLocation teams = 5;
  }
  // Selects the Surface Account by its external account ID or manifest name,
  // when the provider has several. Empty selects the provider's only one.
  string account = 6 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
  // Permission Sets activated here, by name.
  repeated string permission_sets = 7 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
  // Context Sets activated here, by name.
  repeated string context_sets = 8 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
  // The Workspaces an Objective created here names, in order. A GitHub
  // location without any gives its Objectives every Workspace whose `source`
  // is that repository.
  repeated string workspaces = 9 [(supertag.operator.v1.manifest_field) = {
    pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
    max_items: 16
  }];
}

// A Slack channel.
message SlackLocation {
  // The channel ID, such as `C0123456789`. Slack IDs are uppercased.
  string channel_id = 1 [(supertag.operator.v1.manifest_field) = {
    required: true
    min_length: 1
  }];
}

// A GitHub repository.
message GithubLocation {
  // The repository. Exactly one is set.
  oneof repository {
    option (supertag.operator.v1.manifest_oneof) = {required: true};
    // The repository as `owner/name`, which the Control Plane resolves with
    // the account's credentials.
    string repo = 1 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
    // The repository's ID.
    string repo_id = 2 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
  }
}

// A Lark chat.
message LarkLocation {
  // The chat ID.
  string chat_id = 1 [(supertag.operator.v1.manifest_field) = {
    required: true
    min_length: 1
  }];
}

// A Linear team.
message LinearLocation {
  // The team. Exactly one is set.
  oneof linear_team {
    option (supertag.operator.v1.manifest_oneof) = {required: true};
    // The team's name or key, which the Control Plane resolves with the
    // account's credentials.
    string team = 1 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
    // The team's UUID.
    string team_id = 2 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
  }
}

// A Microsoft Teams channel.
message TeamsLocation {
  // The team ID.
  string team_id = 1 [(supertag.operator.v1.manifest_field) = {
    required: true
    min_length: 1
  }];
  // The channel ID.
  string channel_id = 2 [(supertag.operator.v1.manifest_field) = {
    required: true
    min_length: 1
  }];
}

// What the Control Plane observes of a Tag.
message TagStatus {
  // Its phase.
  TagPhase phase = 1;
  // When it was retired. Unset for an active Tag.
  google.protobuf.Timestamp retired_at = 2;
  // The range its Tasks run in: its own settings, then its Roles' in name
  // order.
  ExecutionSettings execution = 3;
  // Each location, with its Surface Account's display name and whether it
  // is enabled.
  repeated TagLocationStatus locations = 4;
}

// A Tag's phase.
enum TagPhase {
  TAG_PHASE_UNSPECIFIED = 0;
  // It receives work.
  TAG_PHASE_ACTIVE = 1;
  // It was deleted. Its record stays for history; it receives no work.
  TAG_PHASE_RETIRED = 2;
}

// One location of a Tag, as people read it.
message TagLocationStatus {
  // The collaboration surface.
  SurfaceProvider provider = 1;
  // The Surface Account's display name.
  string account = 2;
  // The location for people, such as `C0123456789` for a Slack channel.
  string target = 3;
  // Whether the location delivers events to the Tag.
  bool enabled = 4;
}

// A Role: reusable policy for a responsibility.
message Role {
  // Its identity and version.
  Metadata metadata = 1;
  // What is declared.
  RoleSpec spec = 2;
  // What the Control Plane observes.
  RoleStatus status = 3;
}

// A Role's declared policy, and the `spec` of a `Role` manifest. Apply
// merges its set lists entry by entry.
message RoleSpec {
  option (supertag.operator.v1.manifest) = {
    kind: "Role"
    name: {min_length: 1}
  };

  // What the responsibility is for, in one sentence.
  string purpose = 1 [(supertag.operator.v1.manifest_field) = {
    required: true
    min_length: 1
  }];
  // Instructions every Task of its Tags receives.
  string instructions = 2;
  // Its Context Sets, by name, without duplicates.
  repeated string context_sets = 3 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
  // Its Permission Sets, by name, without duplicates.
  repeated string permission_sets = 4 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
  // The default harness, models and efforts for its Tags.
  ExecutionSettings execution = 5;
}

// What the Control Plane observes of a Role.
message RoleStatus {
  // Its phase.
  RolePhase phase = 1;
  // The Tags that hold it, by name.
  repeated string assigned_tags = 2;
}

// A Role's phase.
enum RolePhase {
  ROLE_PHASE_UNSPECIFIED = 0;
  // Tags may hold it.
  ROLE_PHASE_ACTIVE = 1;
  // It was deleted. Its record stays for history.
  ROLE_PHASE_RETIRED = 2;
}

// A Permission Set: reusable authority for surface actions, harness and
// runtime tools, and MCP server tools.
message PermissionSet {
  // Its identity and version.
  Metadata metadata = 1;
  // What is declared.
  PermissionSetSpec spec = 2;
  // What the Control Plane observes.
  PermissionSetStatus status = 3;
}

// A Permission Set's declared permissions, and the `spec` of a
// `PermissionSet` manifest. Apply merges approvers and permissions entry by
// entry; a permission is keyed by its target, scope or resource, and action.
message PermissionSetSpec {
  option (supertag.operator.v1.manifest) = {
    kind: "PermissionSet"
    name: {min_length: 1}
  };

  // Who may decide its gated permissions: `operator:OPERATOR_ID` or
  // `tag:TAG`, by name or ID. Repeated entries count once.
  repeated string approvers = 1 [(supertag.operator.v1.manifest_field) = {
    pattern: "^\\s*(operator|tag):\\s*\\S"
    max_items: 50
  }];
  // Its permissions.
  repeated Permission permissions = 2 [(supertag.operator.v1.manifest_field) = {required: true}];
}

// One permission. In a manifest it is `target` beside the target's fields,
// `action` and `approval`.
message Permission {
  // The permission's ID.
  string id = 1 [(supertag.operator.v1.manifest_field) = {output_only: true}];
  // What it grants authority over.
  oneof target {
    option (supertag.operator.v1.manifest_oneof) = {
      required: true
      discriminator: "target"
    };
    // An action on a collaboration surface through one Surface Account.
    SurfacePermission surface = 2;
    // A harness or runtime capability, such as `commands:execute`.
    RuntimePermission runtime = 3;
    // Tools of an MCP server.
    McpPermission mcp = 4;
  }
  // The action, such as `commands:execute`, `issues:comment`, or for MCP
  // `server/tool`, where the tool may be `*`.
  string action = 5 [(supertag.operator.v1.manifest_field) = {
    required: true
    min_length: 1
  }];
  // Whether using it needs a decision first.
  PermissionApproval approval = 6;
  // Who added it.
  string created_by = 7 [(supertag.operator.v1.manifest_field) = {output_only: true}];
  // When it was added.
  google.protobuf.Timestamp created_at = 8 [(supertag.operator.v1.manifest_field) = {output_only: true}];
}

// Authority for an action on a collaboration surface.
message SurfacePermission {
  // The Surface Account's ID.
  string surface_account_id = 1 [(supertag.operator.v1.manifest_field) = {
    required: true
    min_length: 1
  }];
  // Where on the account, such as a channel or `owner/repo`.
  string scope = 2 [(supertag.operator.v1.manifest_field) = {
    required: true
    min_length: 1
  }];
  // A canonical, non-secret locator for the resource, used to pick the
  // target when a request names it.
  string reference = 3;
}

// Authority for a harness or runtime capability.
message RuntimePermission {}

// Authority to call tools of an MCP server.
message McpPermission {
  // Limits the grant to calls whose arguments name this resource, for
  // servers with a resource mapping. Empty: any call.
  string resource = 1;
}

// Whether a permission is gated.
enum PermissionApproval {
  // Not gated.
  PERMISSION_APPROVAL_UNSPECIFIED = 0;
  // Each use needs a decision from one of the set's approvers.
  PERMISSION_APPROVAL_REQUIRED = 1 [(supertag.operator.v1.manifest_value) = "required"];
}

// What the Control Plane observes of a Permission Set.
message PermissionSetStatus {
  // The IDs of the Tag locations it is activated at.
  repeated string bindings = 1;
}

// A Context Set: reusable knowledge and Skills that may enter a Task.
message ContextSet {
  // Its identity and version.
  Metadata metadata = 1;
  // What is declared.
  ContextSetSpec spec = 2;
  // What the Control Plane observes.
  ContextSetStatus status = 3;
}

// A Context Set's declared items, and the `spec` of a `ContextSet`
// manifest. Apply merges items by `item_key`.
message ContextSetSpec {
  option (supertag.operator.v1.manifest) = {
    kind: "ContextSet"
    name: {min_length: 1}
  };

  // Its items.
  repeated ContextItem items = 1 [(supertag.operator.v1.manifest_field) = {required: true}];
}

// One Context Item: content a Worker resolver brings into a Task.
message ContextItem {
  // The item's ID.
  string id = 1 [(supertag.operator.v1.manifest_field) = {output_only: true}];
  // Its stable key within the set, which makes applying it idempotent.
  string item_key = 2 [(supertag.operator.v1.manifest_field) = {
    required: true
    min_length: 1
  }];
  // The Context Item contract, such as `supertag/skill`.
  string type = 3 [(supertag.operator.v1.manifest_field) = {
    required: true
    min_length: 1
  }];
  // The contract's version.
  int32 version = 4 [(supertag.operator.v1.manifest_field) = {
    required: true
    minimum: 1
  }];
  // A required item fails closed when no compatible Worker resolver is
  // available.
  bool required = 5 [(supertag.operator.v1.manifest_field) = {required: true}];
  // Settings the resolver reads. Never secret.
  google.protobuf.Struct config = 6 [(supertag.operator.v1.manifest_field) = {required: true}];
  // Who added it.
  string created_by = 7 [(supertag.operator.v1.manifest_field) = {output_only: true}];
  // When it was added.
  google.protobuf.Timestamp created_at = 8 [(supertag.operator.v1.manifest_field) = {output_only: true}];
}

// What the Control Plane observes of a Context Set.
message ContextSetStatus {
  // The IDs of the Tag locations it is activated at.
  repeated string bindings = 1;
}

// A Volume: a named storage location outside git and the name of the
// credential that reaches it.
message Volume {
  // Its identity and version.
  Metadata metadata = 1;
  // What is declared.
  VolumeSpec spec = 2;
}

// A Volume's source and credential name, and the `spec` of a `Volume`
// manifest. Apply replaces it whole.
message VolumeSpec {
  option (supertag.operator.v1.manifest) = {
    kind: "Volume"
    name: {pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"}
  };

  // Where the data lives: `s3://BUCKET/PREFIX`, `r2://BUCKET/PREFIX`,
  // `file:///ABSOLUTE/PATH` on the Worker Host, and for native mounts
  // `gs://BUCKET/PREFIX/` or `modal-volume://NAME/PREFIX/`. S3 and R2 accept
  // the `region`, `endpoint` and `forcePathStyle` query parameters.
  // Credentials, fragments, and `.` or `..` segments are refused.
  string source = 1 [(supertag.operator.v1.manifest_field) = {
    required: true
    min_length: 1
    max_length: 1024
  }];
  // The name each Worker Host maps to a secret, a provider-held reference or
  // its consent. Never a secret value: one that looks like a key is refused.
  string credential = 2 [(supertag.operator.v1.manifest_field) = {
    required: true
    min_length: 1
  }];
}

// A Workspace: a named repository Objectives may work in.
message Workspace {
  // Its identity and version.
  Metadata metadata = 1;
  // What is declared.
  WorkspaceSpec spec = 2;
  // What the Control Plane observes.
  WorkspaceStatus status = 3;
}

// A Workspace's declared fields, and the `spec` of a `Workspace` manifest.
// Every field is optional, and a manifest may leave out `spec`. A field an
// earlier apply set that a later manifest omits returns to its default.
message WorkspaceSpec {
  option (supertag.operator.v1.manifest) = {
    kind: "Workspace"
    name: {pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"}
    spec_optional: true
  };
  option (supertag.operator.v1.manifest_requirements) = {
    path: "delivery"
    equals: "pull-request"
    required: ["source"]
  };

  // The git remote hosts without a checkout clone. Embedded credentials are
  // refused. Required with `mounts`, and a github.com remote with
  // `pull-request` delivery.
  string source = 1 [(supertag.operator.v1.manifest_field) = {
    min_length: 1
    max_length: 2048
  }];
  // The base of each new Session branch. Empty: the checkout's current
  // branch, or the source's default branch in a clone, else `main`.
  string ref = 2 [(supertag.operator.v1.manifest_field) = {
    min_length: 1
    max_length: 200
  }];
  // One shell command, on one line, run once in each new Task worktree.
  string setup = 3 [(supertag.operator.v1.manifest_field) = {
    min_length: 1
    max_length: 4000
  }];
  // Server names selected from the trusted checkout's `.mcp.json`, without
  // duplicates.
  repeated string mcp = 4 [(supertag.operator.v1.manifest_field) = {
    pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,62}$"
    max_items: 64
  }];
  // Skill names selected from the host checkout, without duplicates.
  repeated string skills = 5 [(supertag.operator.v1.manifest_field) = {
    pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,62}$"
    max_items: 64
  }];
  // Skills from a GitHub repository, selected for every Task.
  WorkspaceSkillCatalog skill_catalog = 6;
  // Volumes attached at absolute paths outside the checkout. Paths may not
  // overlap each other, staged files or protected system locations.
  repeated WorkspaceMount mounts = 7 [(supertag.operator.v1.manifest_field) = {max_items: 64}];
  // How Tasks deliver their changes. Unset: `branch`.
  WorkspaceDeliveryMode delivery = 8;
}

// Skills from a GitHub repository at one revision.
message WorkspaceSkillCatalog {
  // The repository as `OWNER/REPO`.
  string repository = 1 [(supertag.operator.v1.manifest_field) = {
    required: true
    pattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
  }];
  // The directory within it that holds the Skills.
  string path = 2 [(supertag.operator.v1.manifest_field) = {
    required: true
    pattern: "^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$"
    max_length: 512
  }];
  // The branch, tag or commit to read.
  string revision = 3 [(supertag.operator.v1.manifest_field) = {
    required: true
    min_length: 1
  }];
  // The Skill names, distinct from `WorkspaceSpec.skills`.
  repeated string skills = 4 [(supertag.operator.v1.manifest_field) = {
    required: true
    pattern: "^[a-zA-Z0-9][a-zA-Z0-9._-]{0,62}$"
    min_items: 1
    max_items: 64
  }];
}

// One Volume attached to a Workspace's Tasks.
message WorkspaceMount {
  // The Volume's name.
  string volume = 1 [(supertag.operator.v1.manifest_field) = {
    required: true
    pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
  }];
  // The absolute path it appears at, outside the checkout.
  string path = 2 [(supertag.operator.v1.manifest_field) = {
    required: true
    pattern: "^/"
  }];
  // How the Task may use it. Unset: `read-only`.
  MountAccess access = 3;
  // How it is attached. Unset: `copy`.
  WorkspaceMountStrategy strategy = 4;
  // The most bytes a copy may hold. Unset: only the 20 GiB limit of every
  // Task Attempt.
  optional int64 max_bytes = 5 [(supertag.operator.v1.manifest_field) = {minimum: 1}];
}

// How a Volume is attached to a Task.
enum WorkspaceMountStrategy {
  WORKSPACE_MOUNT_STRATEGY_UNSPECIFIED = 0;
  // Its files are copied in before the Task starts.
  WORKSPACE_MOUNT_STRATEGY_COPY = 1 [(supertag.operator.v1.manifest_value) = "copy"];
  // It is mounted live, on providers that support native mounts.
  WORKSPACE_MOUNT_STRATEGY_MOUNT = 2 [(supertag.operator.v1.manifest_value) = "mount"];
}

// What the Control Plane observes of a Workspace.
message WorkspaceStatus {
  // Enrolled Worker Hosts whose latest descriptor declares a checkout of it,
  // by ID.
  repeated WorkspaceWorkerHost worker_hosts = 1;
  // Enrolled Worker Hosts that serve it, by environment provider, with what
  // their latest Task Attempt prepared. Only `GetResource` sets it.
  repeated WorkspaceEnvironment environments = 2;
}

// A Worker Host with a checkout of a Workspace.
message WorkspaceWorkerHost {
  // The host's ID.
  string id = 1;
  // Whether its Worklet is connected.
  WorkerHostConnection connection = 2;
}

// How one Worker Host serves a Workspace.
message WorkspaceEnvironment {
  // The host's ID.
  string worker_host_id = 1;
  // Whether its Worklet is connected.
  WorkerHostConnection connection = 2;
  // The environment provider: `local`, or a remote sandbox provider such as
  // `e2b` or `modal`.
  string provider = 3;
  // The environment the host's latest Task Attempt prepared. Unset when none
  // reported one.
  PreparedWorkspace prepared = 4;
  // When that Task Attempt reported it.
  google.protobuf.Timestamp prepared_at = 5;
  // Why the host's provider refuses the Workspace's Tasks. Empty when it does
  // not.
  string refusal = 6;
}

// A Worker Profile: a versioned execution configuration a Worker on one
// Worker Host advertises. It is observed, never applied.
message WorkerProfile {
  // `id` is `HOST:WORKER:PROFILE@REVISION` and `name` is
  // `PROFILE@REVISION`. Both timestamps are when the Control Plane started.
  Metadata metadata = 1;
  // Which profile.
  WorkerProfileSpec spec = 2;
  // Where it is offered.
  WorkerProfileStatus status = 3;
}

// Which Worker Profile.
message WorkerProfileSpec {
  // The profile and its revision.
  WorkerProfileRef ref = 1;
}

// Where a Worker Profile is offered.
message WorkerProfileStatus {
  // Whether its Worker Host is ready.
  WorkerProfilePhase phase = 1;
  // The Worker Host's ID.
  string worker_host_id = 2;
  // The Worklet's ID.
  string worklet_id = 3;
  // The Worker's ID on that host.
  string worker_id = 4;
}

// Whether a Worker Profile can take Tasks.
enum WorkerProfilePhase {
  WORKER_PROFILE_PHASE_UNSPECIFIED = 0;
  // Its Worker Host is ready.
  WORKER_PROFILE_PHASE_AVAILABLE = 1;
  // Its Worker Host is not ready.
  WORKER_PROFILE_PHASE_UNAVAILABLE = 2;
}

// The `spec` of a `SurfaceAccount` manifest: one connected account of a
// collaboration surface. In a manifest it is `provider` beside that
// provider's fields. Its secrets are references, never values; a literal
// value is invalid. `metadata.name` stays bound to the provider account it
// first named. Apply merges `configuration` and `secrets` entry by entry.
//
// Reading a Surface Account returns `SurfaceAccount`, with the fields its
// verification recorded.
message SurfaceAccountManifestSpec {
  option (supertag.operator.v1.manifest) = {
    kind: "SurfaceAccount"
    name: {pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"}
  };

  // The provider and its fields.
  oneof account {
    option (supertag.operator.v1.manifest_oneof) = {
      required: true
      discriminator: "provider"
    };
    // A Slack workspace.
    SlackAccountSpec slack = 1;
    // A GitHub token or GitHub App installation.
    GithubAccountSpec github = 2;
    // A Lark or Feishu app.
    LarkAccountSpec lark = 3;
    // A Linear workspace.
    LinearAccountSpec linear = 4;
    // A Microsoft Teams tenant.
    TeamsAccountSpec teams = 5;
  }
}

// A Slack Surface Account. Socket Mode needs `appToken`; HTTP events need
// `signingSecret`.
message SlackAccountSpec {
  option (supertag.operator.v1.manifest_requirements) = {
    path: "configuration.transport"
    equals: "http"
    required: ["secrets.signingSecret"]
    otherwise_required: ["secrets.appToken"]
  };

  // Overrides the workspace name Slack reports.
  string display_name = 1 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
  // Its options.
  SlackAccountConfiguration configuration = 2;
  // Where its secrets come from.
  SlackAccountSecrets secrets = 3 [(supertag.operator.v1.manifest_field) = {required: true}];
}

// A Slack Surface Account's options.
message SlackAccountConfiguration {
  // How events arrive. Unset: `socket`.
  SlackTransport transport = 1;
}

// How a Slack Surface Account receives events.
enum SlackTransport {
  SLACK_TRANSPORT_UNSPECIFIED = 0;
  // Socket Mode, with an app-level token.
  SLACK_TRANSPORT_SOCKET = 1 [(supertag.operator.v1.manifest_value) = "socket"];
  // Signed events sent to the Gateway.
  SLACK_TRANSPORT_HTTP = 2 [(supertag.operator.v1.manifest_value) = "http"];
}

// Where a Slack Surface Account's secrets come from.
message SlackAccountSecrets {
  // The bot token.
  SurfaceSecretReference bot_token = 1 [(supertag.operator.v1.manifest_field) = {required: true}];
  // The app-level token, for Socket Mode.
  SurfaceSecretReference app_token = 2;
  // The signing secret, for HTTP events.
  SurfaceSecretReference signing_secret = 3;
}

// A GitHub Surface Account. A fine-grained token needs `token`; a GitHub App
// needs `appId`, `installationId`, `privateKey` and `webhookSecret`.
message GithubAccountSpec {
  option (supertag.operator.v1.manifest_requirements) = {
    path: "configuration.auth"
    equals: "app"
    required: [
      "configuration.appId",
      "configuration.installationId",
      "secrets.privateKey",
      "secrets.webhookSecret"
    ]
    otherwise_required: ["secrets.token"]
  };

  // Overrides the account name GitHub reports.
  string display_name = 1 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
  // Its options.
  GithubAccountConfiguration configuration = 2;
  // Where its secrets come from.
  GithubAccountSecrets secrets = 3 [(supertag.operator.v1.manifest_field) = {required: true}];
}

// A GitHub Surface Account's options.
message GithubAccountConfiguration {
  // How SuperTag authenticates. Unset: `token`.
  GithubAuth auth = 1;
  // The API's base URL, for GitHub Enterprise Server.
  string api_base_url = 2 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
  // The GitHub App's ID, for `auth: app`.
  string app_id = 3 [(supertag.operator.v1.manifest_field) = {pattern: "^[0-9]+$"}];
  // The GitHub App installation's ID, for `auth: app`.
  string installation_id = 4 [(supertag.operator.v1.manifest_field) = {pattern: "^[0-9]+$"}];
}

// How a GitHub Surface Account authenticates.
enum GithubAuth {
  GITHUB_AUTH_UNSPECIFIED = 0;
  // A fine-grained token.
  GITHUB_AUTH_TOKEN = 1 [(supertag.operator.v1.manifest_value) = "token"];
  // A GitHub App installation.
  GITHUB_AUTH_APP = 2 [(supertag.operator.v1.manifest_value) = "app"];
}

// Where a GitHub Surface Account's secrets come from.
message GithubAccountSecrets {
  // The fine-grained token, for `auth: token`.
  SurfaceSecretReference token = 1;
  // The GitHub App's private key, for `auth: app`.
  SurfaceSecretReference private_key = 2;
  // The webhook secret, for `auth: app`.
  SurfaceSecretReference webhook_secret = 3;
}

// A Lark or Feishu Surface Account.
message LarkAccountSpec {
  // Overrides the app name Lark reports.
  string display_name = 1 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
  // Its options.
  LarkAccountConfiguration configuration = 2 [(supertag.operator.v1.manifest_field) = {required: true}];
  // Where its secrets come from.
  LarkAccountSecrets secrets = 3 [(supertag.operator.v1.manifest_field) = {required: true}];
}

// A Lark Surface Account's options.
message LarkAccountConfiguration {
  // The app's ID.
  string app_id = 1 [(supertag.operator.v1.manifest_field) = {
    required: true
    min_length: 1
  }];
  // Which service. Unset: `lark`.
  LarkDomain domain = 2;
}

// Which Lark service an account uses.
enum LarkDomain {
  LARK_DOMAIN_UNSPECIFIED = 0;
  // Lark.
  LARK_DOMAIN_LARK = 1 [(supertag.operator.v1.manifest_value) = "lark"];
  // Feishu.
  LARK_DOMAIN_FEISHU = 2 [(supertag.operator.v1.manifest_value) = "feishu"];
}

// Where a Lark Surface Account's secrets come from.
message LarkAccountSecrets {
  // The app secret.
  SurfaceSecretReference app_secret = 1 [(supertag.operator.v1.manifest_field) = {required: true}];
}

// A Linear Surface Account.
message LinearAccountSpec {
  // Overrides the workspace name Linear reports.
  string display_name = 1 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
  // Its options.
  LinearAccountConfiguration configuration = 2;
  // Where its secrets come from.
  LinearAccountSecrets secrets = 3 [(supertag.operator.v1.manifest_field) = {required: true}];
}

// A Linear Surface Account's options.
message LinearAccountConfiguration {
  // The API's base URL.
  string api_base_url = 1 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
}

// Where a Linear Surface Account's secrets come from.
message LinearAccountSecrets {
  // The API key.
  SurfaceSecretReference api_key = 1 [(supertag.operator.v1.manifest_field) = {required: true}];
  // The webhook signing secret.
  SurfaceSecretReference webhook_secret = 2 [(supertag.operator.v1.manifest_field) = {required: true}];
}

// A Microsoft Teams Surface Account.
message TeamsAccountSpec {
  // The tenant's name for people. Empty: the tenant ID.
  string display_name = 1 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
  // Its options.
  TeamsAccountConfiguration configuration = 2 [(supertag.operator.v1.manifest_field) = {required: true}];
  // Where its secrets come from.
  TeamsAccountSecrets secrets = 3 [(supertag.operator.v1.manifest_field) = {required: true}];
}

// A Microsoft Teams Surface Account's options.
message TeamsAccountConfiguration {
