syntax = "proto3";
package supertag.operator.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "supertag/operator/v1/common.proto";
import "supertag/operator/v1/options.proto";

option go_package = "github.com/atemaguer/supertag/packages/operator-api/go/operatorv1;operatorv1";

// Collaboration surface connections and where Tags answer on them: `supertag
// setup surface`, `list surface`, `get surface`, `update tag --add-location`
// and `--remove-location`, and `activate` and `deactivate` of a Context Set
// or Permission Set.
//
// A Surface Account is one connected account of a collaboration surface,
// such as a Slack workspace or a GitHub App installation. The Control Plane
// keeps its credentials in its credential vault and never returns them. A
// location is one place on a Surface Account where a Tag answers, such as a
// Slack channel or a GitHub repository. A Context Set or Permission Set
// applies to a Tag only in the locations it is activated for.
//
// The webhooks collaboration surfaces call stay plain HTTP. Applying and
// deleting SurfaceAccount manifests is `ResourceService`'s.
//
// Access. The admin token and Operator Tokens may call every RPC; a scoped
// coordination credential is refused with `PermissionDenied`. Every caller
// sees every Surface Account.
//
// Every RPC that names a Tag takes its name, and fails with `InvalidArgument`
// for an empty one and `NotFound` for a Tag that does not exist or was
// deleted. A call while the Control Plane drains fails with `Unavailable` and
// `ERROR_REASON_DRAINING`.
service SurfaceService {
  // Saves a Surface Account whose credentials the caller already verified
  // with its provider, as `supertag setup surface` does. The secrets go to
  // the credential vault, and the account's phase becomes
  // `SURFACE_ACCOUNT_PHASE_CONNECTED`. An account with the same provider and
  // `external_account_id` is updated in place, so repeating the call changes
  // nothing more; a retired account is connected again. Its manifest name
  // and secret references are kept.
  //
  // It fails with `InvalidArgument`, and `fields` naming each one, for a
  // missing provider or an empty `external_account_id`, `display_name` or
  // `auth_method`.
  rpc SetUpSurface(SetUpSurfaceRequest) returns (SurfaceAccount) {
    option (supertag.operator.v1.action) = "set_up_surface";
    option (supertag.operator.v1.audit_action) = "surface.enroll";
  }

  // Lists connected Surface Accounts, the earliest created first, as
  // `supertag list surface` shows them. Retired accounts are left out, as
  // they are from `GetSurfaceAccount`. It fails with `InvalidArgument` for a
  // malformed `page_token`.
  rpc ListSurfaceAccounts(ListSurfaceAccountsRequest) returns (ListSurfaceAccountsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (supertag.operator.v1.action) = "read_surface_account";
  }

  // Reads one Surface Account, as `supertag get surface` shows it. It fails
  // with `InvalidArgument` for an empty `name` and `NotFound` for an account
  // it names none of.
  rpc GetSurfaceAccount(GetSurfaceAccountRequest) returns (SurfaceAccount) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (supertag.operator.v1.action) = "read_surface_account";
  }

  // Makes a Tag answer in a location, as `supertag update tag
  // --add-location` does. The Control Plane resolves the location on its
  // Surface Account, asking the provider with the account's credentials when
  // the location names a GitHub repository or a Linear team by name. Adding
  // a location the Tag already has changes nothing and succeeds with
  // `changed` false. A location has at most one Tag: adding one another Tag
  // has fails with `FailedPrecondition` and `ERROR_REASON_CONFLICT`.
  //
  // It fails with `InvalidArgument`, and `fields` naming the field, when a
  // field the provider needs is empty or one it does not use is set, and
  // `FailedPrecondition` and `ERROR_REASON_CONFLICT` when `location.account`
  // selects no Surface Account of the provider or more than one. It fails
  // with `NotFound` when the provider does not know the repository or team,
  // and `Unavailable` when the provider cannot be reached.
  rpc AddTagLocation(AddTagLocationRequest) returns (TagLocationChange) {
    option (supertag.operator.v1.action) = "manage_tag_location";
    option (supertag.operator.v1.audit_action) = "tag.location.add";
  }

  // Stops a Tag answering in a location, as `supertag update tag
  // --remove-location` does, and deactivates every Context Set and
  // Permission Set activated there. Removing a location the Tag does not
  // have changes nothing and succeeds with `changed` false. It fails as
  // `AddTagLocation` does.
  rpc RemoveTagLocation(RemoveTagLocationRequest) returns (TagLocationChange) {
    option (supertag.operator.v1.action) = "manage_tag_location";
    option (supertag.operator.v1.audit_action) = "tag.location.remove";
  }

  // Activates a Context Set or Permission Set of a Tag in one of the Tag's
  // locations, as `supertag activate context-set` and `activate
  // permission-set` do. Activating a set that is already active there
  // changes nothing. It fails with `NotFound` when the Tag has no set of
  // that kind and name, and `FailedPrecondition` and `ERROR_REASON_CONFLICT`
  // when the Tag does not answer in the location. Otherwise it fails as
  // `AddTagLocation` does.
  rpc ActivateSet(ActivateSetRequest) returns (SetActivationChange) {
    option (supertag.operator.v1.action) = "manage_set_activation";
    option (supertag.operator.v1.audit_action) = "tag.set.activate";
  }

  // Deactivates a Context Set or Permission Set of a Tag in one of the Tag's
  // locations, as `supertag deactivate context-set` and `deactivate
  // permission-set` do. Deactivating a set that is not active there changes
  // nothing. It fails as `ActivateSet` does.
  rpc DeactivateSet(DeactivateSetRequest) returns (SetActivationChange) {
    option (supertag.operator.v1.action) = "manage_set_activation";
    option (supertag.operator.v1.audit_action) = "tag.set.deactivate";
  }
}

message SetUpSurfaceRequest {
  // The account's collaboration surface.
  SurfaceProvider provider = 1;
  // The account's ID at the provider, such as a Slack team ID or a GitHub
  // App installation ID.
  string external_account_id = 2;
  // The account's name for people, such as the Slack workspace name.
  string display_name = 3;
  // How SuperTag authenticates to the provider, such as `slack-socket-mode`
  // or `github-app`.
  string auth_method = 4;
  // Settings that are not secret, such as an API base URL or an App ID.
  google.protobuf.Struct configuration = 5;
  // The verified credentials by name, such as `botToken`. The Control Plane
  // stores them in its credential vault. They are never returned, logged or
  // recorded in the audit trail.
  map<string, string> secrets = 6;
}

message ListSurfaceAccountsRequest {
  // At most this many accounts; 0 means 100, and more than 500 means 500.
  int32 page_size = 1;
  // The `next_page_token` of the previous page.
  string page_token = 2;
}

message ListSurfaceAccountsResponse {
  // The accounts, the earliest created first.
  repeated SurfaceAccount surface_accounts = 1;
  // Fetches the next page. Empty on the last page.
  string next_page_token = 2;
}

message GetSurfaceAccountRequest {
  // The account's `metadata.name`: its SurfaceAccount manifest name, or
  // `PROVIDER:EXTERNAL_ACCOUNT_ID` for an account set up with `supertag
  // setup surface`, such as `slack:T0123456789`. A manifest name wins over
  // the other form.
  string name = 1;
}

message AddTagLocationRequest {
  // The Tag's name.
  string tag = 1;
  // The location.
  SurfaceLocation location = 2;
}

message RemoveTagLocationRequest {
  // The Tag's name.
  string tag = 1;
  // The location.
  SurfaceLocation location = 2;
}

message ActivateSetRequest {
  // Whether `set` names a Context Set or a Permission Set.
  SetKind kind = 1;
  // The set's name.
  string set = 2;
  // The Tag's name.
  string tag = 3;
  // One of the Tag's locations.
  SurfaceLocation location = 4;
}

message DeactivateSetRequest {
  // Whether `set` names a Context Set or a Permission Set.
  SetKind kind = 1;
  // The set's name.
  string set = 2;
  // The Tag's name.
  string tag = 3;
  // One of the Tag's locations.
  SurfaceLocation location = 4;
}

// One place on a collaboration surface, as the `--add-location` flags name
// it. Set the fields the provider needs and no others:
//
// | Provider | Fields |
// | --- | --- |
// | Slack | `channel_id` |
// | Lark | `chat_id` |
// | Microsoft Teams | `team_id` and `channel_id` |
// | GitHub | `repo` or `repo_id` |
// | Linear | `team` or `team_id` |
message SurfaceLocation {
  // The collaboration surface.
  SurfaceProvider provider = 1;
  // Selects the Surface Account by its ID, its external account ID or its
  // manifest name. Empty selects the provider's only Surface Account.
  string account = 2;
  // A Slack channel ID, such as `C0123456789`, or a Microsoft Teams channel
  // ID. Slack IDs are uppercased.
  string channel_id = 3;
  // A Lark chat ID.
  string chat_id = 4;
  // A Microsoft Teams team ID, or a Linear team UUID.
  string team_id = 5;
  // A Linear team's name or key, which the Control Plane resolves with the
  // account's credentials.
  string team = 6;
  // A GitHub repository ID.
  string repo_id = 7;
  // A GitHub repository as `owner/name`, which the Control Plane resolves
  // with the account's credentials.
  string repo = 8;
}

// What `AddTagLocation` or `RemoveTagLocation` did.
message TagLocationChange {
  // The Tag's name.
  string tag = 1;
  // The Tag's ID.
  string tag_id = 2;
  // The location's collaboration surface.
  SurfaceProvider provider = 3;
  // The location for people, such as `C0123456789` for a Slack channel or
  // `chat oc_123` for a Lark chat.
  string location = 4;
  // The Surface Account's ID.
  string surface_account_id = 5;
  // The Surface Account's name for people.
  string account_display_name = 6;
  // False when the Tag already had the location, or did not have it, and
  // nothing changed.
  bool changed = 7;
}

// What `ActivateSet` or `DeactivateSet` did.
message SetActivationChange {
  // The set's kind.
  SetKind kind = 1;
  // The set's name.
  string set = 2;
  // The Tag's name.
  string tag = 3;
  // The location's collaboration surface.
  SurfaceProvider provider = 4;
  // The location for people, as in `TagLocationChange.location`.
  string location = 5;
  // The Surface Account's ID.
  string surface_account_id = 6;
}

// A kind of set a Tag activates per location.
enum SetKind {
  SET_KIND_UNSPECIFIED = 0;
  // A Context Set: what the Tag knows.
  SET_KIND_CONTEXT_SET = 1;
  // A Permission Set: what the Tag may do.
  SET_KIND_PERMISSION_SET = 2;
}

// A collaboration surface.
enum SurfaceProvider {
  SURFACE_PROVIDER_UNSPECIFIED = 0;
  // Slack.
  SURFACE_PROVIDER_SLACK = 1;
  // GitHub.
  SURFACE_PROVIDER_GITHUB = 2;
  // Lark.
  SURFACE_PROVIDER_LARK = 3;
  // Linear.
  SURFACE_PROVIDER_LINEAR = 4;
  // Microsoft Teams.
  SURFACE_PROVIDER_TEAMS = 5;
}

// One Surface Account, without its credentials.
message SurfaceAccount {
  // `name` is the SurfaceAccount manifest name, or
  // `PROVIDER:EXTERNAL_ACCOUNT_ID` for an account set up with `supertag
  // setup surface`. `resource_version` changes when the account changes.
  Metadata metadata = 1;
  // Its collaboration surface.
  SurfaceProvider provider = 2;
  // Its ID at the provider.
  string external_account_id = 3;
  // Its name for people.
  string display_name = 4;
  // How SuperTag authenticates to the provider.
  string auth_method = 5;
  // Its settings that are not secret.
  google.protobuf.Struct configuration = 6;
  // Where each secret came from when a manifest last applied the account.
  // Unset for an account only `supertag setup surface` set up.
  SurfaceSecretReferences secrets = 7;
  // Its phase.
  SurfaceAccountPhase phase = 8;
  // When its credentials were last verified.
  google.protobuf.Timestamp last_verified_at = 9;
}

// Where a SurfaceAccount manifest took its secrets from.
message SurfaceSecretReferences {
  // The reference of each secret, by the secret's name.
  map<string, SurfaceSecretReference> references = 1;
}

// Where a SurfaceAccount manifest takes one secret from. Never the value.
message SurfaceSecretReference {
  oneof source {
    option (supertag.operator.v1.manifest_oneof) = {required: true};
    // A named secret its caller resolves, such as an entry in the `secrets`
    // map of `supertag.yaml`.
    string secret_ref = 1 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
    // An environment variable the applying caller reads.
    string env = 2 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
    // A file the applying caller reads. A relative path starts from the
    // manifest's directory.
    string file = 3 [(supertag.operator.v1.manifest_field) = {min_length: 1}];
  }
}

// A Surface Account's phase.
enum SurfaceAccountPhase {
  SURFACE_ACCOUNT_PHASE_UNSPECIFIED = 0;
  // It receives and sends.
  SURFACE_ACCOUNT_PHASE_CONNECTED = 1;
  // It keeps its history but receives and sends nothing, and holds no
  // credential.
  SURFACE_ACCOUNT_PHASE_RETIRED = 2;
}
