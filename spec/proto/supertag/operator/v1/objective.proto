syntax = "proto3";
package supertag.operator.v1;

import "google/protobuf/timestamp.proto";
import "supertag/operator/v1/options.proto";
import "supertag/operator/v1/task.proto";
import "supertag/operator/v1/team.proto";

option go_package = "github.com/atemaguer/supertag/packages/operator-api/go/operatorv1;operatorv1";

// An operator's Objectives: `supertag create objective`, `list objective`,
// `get objective`, `describe objective`, `watch objective`, `message
// objective`, `approve objective`, `update objective`, `complete objective`,
// `cancel objective`, `pause objective` and `resume objective`.
//
// An Objective is an outcome its owner Tag works toward in a conversation of
// its own, with a budget, a deadline, and a status. The owner may hand work to
// work Sessions of its Team's members. Applying an `Objective` manifest is not
// part of this service.
//
// Access. The admin token and Operator Tokens may call every RPC. An RPC that
// sets `(supertag.operator.v1.allow_scoped_credential)` also accepts a scoped
// coordination credential that carries the RPC's action, for the Objectives
// its scope names only: any other Objective fails with `PermissionDenied`.
//
// Every RPC that names an Objective fails with `InvalidArgument` for an empty
// `id` and `NotFound` for an Objective that does not exist. Every RPC that
// changes an Objective fails with `Unavailable` and `ERROR_REASON_DRAINING`
// while the Control Plane drains. A refusal because of the Objective's state,
// such as a stale revision or a cancelled Objective, is `FailedPrecondition`
// with `ERROR_REASON_CONFLICT`, and the message says why.
service ObjectiveService {
  // Creates an Objective and starts it: the owner takes its first turn.
  //
  // Repeating the call with the same `id` and definition returns the same
  // Objective and starts nothing new, so a create that could not start the
  // Objective, such as for an owner without a connected Worker Host, starts it
  // when repeated once that is fixed. The same `id` with a different
  // definition fails with `FailedPrecondition`.
  //
  // `warnings` names each condition that would hold the Objective's turns or
  // limit what they may do; creation still succeeds. With `dry_run` the call
  // checks and warns exactly as a create does, returns the Objective it would
  // create, and stores and starts nothing.
  //
  // It fails with `InvalidArgument` for an empty outcome, a malformed `id`,
  // deadline, budget, runtime action or Workspace name, and `NotFound` for an
  // owner Tag, Team or Workspace that does not exist.
  rpc CreateObjective(CreateObjectiveRequest) returns (CreateObjectiveResponse) {
    option (supertag.operator.v1.action) = "create_objective";
    option (supertag.operator.v1.audit_action) = "objective.create";
  }

  // Lists Objectives, the most recently created first. It fails with
  // `NotFound` when `owner` names a Tag that does not exist.
  rpc ListObjectives(ListObjectivesRequest) returns (ListObjectivesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (supertag.operator.v1.action) = "list_objectives";
  }

  // Reads one Objective.
  rpc GetObjective(GetObjectiveRequest) returns (Objective) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (supertag.operator.v1.action) = "read_objective";
    option (supertag.operator.v1.allow_scoped_credential) = true;
  }

  // Reads the operator's view of an Objective, as `supertag describe
  // objective` shows it: whether it can run, what needs the operator, spend
  // against its budget, its conversation, each of its Sessions with the Tag
  // running it and its latest Task's delivery and report, and one page of its
  // Tasks. The view is observed records, not a transactional snapshot: reread
  // the Objective before changing it and pass its `revision`.
  //
  // `page_size` and `page_token` page through `tasks` only; every other field
  // is whole on every page.
  rpc DescribeObjective(DescribeObjectiveRequest) returns (ObjectiveOverview) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (supertag.operator.v1.action) = "read_objective";
    option (supertag.operator.v1.allow_scoped_credential) = true;
  }

  // Sends a message to the Objective's conversation as its owner's next turn.
  // A message answers a question the owner asked, and moves a `blocked`,
  // `limited` or `ready_for_review` Objective back to `working`.
  //
  // The owner's reply goes to the Objective's home thread. When that is one
  // of the caller's conversations, as for an Objective created from the CLI,
  // follow it with `ConversationService.FollowMessage` with `tag` and
  // `task_id` from the response.
  //
  // It fails with `InvalidArgument` for empty text, and `FailedPrecondition`
  // for a completed or cancelled Objective.
  rpc MessageObjective(MessageObjectiveRequest) returns (MessageObjectiveResponse) {
    option (supertag.operator.v1.action) = "message_objective";
    option (supertag.operator.v1.audit_action) = "objective.message";
    option (supertag.operator.v1.allow_scoped_credential) = true;
  }

  // Changes an Objective's status, deadline, budget or runtime actions. Set at
  // least one of them, and `expected_revision` to the revision read last.
  //
  // - `status` sets `working`, `blocked`, `ready_for_review` or `completed`.
  //   `OBJECTIVE_STATUS_COMPLETED` needs `completion_summary`, as `supertag
  //   complete objective` sends it. `OBJECTIVE_STATUS_CANCELLED` fails with
  //   `InvalidArgument`: only `CancelObjective` cancels. Only the owner sets
  //   `OBJECTIVE_STATUS_LIMITED`, so it fails with `PermissionDenied`.
  // - `deadline` moves the deadline, including after it passed, but not on a
  //   completed Objective.
  // - `budget_limit_minor` raises the budget above its current limit, on an
  //   Objective that has a budget and is not completed.
  // - `runtime_actions` replaces the runtime actions for turns that start
  //   afterwards. Actions the owner Tag's Permission Sets do not allow are
  //   dropped, each with a warning.
  //
  // It fails with `InvalidArgument` for a request that sets nothing or sets a
  // malformed value, and `FailedPrecondition` when `expected_revision` is not
  // the Objective's revision, when the Objective is cancelled, and when it
  // refuses the deadline or budget change.
  rpc UpdateObjective(UpdateObjectiveRequest) returns (UpdateObjectiveResponse) {
    option (supertag.operator.v1.action) = "update_objective";
    option (supertag.operator.v1.audit_action) = "objective.update";
  }

  // Completes an Objective its owner submitted for review: its status
  // becomes `completed`, and the owner's assessment becomes the completion
  // summary. It fails with `FailedPrecondition` unless the Objective is
  // `ready_for_review`.
  rpc ApproveObjective(ApproveObjectiveRequest) returns (Objective) {
    option (supertag.operator.v1.action) = "update_objective";
    option (supertag.operator.v1.audit_action) = "objective.approve";
    option (supertag.operator.v1.allow_scoped_credential) = true;
  }

  // Cancels an Objective for good: its open Tasks are cancelled and nothing
  // new starts. Cancelling a cancelled Objective changes nothing, except that
  // it cancels any Task an earlier call left open, and succeeds with
  // `changed` false. It fails with `FailedPrecondition` for a completed
  // Objective.
  rpc CancelObjective(CancelObjectiveRequest) returns (CancelObjectiveResponse) {
    option (supertag.operator.v1.action) = "cancel_objective";
    option (supertag.operator.v1.audit_action) = "objective.cancel";
  }

  // Pauses an Objective: no new turn of its Sessions starts, running Task
  // Attempts finish, and messages and reports wait. Pausing a paused
  // Objective succeeds with `changed` false. It fails with
  // `FailedPrecondition` for a completed or cancelled Objective.
  rpc PauseObjective(PauseObjectiveRequest) returns (PauseObjectiveResponse) {
    option (supertag.operator.v1.action) = "update_objective";
    option (supertag.operator.v1.audit_action) = "objective.pause";
  }

  // Resumes a paused Objective: work starts again, and the owner receives a
  // summary of what changed while it was paused as its next turn. Resuming an
  // Objective that is not paused succeeds with `changed` false.
  rpc ResumeObjective(ResumeObjectiveRequest) returns (ResumeObjectiveResponse) {
    option (supertag.operator.v1.action) = "update_objective";
    option (supertag.operator.v1.audit_action) = "objective.resume";
  }
}

message CreateObjectiveRequest {
  // The Objective's ID: 1 to 200 characters without whitespace or control
  // characters, other than `.` and `..`. Empty generates one from the
  // outcome's first words, such as `ship-sso-7f3k`.
  string id = 1;
  // The outcome, as one statement: the result, how success is verified, what
  // must not change, and when to ask a person. Must not be empty.
  string outcome = 2;
  // The owner Tag's name.
  string owner = 3;
  // The name or ID of the Team whose members the owner may hand work to.
  // Empty: the owner works alone.
  string team = 4;
  // When the Objective is due. Unset: no deadline.
  google.protobuf.Timestamp deadline = 5;
  // The budget for the owner and all the work it starts. Unset: no budget.
  Budget budget = 6;
  // Runtime actions, such as `files:write`, that the Objective's Tasks may
  // receive. Empty: those the owner Tag's Permission Sets allow, recorded at
  // creation. A list narrows them; actions the owner lacks are dropped, each
  // with a warning.
  repeated string runtime_actions = 7;
  // Names of Workspaces the Objective's work may use. Each must exist.
  repeated string workspaces = 8;
  // A responsibility that only an operator ends: the owner never completes
  // it on its own.
  bool ongoing = 9;
  // Check and warn without creating or starting anything.
  bool dry_run = 10;
}

message CreateObjectiveResponse {
  // The Objective, or with `dry_run` the Objective the call would create.
  Objective objective = 1;
  // Each condition that would hold the Objective's turns or limit what they
  // may do, in one sentence, such as an owner Tag with no connected Worker
  // Host or a runtime action the owner lacks.
  repeated string warnings = 2;
  // The Task of the owner's first turn, when this call or an earlier one
  // started the Objective. Empty with `dry_run`, for a completed or cancelled
  // Objective, and when the Objective could not be started.
  string started_task_id = 3;
  // Why the Objective could not be started, in one sentence, when it could
  // not. Repeat the call with the Objective's `id` once that is fixed.
  string not_started = 4;
}

message ListObjectivesRequest {
  // Lists only Objectives this Tag owns, by name. Empty lists every Tag's.
  string owner = 1;
  // At most this many Objectives; 0 means 100, and more than 200 means 200.
  int32 page_size = 2;
  // The `next_page_token` of the previous page.
  string page_token = 3;
}

message ListObjectivesResponse {
  // The Objectives, the most recently created first.
  repeated Objective objectives = 1;
  // Fetches the next page. Empty on the last page.
  string next_page_token = 2;
}

message GetObjectiveRequest {
  // The Objective's ID.
  string id = 1;
}

message DescribeObjectiveRequest {
  // The Objective's ID.
  string id = 1;
  // At most this many `tasks`; 0 means 50, and more than 100 means 100.
  int32 page_size = 2;
  // The `next_page_token` of the previous page.
  string page_token = 3;
}

message MessageObjectiveRequest {
  // The Objective's ID.
  string id = 1;
  // The message. Leading and trailing whitespace is removed, and what remains
  // must not be empty.
  string text = 2;
  // Makes a retry safe. A repeat with the same key to the same Objective
  // returns the turn the first call started, with `duplicate` true, and sends
  // nothing. A key is 1 to 200 characters without whitespace or control
  // characters. Empty sends every call.
  string idempotency_key = 3;
}

message MessageObjectiveResponse {
  // The Task of the turn the message started, or of the turn an earlier call
  // with the same `idempotency_key` started.
  string task_id = 1;
  // The owner Tag's name, for `ConversationService.FollowMessage`.
  string tag = 2;
  // The message repeated an earlier one with the same `idempotency_key`, and
  // nothing was sent.
  bool duplicate = 3;
  // The status the message moved the Objective out of, back to `working`.
  // `OBJECTIVE_STATUS_UNSPECIFIED` when the status did not change.
  ObjectiveStatus status_change = 4;
}

message UpdateObjectiveRequest {
  // The Objective's ID.
  string id = 1;
  // The Objective's `revision` as the caller read it, from 1. The update
  // applies only while it is still the Objective's revision.
  int64 expected_revision = 2;
  // The new status. Unset leaves the status.
  optional ObjectiveStatus status = 3;
  // The assessment of the outcome and its supporting results. Required with
  // `OBJECTIVE_STATUS_COMPLETED`, and optional with
  // `OBJECTIVE_STATUS_READY_FOR_REVIEW`. Leading and trailing whitespace is
  // removed.
  optional string completion_summary = 4;
  // The new deadline. Unset leaves the deadline.
  google.protobuf.Timestamp deadline = 5;
  // The new budget limit in the budget's unit: minor units of its currency,
  // or allocation units for a budget without one. It must be above the
  // current limit. Unset leaves the budget.
  optional int64 budget_limit_minor = 6;
  // The runtime actions that replace the current ones. Unset leaves them.
  RuntimeActions runtime_actions = 7;
}

// A list of runtime actions, such as `files:write`.
message RuntimeActions {
  // The actions, at most 50.
  repeated string actions = 1;
}

message UpdateObjectiveResponse {
  // The Objective after the change, with its new `revision`.
  Objective objective = 1;
  // Each runtime action dropped because the owner Tag's Permission Sets do
  // not allow it, in one sentence.
  repeated string warnings = 2;
}

message ApproveObjectiveRequest {
  // The Objective's ID.
  string id = 1;
}

message CancelObjectiveRequest {
  // The Objective's ID.
  string id = 1;
  // Why the operator cancels it, recorded on the Objective and sent to its
  // owner. Empty gives no reason.
  string reason = 2;
}

message CancelObjectiveResponse {
  // The Objective, now `cancelled`.
  Objective objective = 1;
  // False when the Objective was already cancelled.
  bool changed = 2;
  // The open Tasks this call cancelled.
  repeated string cancelled_task_ids = 3;
}

message PauseObjectiveRequest {
  // The Objective's ID.
  string id = 1;
}

message PauseObjectiveResponse {
  // The Objective, with `paused_at` set.
  Objective objective = 1;
  // False when the Objective was already paused.
  bool changed = 2;
}

message ResumeObjectiveRequest {
  // The Objective's ID.
  string id = 1;
}

message ResumeObjectiveResponse {
  // The Objective, with `paused_at` unset.
  Objective objective = 1;
  // False when the Objective was not paused.
  bool changed = 2;
  // What the owner was told changed while the Objective was paused. Empty
  // when `changed` is false or the Objective is completed or cancelled.
  string summary = 3;
}

// Where an Objective stands.
enum ObjectiveStatus {
  OBJECTIVE_STATUS_UNSPECIFIED = 0;
  // The owner works on it.
  OBJECTIVE_STATUS_WORKING = 1;
  // The owner cannot continue without a person: it ended twice with nothing
  // running and nothing asked, or marked the Objective blocked.
  OBJECTIVE_STATUS_BLOCKED = 2;
  // It reached its budget or deadline limit. An operator raises the budget or
  // moves the deadline to resume it.
  OBJECTIVE_STATUS_LIMITED = 3;
  // The owner submitted its result for an operator's review.
  OBJECTIVE_STATUS_READY_FOR_REVIEW = 4;
  // It is done. Nothing new starts.
  OBJECTIVE_STATUS_COMPLETED = 5;
  // An operator cancelled it. Nothing new starts.
  OBJECTIVE_STATUS_CANCELLED = 6;
}

// A budget: provider-reported cost in a currency, or allocation units.
message Budget {
  // The limit, in minor units of `currency`, or in allocation units when
  // `currency` is empty.
  int64 limit_minor = 1;
  // The ISO 4217 code, such as `USD`. Empty keeps the budget in allocation
  // units, which provider-reported cost does not count against.
  string currency = 2;
}

// One Objective.
message Objective {
  // The Objective's ID.
  string id = 1;
  // The outcome statement.
  string outcome = 2;
  // The owner Tag's ID.
  string owner_tag_id = 3;
  // The owner Tag's name. Empty when the Tag no longer exists.
  string owner_tag = 4;
  // Where the Objective stands.
  ObjectiveStatus status = 5;
  // Increases with every change. Pass it as `expected_revision`.
  int64 revision = 6;
  // A responsibility that only an operator ends.
  bool ongoing = 7;
  // When it is due. Unset without a deadline.
  google.protobuf.Timestamp deadline = 8;
  // Its budget. Unset without one.
  Budget budget = 9;
  // Provider-reported spend against a budget in a currency, as last
  // observed. Unset without such a budget.
  ObjectiveSpend spend = 10;
  // The runtime actions its Tasks may receive.
  repeated string runtime_actions = 11;
  // The Workspaces its work may use.
  repeated string workspaces = 12;
  // The ID of the Team whose members the owner may hand work to. Empty when
  // the owner works alone.
  string team_id = 13;
  // The owner's assessment of the outcome: the result once completed, or
  // what the owner submitted for review.
  string completion_summary = 14;
  // The owner's account of progress, open work, blockers and the next step,
  // written when the Objective reached a limit. Unset until then.
  LimitSummary limit_summary = 15;
  // When it started: its first turn was admitted. Unset until then.
  google.protobuf.Timestamp execution_started_at = 16;
  // When an operator paused it. Unset while it runs.
  google.protobuf.Timestamp paused_at = 17;
  // When an operator cancelled it. Unset otherwise.
  google.protobuf.Timestamp cancelled_at = 18;
  // The operator's reason for cancelling it, when one was given.
  string cancellation_reason = 19;
  // The collaboration surface Task it was created from, such as a Slack
  // message. Empty for an Objective created through this API or a manifest.
  string surface_task_id = 20;
  // The surface Task an operator chose as its home thread, where the owner's
  // replies post, in place of the thread it was created in. Empty otherwise.
  string notification_task_id = 21;
  // When it was created.
  google.protobuf.Timestamp created_at = 22;
  // When it last changed.
  google.protobuf.Timestamp updated_at = 23;
}

// Provider-reported spend against an Objective's budget.
message ObjectiveSpend {
  // The provider-reported cost of every Task of the Objective's Sessions, in
  // minor units of the budget's currency.
  int64 amount_minor = 1;
  // The budget's ISO 4217 code.
  string currency = 2;
  // Executed Task Attempts that reported no cost. They are not counted as
  // zero, so actual spend may be higher.
  int32 unknown_cost_attempts = 3;
  // Task Attempts whose cost comes from a model price estimate.
  int32 estimated_cost_attempts = 4;
  // When the spend was last observed.
  google.protobuf.Timestamp observed_at = 5;
}

// The owner's summary at a limit.
message LimitSummary {
  // The summary. The Tag wrote it, so it is untrusted text.
  string text = 1;
  // When it was written.
  google.protobuf.Timestamp written_at = 2;
}

// The operator's view of one Objective. See `DescribeObjective`.
message ObjectiveOverview {
  // When the Control Plane read the records.
  google.protobuf.Timestamp captured_at = 1;
  // The Objective.
  Objective objective = 2;
  // Whether the Control Plane can execute Objectives now: `ready`,
  // `awaiting-coordination` until it knows the address Tasks coordinate
  // through, or `awaiting-worklet` until its Worklet service is attached.
  string execution_readiness = 3;
  // Whether the Objective's turns can run now. A completed or cancelled
  // Objective runs nothing more, whatever they say.
  repeated ObjectiveCondition conditions = 4;
  // What the operator should look at, each with the next step.
  repeated ObjectiveAttention attention = 5;
  // The Objective's approval requests: pending, and decided in the last day.
  ApprovalCounts approvals = 6;
  // Display names of the Tags this view names by ID, keyed by Tag ID. A Tag
  // that no longer exists has no entry.
  map<string, string> tag_names = 7;
  // The Team whose members the owner may hand work to. Unset when the owner
  // works alone.
  ObjectiveTeam team = 8;
  // The deadline and the budget, with the notices each raised.
  ObjectiveLimits limits = 9;
  // Spend against the budget and the usage behind it.
  ObjectiveBudgetUse budget = 10;
  // The newest turns of the Objective's own conversation, at most 25 Tasks'
  // worth, oldest first.
  repeated ObjectiveConversationEntry conversation = 11;
  // Every Session of the Objective: its own conversation first, then work
  // Sessions, oldest first.
  repeated ObjectiveSession sessions = 12;
  // High-severity findings in the latest result of each Session.
  repeated HighFinding high_findings = 13;
  // The Team's newest Workstream posts, at most 50, oldest first. Empty
  // without a Team.
  repeated WorkstreamPost posts = 14;
  // What the Objective's Task Attempts wrote to each Volume, by Volume name.
  repeated VolumeWrites writes = 15;
  // One page of the Tasks of every Session, oldest first within each
  // Session, the Objective's own Session first.
  repeated ObjectiveTask tasks = 16;
  // How many Tasks all pages hold.
  int32 total_tasks = 17;
  // Fetches the next page of `tasks`. Empty on the last page.
  string next_page_token = 18;
}

// A condition on an Objective, such as whether its turns can run.
message ObjectiveCondition {
  // The condition: `Runnable`.
  string type = 1;
  // Whether it holds.
  bool status = 2;
  // Why it does not, each in one sentence with the step that clears it.
  // Empty when it holds.
  repeated string reasons = 3;
}

// What about an Objective needs a look.
enum ObjectiveAttentionKind {
  OBJECTIVE_ATTENTION_KIND_UNSPECIFIED = 0;
  // Its conversation has not started.
  OBJECTIVE_ATTENTION_KIND_NOT_STARTED = 1;
  // An operator paused it.
  OBJECTIVE_ATTENTION_KIND_PAUSED = 2;
  // An operator cancelled it.
  OBJECTIVE_ATTENTION_KIND_CANCELLED = 3;
  // It is blocked.
  OBJECTIVE_ATTENTION_KIND_BLOCKED = 4;
  // The owner submitted it for review.
  OBJECTIVE_ATTENTION_KIND_REVIEW = 5;
  // The owner asked a question and waits on the answer.
  OBJECTIVE_ATTENTION_KIND_OWNER_QUESTION = 6;
  // Spend crossed a budget warning threshold.
  OBJECTIVE_ATTENTION_KIND_BUDGET_THRESHOLD = 7;
  // The budget is used up.
  OBJECTIVE_ATTENTION_KIND_BUDGET_EXHAUSTED = 8;
  // Some executed Task Attempts reported no cost, so reported spend may be
  // low.
  OBJECTIVE_ATTENTION_KIND_BUDGET_COVERAGE_INCOMPLETE = 9;
  // The deadline is near.
  OBJECTIVE_ATTENTION_KIND_DEADLINE_APPROACHING = 10;
  // The deadline passed.
  OBJECTIVE_ATTENTION_KIND_DEADLINE_PASSED = 11;
  // Approval requests wait for a decision.
  OBJECTIVE_ATTENTION_KIND_APPROVALS_PENDING = 12;
}

// One thing about an Objective that needs a look, with the next step.
message ObjectiveAttention {
  // What it is.
  ObjectiveAttentionKind kind = 1;
  // What is the matter, in one or two sentences.
  string message = 2;
  // What to do about it, usually naming a `supertag` command.
  string next_action = 3;
  // When it was observed. Unset when the Control Plane recorded no time.
  google.protobuf.Timestamp observed_at = 4;
}

// How many approval requests an Objective has, by state.
message ApprovalCounts {
  // Waiting for a decision.
  int32 pending = 1;
  // Approved in the last 24 hours.
  int32 approved_last_day = 2;
  // Denied in the last 24 hours.
  int32 denied_last_day = 3;
}

// The Team an Objective's owner may hand work to.
message ObjectiveTeam {
  // The Team's ID.
  string id = 1;
  // The Team's name.
  string name = 2;
  // The IDs of its member Tags.
  repeated string member_tag_ids = 3;
  // At most this many turns run at once across the Team's Objectives. Unset:
  // only Worker Host capacity limits them.
  optional int32 max_concurrency = 4;
}

// An Objective's deadline and budget.
message ObjectiveLimits {
  // The deadline. Unset without one.
  DeadlineLimit deadline = 1;
  // The budget. Unset without one.
  BudgetLimit budget = 2;
}

// Where an Objective stands against its deadline.
message DeadlineLimit {
  // The deadline.
  google.protobuf.Timestamp at = 1;
  // Whole minutes until it; 0 once it passed.
  int32 minutes_remaining = 2;
  // The time left in words, such as `about 3 hours left`, or `passed`.
  string remaining = 3;
  // Whether it passed.
  bool passed = 4;
  // How long running Task Attempts keep their authority after it, in
  // minutes.
  int32 grace_minutes = 5;
  // The notices already raised for this deadline, newest last.
  repeated LimitNotice notices = 6;
  // What happens at the deadline, in a few sentences.
  string guidance = 7;
}

// A notice the Control Plane raised about a limit.
message LimitNotice {
  // What it is about, such as `objective_deadline_approaching` or
  // `deadline_passed`. Clients show `message` and do not parse it.
  string kind = 1;
  // When it was raised.
  google.protobuf.Timestamp at = 2;
  // The notice, as the owner received it.
  string message = 3;
}

// How an Objective's budget is measured.
enum BudgetMeasure {
  BUDGET_MEASURE_UNSPECIFIED = 0;
  // Provider-reported cost in the budget's currency counts against it.
  BUDGET_MEASURE_PROVIDER_REPORTED_COST = 1;
  // The budget names no currency, so provider-reported cost cannot be
  // counted against it.
  BUDGET_MEASURE_UNMEASURED = 2;
}

// Where an Objective stands against its budget.
message BudgetLimit {
  // How the budget is measured.
  BudgetMeasure measure = 1;
  // The limit and its currency. `currency` is empty when `measure` is
  // `BUDGET_MEASURE_UNMEASURED`.
  Budget limit = 2;
  // Provider-reported spend, in minor units of the currency. Unset when
  // nothing was observed yet or the budget is unmeasured.
  optional int64 reported_spent_minor = 3;
  // How far reported spend is over the limit; 0 when it is not.
  int64 overrun_minor = 4;
  // When spend was last observed. Unset when it never was.
  google.protobuf.Timestamp reported_spend_observed_at = 5;
  // Executed Task Attempts that reported no cost.
  int32 unknown_cost_attempts = 6;
  // Whether the budget is used up, so new turns are refused.
  bool exhausted = 7;
  // How the budget is enforced, in a few sentences.
  string guidance = 8;
}

// Spend against an Objective's budget, and the usage behind it.
message ObjectiveBudgetUse {
  // The budget's ISO 4217 code. Empty for a budget in allocation units and
  // for an Objective without a budget.
  string currency = 1;
  // The budget limit. Unset without a budget.
  optional int64 limit_minor = 2;
  // Provider-reported spend counted against the budget, in minor units of
  // `currency`. Unset when `currency` is empty: spend is not counted in
  // allocation units.
  optional int64 spent_minor = 3;
  // What is left: `limit_minor` minus `spent_minor`, negative once over.
  // Unset when either is unset.
  optional int64 available_minor = 4;
  // Executed Task Attempts of every Task of the Objective's Sessions.
  int32 attempts = 5;
  // Their provider-reported cost by ISO 4217 code, in minor units. Separate
  // currencies are never combined. Empty when no Task Attempt reported cost.
  map<string, int64> reported_cost_by_currency = 6;
  // Task Attempts that reported no cost.
  int32 unknown_cost_attempts = 7;
  // Task Attempts whose cost comes from a model price estimate.
  int32 estimated_cost_attempts = 8;
  // Task Attempts that reported tokens for a model the Harness has no price
  // for, by model. The budget cannot count them.
  map<string, int32> unpriced_models = 9;
  // Tokens those Task Attempts reported.
  int64 unpriced_tokens = 10;
  // Tokens every Task Attempt reported. Unset when none reported tokens.
  optional int64 reported_tokens = 11;
  // Task Attempts that reported no tokens.
  int32 unknown_token_attempts = 12;
}

// Who wrote an entry in an Objective's conversation.
enum ObjectiveConversationAuthor {
  OBJECTIVE_CONVERSATION_AUTHOR_UNSPECIFIED = 0;
  // An operator's message.
  OBJECTIVE_CONVERSATION_AUTHOR_OPERATOR = 1;
  // A turn SuperTag delivered: the Objective's start, a limit notice, an
  // approval decision, a work Session's report, or a resume summary.
  OBJECTIVE_CONVERSATION_AUTHOR_SUPERTAG = 2;
  // The owner Tag's reply.
  OBJECTIVE_CONVERSATION_AUTHOR_OWNER = 3;
}

// One entry of an Objective's own conversation.
message ObjectiveConversationEntry {
  // The Task of the turn.
  string task_id = 1;
  // Who wrote it.
  ObjectiveConversationAuthor author = 2;
  // The operator who wrote it, when `author` is
  // `OBJECTIVE_CONVERSATION_AUTHOR_OPERATOR`.
  string operator_id = 3;
  // The text. An owner's reply is untrusted text.
  string text = 4;
  // When it was written.
  google.protobuf.Timestamp created_at = 5;
}

// How one of an Objective's Sessions is doing, by its latest Task.
enum ObjectiveSessionStatus {
  OBJECTIVE_SESSION_STATUS_UNSPECIFIED = 0;
  // It has no Task yet.
  OBJECTIVE_SESSION_STATUS_QUEUED = 1;
  // Its latest Task waits to run.
  OBJECTIVE_SESSION_STATUS_PENDING = 2;
  // Its latest Task runs.
  OBJECTIVE_SESSION_STATUS_RUNNING = 3;
  // Its latest Task completed waiting on a person: on the answer to
  // `question` when set, otherwise on a decision on its approval requests.
  OBJECTIVE_SESSION_STATUS_WAITING = 4;
  // Its latest Task completed.
  OBJECTIVE_SESSION_STATUS_COMPLETED = 5;
  // Its latest Task failed.
  OBJECTIVE_SESSION_STATUS_FAILED = 6;
  // Its latest Task was cancelled.
  OBJECTIVE_SESSION_STATUS_CANCELLED = 7;
}

// One Session of an Objective: its own conversation, where the owner works,
// or a work Session started under it.
message ObjectiveSession {
  // The Session's ID.
  string id = 1;
  // The ID of the Tag running it.
  string tag_id = 2;
  // The name of the Tag running it. Empty when the Tag no longer exists.
  string tag = 3;
  // Whether it is the Objective's own conversation.
  bool owner = 4;
  // The title the Tag gave the work. Empty for the Objective's own
  // conversation.
  string title = 5;
  // The Session that started this work Session. Empty for the Objective's
  // own conversation.
  string parent_session_id = 6;
  // How it is doing.
  ObjectiveSessionStatus status = 7;
  // What its latest Task asked, while it waits on the answer.
  string question = 8;
  // The approval requests its latest Task waits on.
  repeated string approval_request_ids = 9;
  // How many Tasks it has.
  int32 task_count = 10;
  // When it was created.
  google.protobuf.Timestamp created_at = 11;
  // Its latest Task. Unset while it has none.
  ObjectiveSessionTask latest_task = 12;
}

// A Session's latest Task, with what it delivered and reported.
message ObjectiveSessionTask {
  // The Task's ID.
  string id = 1;
  // How it is doing. `OBJECTIVE_SESSION_STATUS_WAITING` when it completed
  // asking a question or waiting on approval requests; never
  // `OBJECTIVE_SESSION_STATUS_QUEUED`.
  ObjectiveSessionStatus status = 2;
  // When it was created.
  google.protobuf.Timestamp created_at = 3;
  // When it last changed.
  google.protobuf.Timestamp updated_at = 4;
  // What it asked, while it waits on the answer.
  string question = 5;
  // The Workspace it works in. Empty without one.
  string workspace = 6;
  // What it delivered. Unset until the Worker recorded a delivery, and for a
  // Task without one.
  TaskDelivery delivery = 7;
  // The status of its latest Task Attempt. Unspecified before one started.
  TaskAttemptStatus attempt_status = 8;
  // Its report: the result text it ended with, cut to 400 characters. The
  // Tag wrote it, so it is untrusted text. Empty until it ended with one.
  string report = 9;
  // Why it is held while open, or how it failed.
  repeated TaskExplanation explanations = 10;
}

// What a Task explanation is about.
enum TaskExplanationKind {
  TASK_EXPLANATION_KIND_UNSPECIFIED = 0;
  // The Objective is paused; the Task starts once it resumes.
  TASK_EXPLANATION_KIND_OBJECTIVE_PAUSED = 1;
  // The Control Plane does not execute Objectives now.
  TASK_EXPLANATION_KIND_CONTROLLER = 2;
  // No connected Worker can meet the Task's requirements.
  TASK_EXPLANATION_KIND_WORKER_REQUIREMENTS = 3;
  // The Task's Task Attempt may have executed and will not be replayed.
  TASK_EXPLANATION_KIND_ATTEMPT_UNCERTAIN = 4;
  // The Task failed.
  TASK_EXPLANATION_KIND_EXECUTION_FAILED = 5;
}

// Why a Task is held, or how it failed, from its stored records.
message TaskExplanation {
  // What it is about.
  TaskExplanationKind kind = 1;
  // The explanation, in one or two sentences.
  string message = 2;
  // What to do about it, usually naming a `supertag` command.
  string next_action = 3;
  // When the record behind it was written. Unset when none was.
  google.protobuf.Timestamp observed_at = 4;
  // The Harness that ran the failed Task Attempt, with
  // `TASK_EXPLANATION_KIND_EXECUTION_FAILED`.
  string harness = 5;
  // How the Task failed, such as `harness_sign_in`, with
  // `TASK_EXPLANATION_KIND_EXECUTION_FAILED`, when the Worker classified it.
  string failure_kind = 6;
}

// A high-severity finding in a Session's latest result.
message HighFinding {
  // The Task whose result carries it.
  string task_id = 1;
  // The finding's ID within that result.
  string id = 2;
  // What was found. The Tag wrote it, so it is untrusted text.
  string summary = 3;
  // Where, such as a file and line, when the Tag said.
  string location = 4;
}

// What an Objective's Task Attempts wrote to one Volume.
message VolumeWrites {
  // The Volume's name.
  string volume = 1;
  // Files written.
  int64 files = 2;
  // Bytes written.
  int64 bytes = 3;
  // Task Attempts whose writes were cut short.
  int32 partial = 4;
  // Task Attempts whose writes the Worker Host refused.
  int32 refused = 5;
}

// One Task of an Objective's Sessions.
message ObjectiveTask {
  // The Task's ID.
  string id = 1;
  // Its Session's ID.
  string session_id = 2;
  // The ID of the Tag that ran it.
  string tag_id = 3;
  // How it is doing.
  TaskStatus status = 4;
  // The turn's input, cut to 400 characters.
  string request = 5;
  // The turn's result text, cut to 400 characters. Untrusted text.
  string response = 6;
  // When it was created.
  google.protobuf.Timestamp created_at = 7;
  // When it started running. Unset until it did.
  google.protobuf.Timestamp started_at = 8;
  // When it ended. Unset while it is open.
  google.protobuf.Timestamp ended_at = 9;
  // Its Task Attempts, oldest first.
  repeated ObjectiveTaskAttempt attempts = 10;
}

// One Task Attempt of an Objective's Task.
message ObjectiveTaskAttempt {
  // The Task Attempt's ID.
  string id = 1;
  // Its number within the Task, from 1.
  int32 number = 2;
  // How it is doing.
  TaskAttemptStatus status = 3;
  // When it started.
  google.protobuf.Timestamp started_at = 4;
  // When it ended. Unset while it runs.
  google.protobuf.Timestamp ended_at = 5;
  // The Worker Profile it ran with.
  string worker_profile = 6;
}
