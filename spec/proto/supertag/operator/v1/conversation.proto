syntax = "proto3";
package supertag.operator.v1;

import "google/protobuf/timestamp.proto";
import "supertag/operator/v1/common.proto";
import "supertag/operator/v1/options.proto";

option go_package = "github.com/atemaguer/supertag/packages/operator-api/go/operatorv1;operatorv1";

// An operator's CLI conversations with Tags: `supertag message tag`, the
// terminal UI, and the desktop app.
//
// A conversation is one Session between the caller and a Tag, named by the
// caller. The same name continues the same Session, so the Tag sees the
// earlier messages and replies. A conversation is private: the admin token is
// one operator and each Operator Token is another, and each one reads only its
// own conversations. Another operator's message fails with `NotFound`, exactly
// as a message that does not exist.
//
// A message is one turn of the conversation, named by the ID of the Task it
// started. The Tag answers with its Roles' permissions only; no location's
// Permission or Context Sets apply. A turn may hand work to work Sessions.
// Each one reports its result back into the conversation as a later turn, and
// the message that started it carries that report.
service ConversationService {
  // Sends one message to the Tag as the caller and returns it before the Tag
  // answers, usually with `status` `REPLY_STATUS_WAITING`. Follow the reply
  // with `FollowMessage`.
  //
  // A message sent while an earlier turn of the conversation still runs is
  // delivered into that turn: `joined_task_id` then names it, once the
  // Control Plane delivered it, and that turn's reply answers this message
  // too.
  //
  // It fails with `InvalidArgument` for empty text or a malformed
  // conversation name, `NotFound` for a Tag that does not exist,
  // `Unavailable` with `ERROR_REASON_DRAINING` while the Control Plane drains,
  // and `FailedPrecondition` with `ERROR_REASON_CONFLICT` when the Tag does
  // not accept the message, with the message saying why.
  rpc SendMessage(SendMessageRequest) returns (Message) {
    option (supertag.operator.v1.action) = "message_tag";
    option (supertag.operator.v1.audit_action) = "tag.message";
  }

  // Reads one message: its reply once the Tag answered, and each work Session
  // its turn started with that work Session's report. It fails with `NotFound`
  // when the Tag does not exist or `task_id` is not a message the caller can
  // read.
  rpc GetMessage(GetMessageRequest) returns (Message) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (supertag.operator.v1.action) = "read_conversation";
  }

  // Follows one message until there is nothing more to show: the turn's reply
  // as the Tag writes it, then the work Sessions the turn started until each
  // one has reported. One call replaces rereading the message. It fails as
  // `GetMessage` does.
  //
  // The stream has two phases and ends with `end`:
  //
  // 1. The turn. `joined` first, when the message was delivered into a
  //    running turn. `waiting` while no bound Worker Host can run the turn.
  //    `text_delta` and `activity` while it runs. Then exactly one of
  //    `finish`, with the reply, or `error`, when the turn ended in an error.
  // 2. The work. After `finish`, `activity` events with `work_session_id`
  //    carry each work Session's commands and tool calls, and a
  //    `work_session_changed` follows each change to a work Session. Work
  //    Sessions appear only in this phase: those the turn started are listed
  //    in `finish.message`.
  //
  // `end` comes once every work Session is settled: its report arrived, and
  // it does not wait only on an approval decision. A decision on an approval
  // request continues the work Session as its next Task, so the stream stays
  // open through it and shows that Task's work and report. A work Session
  // that asked the person a question is settled; the answer is the caller's
  // next message. A message without work Sessions ends right after `finish`.
  // After `error` the stream sends `end` and follows no work. The server then
  // closes the stream.
  //
  // How the stream starts depends on the message:
  //
  // - A running turn: the text and activity the turn wrote so far, then the
  //   rest as it is written.
  // - A turn that has not started: nothing until it starts, apart from
  //   `waiting` and heartbeats.
  // - A message that joined a running turn: `joined`, then that turn's text
  //   and activity from the moment of the call, since its earlier text
  //   answered earlier messages, then that turn's `finish` or `error`. When
  //   that turn ends without having read the message, the delivery is
  //   withdrawn: `joined` with an empty `task_id` follows, then the message's
  //   own turn from its start.
  // - A finished turn: `finish` or `error` with the stored reply at once,
  //   without text or activity, then the work phase.
  //
  // Every event except `heartbeat` carries a `sequence`. Sequences increase
  // within the stream, and each is greater than `after_sequence`. To resume a
  // dropped stream, call again with the last sequence received:
  //
  // - While the server still holds the events after it, the new stream
  //   continues exactly, repeating and skipping nothing.
  // - When it does not, because the Control Plane restarted or forgot a
  //   finished turn's live text, the new stream starts from the current
  //   state. It skips text and activity it no longer holds and never repeats
  //   them. It sends `joined`, `waiting`, `finish` or `error`, and a
  //   `work_session_changed` for each work Session again where they describe
  //   the current state.
  //
  // So a client applies `joined`, `waiting`, `finish`, `error` and
  // `work_session_changed` as state, not as counts: it shows a reply once per
  // message and a work Session line when a snapshot differs from the one it
  // holds. `finish.reply` is the whole reply; it replaces any text deltas.
  //
  // The stream stays open until `end`, until the client cancels the call, or
  // until the Control Plane drains, which ends it with `Unavailable`. The
  // server sets no deadline; a client that stops following earlier cancels
  // the call, and the Tag keeps working. A client that wants to stop once
  // each work Session has reported, including one waiting on approval, as
  // `supertag message tag --output json` does, cancels when every work
  // Session it holds has `report_status` `REPLY_STATUS_REPLIED`.
  rpc FollowMessage(FollowMessageRequest) returns (stream FollowEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (supertag.operator.v1.action) = "read_conversation";
  }

  // Lists the caller's conversations, the most recent message first. It fails
  // with `NotFound` when `tag` names a Tag that does not exist.
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (supertag.operator.v1.action) = "read_conversation";
  }

  // Lists the messages the caller sent in one conversation, newest first, each
  // as `GetMessage` returns it. A conversation the caller never wrote in has
  // no messages. It fails with `NotFound` when the Tag does not exist.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (supertag.operator.v1.action) = "read_conversation";
  }
}

message SendMessageRequest {
  // The Tag's name.
  string tag = 1;
  // The conversation's name: 1 to 64 letters, digits, `.`, `_` or `-`,
  // starting with a letter or digit. Empty means `default`.
  string conversation = 2;
  // The message. Leading and trailing whitespace is removed, and what remains
  // must not be empty.
  string text = 3;
  // Makes a retry safe. A repeat with the same key from the same caller to the
  // same Tag returns the message the first call created and sends nothing,
  // whatever its text or conversation. A key is 1 to 200 characters without
  // whitespace or control characters. Empty sends every call.
  string idempotency_key = 4;
}

message GetMessageRequest {
  // The Tag's name.
  string tag = 1;
  // The message's Task ID, as `Message.task_id`.
  string task_id = 2;
}

message FollowMessageRequest {
  // The Tag's name.
  string tag = 1;
  // The message's Task ID, as `Message.task_id`.
  string task_id = 2;
  // The last `FollowEvent.sequence` the client received, to resume a dropped
  // stream. 0 starts from the beginning.
  int64 after_sequence = 3;
}

message ListConversationsRequest {
  // Lists only conversations with this Tag, by name. Empty lists every Tag's.
  string tag = 1;
  // At most this many conversations; 0 means 50, and more than 100 means 100.
  int32 page_size = 2;
  // The `next_page_token` of the previous page.
  string page_token = 3;
}

message ListConversationsResponse {
  // The caller's conversations, the one with the most recent message first.
  repeated Conversation conversations = 1;
  // Fetches the next page. Empty on the last page.
  string next_page_token = 2;
}

message ListMessagesRequest {
  // The Tag's name.
  string tag = 1;
  // The conversation's name. Empty means `default`.
  string conversation = 2;
  // At most this many messages; 0 means 50, and more than 100 means 100.
  int32 page_size = 3;
  // The `next_page_token` of the previous page.
  string page_token = 4;
}

message ListMessagesResponse {
  // The messages, newest first.
  repeated Message messages = 1;
  // Fetches the next page. Empty on the last page.
  string next_page_token = 2;
}

// One of the caller's conversations with a Tag.
message Conversation {
  // The Tag's name.
  string tag = 1;
  // The conversation's name, such as `default`.
  string name = 2;
  // The conversation's Session.
  string session_id = 3;
  // The start of the conversation's most recent entry, at most 200
  // characters: the caller's latest message, the Tag's reply to it, or a work
  // Session's report, whichever came last.
  string last_message_text = 4;
  // Who wrote `last_message_text`.
  ConversationAuthor last_message_author = 5;
  // When the most recent entry was written.
  google.protobuf.Timestamp last_message_at = 6;
  // How many work Sessions the conversation's turns started are not finished:
  // their status is `WORK_SESSION_STATUS_PENDING`,
  // `WORK_SESSION_STATUS_RUNNING` or `WORK_SESSION_STATUS_WAITING`.
  int32 open_work_session_count = 7;
}

// Who wrote an entry in a conversation.
enum ConversationAuthor {
  CONVERSATION_AUTHOR_UNSPECIFIED = 0;
  // The caller.
  CONVERSATION_AUTHOR_OPERATOR = 1;
  // The Tag: a reply or a work Session's report.
  CONVERSATION_AUTHOR_TAG = 2;
}

// One message in a conversation and what answered it.
//
// A message is one the caller sent, or a turn of an Objective whose home
// thread is one of the caller's conversations. A turn of an Objective without
// a home thread is readable by every operator. A work Session's own Task is not
// a message: the message that started it carries it in `work_sessions`.
message Message {
  // The ID of the Task the message started. It names the message.
  string task_id = 1;
  // The Tag's name.
  string tag = 2;
  // The conversation's name. For an Objective turn without a home thread, it
  // is `objective:` and the Objective's ID.
  string conversation = 3;
  // The conversation's Session.
  string session_id = 4;
  // What the message said: the caller's text, or the text an Objective turn
  // delivered.
  string text = 5;
  // When the message was sent.
  google.protobuf.Timestamp created_at = 6;
  // Whether the Tag has replied.
  ReplyStatus status = 7;
  // Why the turn has not started, in one line, while no bound Worker Host can
  // run it, such as `no bound Worker Host provides MCP server notes`. Empty
  // once the turn can be placed or after the reply.
  string waiting_reason = 8;
  // The Tag's final reply: the turn's result, or the error that ended it.
  // Set when `status` is `REPLY_STATUS_REPLIED`.
  Reply reply = 9;
  // The running turn this message was delivered into, when it joined one
  // instead of starting its own. That turn's reply is `reply`. It goes back
  // to empty when that turn ends without reading the message, which then
  // runs as its own turn.
  string joined_task_id = 10;
  // The work Sessions this message's turn started or continued, oldest first.
  repeated WorkSession work_sessions = 11;
}

// Whether a reply or a report has been written.
enum ReplyStatus {
  REPLY_STATUS_UNSPECIFIED = 0;
  // Not yet.
  REPLY_STATUS_WAITING = 1;
  // It has; the reply or report is set.
  REPLY_STATUS_REPLIED = 2;
}

// A reply the Tag wrote: its answer to a message, or a work Session's report.
message Reply {
  // What kind of reply it is.
  ReplyPresentation presentation = 1;
  // The text, as the Tag wrote it.
  string text = 2;
}

// What kind of reply the Tag wrote.
enum ReplyPresentation {
  REPLY_PRESENTATION_UNSPECIFIED = 0;
  // The turn's result.
  REPLY_PRESENTATION_FINAL_RESULT = 1;
  // The error that ended the turn, such as a failed Task.
  REPLY_PRESENTATION_ERROR = 2;
  // A progress update.
  REPLY_PRESENTATION_STATUS = 3;
  // An acknowledgement that the turn started.
  REPLY_PRESENTATION_ACKNOWLEDGEMENT = 4;
}

// A work Session a message's turn started: its latest Task and its report.
message WorkSession {
  // The work Session's ID.
  string id = 1;
  // The title the Tag gave the work.
  string title = 2;
  // The work Session's latest Task. Empty until it has one. A decision on an
  // approval request continues the work Session as a new Task, which this
  // then names.
  string task_id = 3;
  // How the latest Task is doing.
  WorkSessionStatus status = 4;
  // What the Task asked the person, when it completed by asking. The answer
  // is the caller's next message in the conversation.
  string question = 5;
  // A notice for each of the Task's pending approval requests, as the Tag
  // posted it to the conversation. Decide one with `supertag approve request`
  // or `supertag deny request`; the decision continues the work Session.
  repeated ApprovalNotice approvals = 6;
  // Why a decision on a request the Task waited on did not continue the work
  // Session, such as the Tag's permissions changing or the turn's limits
  // being spent. `status` is then the Task's own.
  string not_continued = 7;
  // Whether the report on the latest Task has been written.
  ReplyStatus report_status = 8;
  // The conversation turn that reports the work Session's result.
  string report_task_id = 9;
  // The report. Set when `report_status` is `REPLY_STATUS_REPLIED`.
  Reply report = 10;
}

// How a work Session's latest Task is doing.
enum WorkSessionStatus {
  WORK_SESSION_STATUS_UNSPECIFIED = 0;
  // It has no Task yet, or its Task waits to run.
  WORK_SESSION_STATUS_PENDING = 1;
  // Its Task runs.
  WORK_SESSION_STATUS_RUNNING = 2;
  // Its Task completed.
  WORK_SESSION_STATUS_COMPLETED = 3;
  // Its Task failed.
  WORK_SESSION_STATUS_FAILED = 4;
  // Its Task was cancelled.
  WORK_SESSION_STATUS_CANCELLED = 5;
  // Its Task completed waiting on the person: on the answer to `question`
  // when set, otherwise on a decision on its `approvals`.
  WORK_SESSION_STATUS_WAITING = 6;
}

// The notice the Tag posted for one pending approval request.
message ApprovalNotice {
  // The approval request's ID.
  string request_id = 1;
  // The notice.
  string text = 2;
}

// One event while following a message. See `FollowMessage` for the order.
message FollowEvent {
  // Orders the stream's events and resumes it as `after_sequence`. 0 only on
  // `heartbeat`, which is never resumed from.
  int64 sequence = 1;
  oneof part {
    // The message was delivered into a running turn, which answers it, or,
    // with an empty `task_id`, that delivery was withdrawn.
    JoinedTurn joined = 2;
    // Why the turn has not started. Sent when the reason changes.
    PlacementWait waiting = 3;
    // Reply text as the Tag writes it.
    TextDelta text_delta = 4;
    // A command, tool call or retry of the turn or of a work Session.
    Activity activity = 5;
    // The turn ended with its reply.
    Finish finish = 6;
    // The turn ended with an error instead of a reply.
    TurnError error = 7;
    // A work Session the turn started changed.
    WorkSessionChanged work_session_changed = 8;
    // Nothing more will follow. The last event of the stream.
    FollowEnd end = 9;
    // Keeps an idle stream open.
    Heartbeat heartbeat = 10;
  }
}

// The running turn a message was delivered into.
message JoinedTurn {
  // That turn's Task, as `Message.joined_task_id`. Empty when the delivery
  // was withdrawn because that turn never read the message, which then runs
  // as its own turn.
  string task_id = 1;
}

// Why a turn has not started.
message PlacementWait {
  // One line, as `Message.waiting_reason`.
  string reason = 1;
}

// Reply text as the Tag's harness writes it. It includes what the Tag says
// between tool calls, and text from a Task Attempt a retry replaced; `finish`
// carries the reply itself. An `activity` between two deltas ends a block of
// text. The server may skip text of a very long turn.
message TextDelta {
  // The text to append.
  string text = 1;
}

// A command or tool call starting or ending, or a retry of the Task in a new
// Task Attempt.
message Activity {
  // The work Session the activity belongs to. Empty for the message's own
  // turn.
  string work_session_id = 1;
  // One line for a start or a retry, as `supertag message tag` shows it
  // without its leading dot: `running: COMMAND`, `using: TOOL`, or
  // `retrying (Task Attempt N)`. Empty when a command or tool call ends. A
  // client shows it when it does not recognize `detail`.
  string text = 2;
  oneof detail {
    CommandActivity command = 3;
    ToolActivity tool = 4;
    RetryActivity retry = 5;
  }
}

// A command the Tag runs.
message CommandActivity {
  // Pairs the command's start with its end.
  string id = 1;
  // The command line. The Tag wrote it, so it is untrusted: the Worker removes
  // control characters and cuts it to 200 characters.
  string command = 2;
  ActivityStatus status = 3;
}

// A tool the Tag calls.
message ToolActivity {
  // Pairs the call's start with its end.
  string id = 1;
  // The tool as `PROVIDER.OPERATION`, such as `github.create_pull_request`.
  string tool = 2;
  ActivityStatus status = 3;
}

// A new Task Attempt continues the Task after the previous one ended without
// a result. Text before it is not part of the reply.
message RetryActivity {
  // The new Task Attempt's number, from 1.
  int32 attempt = 1;
}

// Whether a command or tool call runs or has ended.
enum ActivityStatus {
  ACTIVITY_STATUS_UNSPECIFIED = 0;
  // It started.
  ACTIVITY_STATUS_RUNNING = 1;
  // It ended successfully.
  ACTIVITY_STATUS_COMPLETED = 2;
  // It ended with a failure.
  ACTIVITY_STATUS_FAILED = 3;
}

// The turn's reply.
message Finish {
  // The reply. Its presentation is never `REPLY_PRESENTATION_ERROR`; such a
  // reply is a `TurnError` instead.
  Reply reply = 1;
  // The message as `GetMessage` returns it now, with the work Sessions the
  // turn started.
  Message message = 2;
}

// The error that ended the turn: its Task failed, or the Control Plane could
// not tell whether a delivery into a running turn reached it.
message TurnError {
  // The error, as the message's `reply.text`.
  string text = 1;
}

// A work Session's current state, after any change to it.
message WorkSessionChanged {
  // The whole work Session. It replaces the one the client holds with the
  // same `id`.
  WorkSession work_session = 1;
}

// The end of the stream.
message FollowEnd {
  // The message as `GetMessage` returns it now.
  Message message = 1;
}
