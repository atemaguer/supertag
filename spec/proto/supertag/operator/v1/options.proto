syntax = "proto3";
package supertag.operator.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/atemaguer/supertag/packages/operator-api/go/operatorv1;operatorv1";

// Who may call an operator RPC, and what the audit trail records. The Control
// Plane reads these options and checks every call in one place before the
// RPC runs. It refuses to start when an RPC lacks an option it requires.
extend google.protobuf.MethodOptions {
  // The operator action the caller's credential must carry, such as `status`.
  // The admin token and Operator Tokens carry every action. Every RPC
  // declares one.
  string action = 50001;
  // Accept a call without a credential. A call that carries a credential is
  // still authenticated and must carry `action`.
  bool allow_anonymous = 50002;
  // Accept only the Control Plane admin token. An Operator Token is refused
  // with `PermissionDenied`, whatever actions it carries. Managing Operator
  // Tokens needs this.
  bool requires_admin_token = 50003;
  // The audit action recorded for each authenticated call, such as
  // `objective.cancel`. Every RPC that can change state declares one; an RPC
  // that reads only sets `idempotency_level = NO_SIDE_EFFECTS` instead.
  string audit_action = 50004;
  // Accept a scoped coordination credential, one the Control Plane reads from
  // `SUPERTAG_COORDINATION_OPERATORS_FILE`. It must carry `action` among its
  // actions, and it reaches only the Objectives its scope names: the RPC
  // refuses any other with `PermissionDenied`. Without this option such a
  // credential is refused with `PermissionDenied`, whatever actions it
  // carries.
  bool allow_scoped_credential = 50005;
  // Take an Auth Key as the bearer token in place of an operator credential.
  // A call without a bearer token, or with one that is not an Auth Key the
  // Control Plane knows, fails with `Unauthenticated` before its body is
  // read. The RPC redeems the key, so it checks then whether the key was
  // revoked, has expired or was used.
  bool requires_auth_key = 50011;
  // Also accept a Worker Host's own credential, sent as the bearer token with
  // the host's ID in the `x-supertag-worker-host-id` header. It carries no
  // operator actions: this option alone admits it, and the RPC acts only on
  // that Worker Host and refuses any other with `PermissionDenied`.
  bool allow_worker_host_credential = 50012;
}

// Manifests. A manifest is the YAML or JSON document `supertag apply -f`
// reads: `apiVersion: supertag/v1`, `kind`, `metadata.name` and `spec`.
// The resource messages of `ResourceService` define each kind's `spec`, and
// the JSON Schemas under `spec/manifests/` are generated from them with the
// options below.
//
// A message's manifest form is its proto3 JSON form, with these exceptions:
//
// - A field marked `output_only` is left out. The Control Plane sets it.
// - An enum value is written as its `manifest_value`, such as `branch`. A
//   value without one, such as `_UNSPECIFIED`, is not valid in a manifest.
// - A 64-bit integer is written as a JSON number.
// - A `google.protobuf.Timestamp` is an RFC 3339 string, as in proto3 JSON.
// - A oneof marked with `ManifestOneof.field` is one field of that name whose
//   value is its set member's manifest form.
// - A oneof marked with `ManifestOneof.discriminator` is written inline: the
//   set member's fields sit beside the message's other fields and a field
//   named by `discriminator` whose value is the member's JSON name.
//
// Every manifest object rejects fields it does not define, except a
// `google.protobuf.Struct`, which holds any object.
extend google.protobuf.MessageOptions {
  // Makes this message the `spec` of a manifest kind.
  ManifestKind manifest = 50006;
  // Rules a manifest's fields must satisfy together, beyond the rules of
  // each field.
  repeated ManifestRequirement manifest_requirements = 50007;
}

extend google.protobuf.FieldOptions {
  // How the field is written and checked in manifests.
  ManifestField manifest_field = 50008;
}

extend google.protobuf.OneofOptions {
  // How the oneof is written and checked in manifests.
  ManifestOneof manifest_oneof = 50009;
}

extend google.protobuf.EnumValueOptions {
  // The value's spelling in manifests, such as `read-only`.
  string manifest_value = 50010;
}

// One manifest kind.
message ManifestKind {
  // The kind, such as `Tag`, as `kind` names it.
  string kind = 1;
  // The rules for `metadata.name`. It is always a required string.
  ManifestField name = 2;
  // A manifest may leave out `spec`, which then takes every default.
  bool spec_optional = 3;
}

// How one field is written and checked in manifests. For a repeated field,
// the string and number rules apply to each item and the item rules to the
// list.
message ManifestField {
  // The field must be present.
  bool required = 1;
  // The Control Plane sets the field. It is not part of the manifest form,
  // and a manifest that sets it is invalid.
  bool output_only = 2;
  // A string must match this regular expression.
  string pattern = 3;
  // A string's least length, in characters.
  optional uint32 min_length = 4;
  // A string's greatest length, in characters.
  optional uint32 max_length = 5;
  // A number's least value.
  optional int64 minimum = 6;
  // A number's greatest value.
  optional int64 maximum = 7;
  // A list's least number of items.
  optional uint32 min_items = 8;
  // A list's greatest number of items.
  optional uint32 max_items = 9;
  // A repeated field also accepts one item in place of a list of one, as
  // `model: gpt-6-sol` for `model: [gpt-6-sol]`.
  bool accepts_single = 10;
}

// How one oneof is written and checked in manifests. Without this option a
// oneof's members are ordinary optional fields of which at most one is set.
message ManifestOneof {
  // Exactly one member must be set.
  bool required = 1;
  // Writes the oneof as one field with this name, whose value is the set
  // member's manifest form.
  string field = 2;
  // Writes the set member inline beside a field with this name, whose value
  // is the member's JSON name. Each member is a message.
  string discriminator = 3;
}

// A rule that makes fields required depending on another field's value.
// Paths are dotted manifest field names relative to the message, such as
// `configuration.transport`.
message ManifestRequirement {
  // The field whose value decides.
  string path = 1;
  // The value that selects `required`. Any other value, or no value,
  // selects `otherwise_required`.
  string equals = 2;
  // The fields required when `path` equals `equals`.
  repeated string required = 3;
  // The fields required otherwise.
  repeated string otherwise_required = 4;
}
