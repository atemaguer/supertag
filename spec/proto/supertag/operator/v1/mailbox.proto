syntax = "proto3";
package supertag.operator.v1;

import "google/protobuf/timestamp.proto";
import "supertag/operator/v1/options.proto";
import "supertag/operator/v1/team.proto";

option go_package = "github.com/atemaguer/supertag/packages/operator-api/go/operatorv1;operatorv1";

// What Tags say to one another, as an operator sees it: `supertag list
// message`, `grant mailbox`, `revoke mailbox`, `list mailbox-grant` and
// `list workstream-post`.
//
// A Tag's Mailbox holds plain text messages from other Tags. Each message is
// delivered as a turn of the recipient's inbox Session; messages that arrive
// while a turn runs are handled together in the next one. Tags in the same
// Team may message one another; a grant lets a recipient accept messages
// from a sender outside its Teams too. A grant is directional and gives no
// execution authority. A Tag manifest's `acceptsMessagesFrom` lists the same
// grants. Every Team also has a Workstream: the shared record of its
// members' posts, which every member reads.
//
// Operators read Mailboxes and Workstreams; only Tags write to them.
//
// Access. The admin token and Operator Tokens may call every RPC; a scoped
// coordination credential is refused with `PermissionDenied`.
//
// Every RPC that names a Tag takes its name, and fails with `InvalidArgument`
// for an empty one and `NotFound` for a Tag that does not exist or was
// deleted. A call while the Control Plane drains fails with `Unavailable` and
// `ERROR_REASON_DRAINING`.
service MailboxService {
  // Lists the messages a Tag sent or received, newest first, each with its
  // status, as `supertag list message` shows them. It fails with
  // `InvalidArgument` for a malformed `page_token`.
  rpc ListTagMessages(ListTagMessagesRequest) returns (ListTagMessagesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (supertag.operator.v1.action) = "read_mailbox";
  }

  // Lets `recipient` accept messages from `sender`, as `supertag grant
  // mailbox` does. Granting an existing grant changes nothing and succeeds
  // with `changed` false.
  rpc GrantMailbox(GrantMailboxRequest) returns (MailboxGrantChange) {
    option (supertag.operator.v1.action) = "manage_mailbox";
    option (supertag.operator.v1.audit_action) = "mailbox-grant.add";
  }

  // Removes the grant that lets `recipient` accept messages from `sender`, as
  // `supertag revoke mailbox` does. The two Tags may still message each other
  // while they share a Team. Revoking a grant that does not exist changes
  // nothing and succeeds with `changed` false.
  rpc RevokeMailbox(RevokeMailboxRequest) returns (MailboxGrantChange) {
    option (supertag.operator.v1.action) = "manage_mailbox";
    option (supertag.operator.v1.audit_action) = "mailbox-grant.revoke";
  }

  // Lists the grants in which a Tag is the sender or the recipient, by sender
  // Tag ID and then recipient Tag ID, as `supertag list mailbox-grant` shows
  // them. Team membership is not listed. It fails with `InvalidArgument` for
  // a malformed `page_token`.
  rpc ListMailboxGrants(ListMailboxGrantsRequest) returns (ListMailboxGrantsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (supertag.operator.v1.action) = "read_mailbox";
  }

  // Lists a Team's Workstream posts, as `supertag list workstream-post` shows
  // them. Without `after_sequence` and `page_token` it lists the newest
  // posts, oldest first, and `next_page_token` is empty. With
  // `after_sequence` it lists the posts after that sequence, oldest first,
  // and `next_page_token` continues after the page while more follow. To
  // follow new posts, a client calls again with the last `sequence` it
  // received, when `EventService.Watch` sends a `WATCH_KIND_WORKSTREAM_POST`
  // change for the Team.
  //
  // It fails with `InvalidArgument` for an empty `team` or a malformed
  // `page_token`, and `NotFound` for a Team that does not exist.
  rpc ListWorkstreamPosts(ListWorkstreamPostsRequest) returns (ListWorkstreamPostsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (supertag.operator.v1.action) = "read_mailbox";
  }
}

message ListTagMessagesRequest {
  // The Tag's name.
  string tag = 1;
  // At most this many messages; 0 means 50, and more than 200 means 200.
  int32 page_size = 2;
  // The `next_page_token` of the previous page, which continues toward older
  // messages.
  string page_token = 3;
}

message ListTagMessagesResponse {
  // The messages, newest first.
  repeated TagMessage messages = 1;
  // Names of the Tags the messages name, keyed by Tag ID. A deleted Tag has
  // no entry.
  map<string, string> tag_names = 2;
  // Fetches the next, older page. Empty on the last page.
  string next_page_token = 3;
}

// Where a Tag message stands.
enum TagMessageStatus {
  TAG_MESSAGE_STATUS_UNSPECIFIED = 0;
  // It waits for the recipient's inbox to take it.
  TAG_MESSAGE_STATUS_PENDING = 1;
  // The inbox turn that took it completed.
  TAG_MESSAGE_STATUS_HANDLED = 2;
  // The inbox turn that took it failed or was cancelled.
  TAG_MESSAGE_STATUS_FAILED = 3;
}

// One message from one Tag to another.
message TagMessage {
  // The message's ID.
  string id = 1;
  // The ID of the Tag that sent it.
  string sender_tag_id = 2;
  // The ID of the Tag it was sent to.
  string recipient_tag_id = 3;
  // The Objective the sending turn worked under. Empty outside one.
  string objective_id = 4;
  // The Task that sent it. Empty when no Task did.
  string source_task_id = 5;
  // The Workstream post whose addressees it delivered, when a post sent it.
  string workstream_post_id = 6;
  // The message, at most 8,000 characters. A Tag wrote it, so it is
  // untrusted text.
  string text = 7;
  // How many inbox turns the chain of messages that produced it passed
  // through, at most 4. 0 outside such a chain.
  int32 hops = 8;
  // The inbox turn that took it. Empty while it waits.
  string task_id = 9;
  // Where it stands.
  TagMessageStatus status = 10;
  // When it was sent.
  google.protobuf.Timestamp created_at = 11;
}

message GrantMailboxRequest {
  // The Tag that may send, by name.
  string sender = 1;
  // The Tag that accepts its messages, by name.
  string recipient = 2;
}

message RevokeMailboxRequest {
  // The Tag that may no longer send, by name.
  string sender = 1;
  // The Tag that no longer accepts its messages, by name.
  string recipient = 2;
}

// A Mailbox grant after `GrantMailbox` or `RevokeMailbox`.
message MailboxGrantChange {
  // The grant.
  MailboxGrant grant = 1;
  // False when the call found the grant already as asked.
  bool changed = 2;
}

// A recipient Tag accepts messages from a sender Tag, in addition to its Team
// members.
message MailboxGrant {
  // The sender's Tag ID.
  string sender_tag_id = 1;
  // The recipient's Tag ID.
  string recipient_tag_id = 2;
}

message ListMailboxGrantsRequest {
  // The Tag's name.
  string tag = 1;
  // At most this many grants; 0 means 100, and more than 500 means 500.
  int32 page_size = 2;
  // The `next_page_token` of the previous page.
  string page_token = 3;
}

message ListMailboxGrantsResponse {
  // The grants, by sender Tag ID and then recipient Tag ID.
  repeated MailboxGrant grants = 1;
  // Names of the Tags the grants name, keyed by Tag ID. A deleted Tag has no
  // entry.
  map<string, string> tag_names = 2;
  // Fetches the next page. Empty on the last page.
  string next_page_token = 3;
}

message ListWorkstreamPostsRequest {
  // The Team's name or ID.
  string team = 1;
  // Lists the posts after this `WorkstreamPost.sequence`, oldest first.
  // Unset lists the newest posts.
  optional int64 after_sequence = 2;
  // At most this many posts; 0 means 50, and more than 200 means 200.
  int32 page_size = 3;
  // The `next_page_token` of the previous page. It continues the same
  // listing, so a request with it ignores `after_sequence`.
  string page_token = 4;
}

message ListWorkstreamPostsResponse {
  // The posts, oldest first.
  repeated WorkstreamPost posts = 1;
  // Names of the Tags the posts name, keyed by Tag ID. A deleted Tag has no
  // entry.
  map<string, string> tag_names = 2;
  // Fetches the posts after this page. Empty on the last page, and without
  // `after_sequence`.
  string next_page_token = 3;
}
