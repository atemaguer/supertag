syntax = "proto3";
package supertag.operator.v1;

import "google/protobuf/timestamp.proto";
import "supertag/operator/v1/options.proto";

option go_package = "github.com/atemaguer/supertag/packages/operator-api/go/operatorv1;operatorv1";

// Teams: `supertag create team`, `list team`, `get team`, `update team` and
// `delete team`.
//
// A Team is a set of Tags. Its members may message one another and share the
// Team's Workstream, and an Objective that names the Team may hand work to
// its members. A Team stands alone: any number of Objectives may name it.
// `MailboxService.ListWorkstreamPosts` reads its Workstream.
//
// Access. The admin token and Operator Tokens may call every RPC; a scoped
// coordination credential is refused with `PermissionDenied`.
//
// Every RPC that names a Team takes its name or ID, and fails with
// `InvalidArgument` for an empty one and `NotFound` for a Team that does not
// exist. Every RPC that names Tags takes their names, and fails with
// `NotFound` for a Tag that does not exist or was deleted. A call while the
// Control Plane drains fails with `Unavailable` and `ERROR_REASON_DRAINING`.
service TeamService {
  // Creates a Team.
  //
  // Repeating the call with the same `id`, name, members and limit returns
  // the existing Team and changes nothing. It fails with `AlreadyExists` and
  // `ERROR_REASON_CONFLICT` when another Team has the ID or the name, or the
  // Team with the ID differs, and with `InvalidArgument` for a malformed ID
  // or name, no members, more than 100 members, or a `max_concurrency` out
  // of range.
  rpc CreateTeam(CreateTeamRequest) returns (Team) {
    option (supertag.operator.v1.action) = "manage_team";
    option (supertag.operator.v1.audit_action) = "team.create";
  }

  // Lists Teams by name, as `supertag list team` shows them. It fails with
  // `NotFound` when `member` names a Tag that does not exist, and
  // `InvalidArgument` for a malformed `page_token`.
  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (supertag.operator.v1.action) = "read_team";
  }

  // Reads one Team.
  rpc GetTeam(GetTeamRequest) returns (Team) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (supertag.operator.v1.action) = "read_team";
  }

  // Changes a Team's name, members or turn limit. Set at least one of them,
  // and `expected_revision` to the revision read last. New members take part
  // from their next turn; turns already running are not stopped.
  //
  // When `expected_revision` is older but the Team already has every value
  // the request sets, it changes nothing and returns the Team, so a retry of
  // an applied change succeeds.
  //
  // It fails with `InvalidArgument` for a request that sets nothing or sets
  // a malformed value, `FailedPrecondition` and `ERROR_REASON_CONFLICT` when
  // `expected_revision` is not the Team's revision and the Team differs from
  // the request, and `AlreadyExists` and `ERROR_REASON_CONFLICT` when another
  // Team has the new name.
  rpc UpdateTeam(UpdateTeamRequest) returns (Team) {
    option (supertag.operator.v1.action) = "manage_team";
    option (supertag.operator.v1.audit_action) = "team.update";
  }

  // Deletes a Team and its Workstream posts. It fails with
  // `FailedPrecondition` and `ERROR_REASON_CONFLICT` while an Objective that
  // is not completed or cancelled names the Team, and the message names it.
  rpc DeleteTeam(DeleteTeamRequest) returns (DeleteTeamResponse) {
    option (supertag.operator.v1.action) = "manage_team";
    option (supertag.operator.v1.audit_action) = "team.delete";
  }
}

message CreateTeamRequest {
  // The Team's ID: 1 to 200 characters without whitespace or control
  // characters, other than `.` and `..`. Empty uses `name`, which must then
  // be a valid ID.
  string id = 1;
  // The Team's name: 1 to 200 characters without control characters,
  // unique among Teams. Leading and trailing whitespace is removed.
  string name = 2;
  // The member Tags, by name: 1 to 100 of them. Repeated names count once.
  repeated string members = 3;
  // At most this many turns run at once across the Sessions of every open
  // Objective that names the Team; later turns wait. From 1 to 1,000. Unset:
  // only Worker Host capacity limits them.
  optional int32 max_concurrency = 4;
}

message ListTeamsRequest {
  // Lists only Teams this Tag is a member of, by name. Empty lists every
  // Team.
  string member = 1;
  // At most this many Teams; 0 means 100, and more than 500 means 500.
  int32 page_size = 2;
  // The `next_page_token` of the previous page.
  string page_token = 3;
}

message ListTeamsResponse {
  // The Teams, by name.
  repeated Team teams = 1;
  // Fetches the next page. Empty on the last page.
  string next_page_token = 2;
}

message GetTeamRequest {
  // The Team's name or ID. A name that is also another Team's ID names that
  // Team.
  string team = 1;
}

message UpdateTeamRequest {
  // The Team's name or ID.
  string team = 1;
  // The Team's `revision` as the caller read it, from 1. The update applies
  // only while it is still the Team's revision.
  int64 expected_revision = 2;
  // The new name. Unset leaves the name.
  optional string name = 3;
  // The members that replace the current ones. Unset leaves them.
  TeamMembers members = 4;
  // The new turn limit. Unset leaves the limit.
  TeamConcurrency concurrency = 5;
}

// A Team's member Tags.
message TeamMembers {
  // The Tags, by name: 1 to 100 of them. Repeated names count once.
  repeated string tags = 1;
}

// A Team's turn limit.
message TeamConcurrency {
  // At most this many turns run at once, from 1 to 1,000. 0 removes the
  // limit, so only Worker Host capacity limits them.
  int32 max_concurrency = 1;
}

message DeleteTeamRequest {
  // The Team's name or ID.
  string team = 1;
}

message DeleteTeamResponse {
  // The deleted Team's ID.
  string id = 1;
  // The deleted Team's name.
  string name = 2;
}

// One Team.
message Team {
  // The Team's ID.
  string id = 1;
  // Its name.
  string name = 2;
  // Its member Tags, by Tag ID.
  repeated TeamMember members = 3;
  // At most this many turns run at once across the Sessions of every open
  // Objective that names it. Unset: only Worker Host capacity limits them.
  optional int32 max_concurrency = 4;
  // Increases with every change, from 1. Pass it as `expected_revision`.
  int64 revision = 5;
  // When it was created.
  google.protobuf.Timestamp created_at = 6;
  // When it last changed.
  google.protobuf.Timestamp updated_at = 7;
}

// One member Tag of a Team.
message TeamMember {
  // The Tag's ID.
  string tag_id = 1;
  // The Tag's name. Empty when the Tag was deleted.
  string tag = 2;
}

// One post to a Team's Workstream, which the Team's members read.
message WorkstreamPost {
  // The post's ID.
  string id = 1;
  // The Team's ID.
  string team_id = 2;
  // The ID of the member Tag that wrote it.
  string author_tag_id = 3;
  // The IDs of the member Tags it is addressed to. Each one also receives it
  // as a Mailbox message. Every member reads the post either way.
  repeated string to_tag_ids = 4;
  // The post. The Tag wrote it, so it is untrusted text.
  string body = 5;
  // The Task that posted it, when a Task did.
  string source_task_id = 6;
  // The post's place in the Team's Workstream, from 1.
  int64 sequence = 7;
  // When it was posted.
  google.protobuf.Timestamp created_at = 8;
}
