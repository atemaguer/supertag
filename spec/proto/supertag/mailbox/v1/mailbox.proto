syntax = "proto3";
package supertag.mailbox.v1;

// Trusted custom Worker applications authenticate with a Tag mailbox credential in metadata.
// This service delegates every operation to the existing mailbox policy/state owner.
service MailboxService {
  rpc Send(SendRequest) returns (SendResponse);
  rpc History(HistoryRequest) returns (HistoryResponse);
  rpc Receive(ReceiveRequest) returns (ReceiveResponse);
  rpc Acknowledge(AcknowledgeRequest) returns (Empty);
  rpc Release(ReleaseRequest) returns (Empty);
  rpc Renew(RenewRequest) returns (Empty);
  rpc CreateObjective(CreateObjectiveRequest) returns (Objective);
  rpc GetObjective(GetObjectiveRequest) returns (Objective);
  rpc ListObjectives(ListObjectivesRequest) returns (ObjectiveList);
  rpc UpdateObjectiveStatus(UpdateObjectiveStatusRequest) returns (Objective);
  rpc GetWorkstream(GetWorkstreamRequest) returns (Workstream);
  rpc ListWorkstreams(ListWorkstreamsRequest) returns (WorkstreamList);
  rpc PostWorkstream(PostWorkstreamRequest) returns (Post);
  rpc WorkstreamPosts(WorkstreamPostsRequest) returns (PostList);
}
message Empty {}
message GetObjectiveRequest { string id = 1; }
message GetWorkstreamRequest { string id = 1; }
message ListObjectivesRequest { optional uint32 limit = 1; }
message ListWorkstreamsRequest { optional uint32 limit = 1; }
message Strings { repeated string values = 1; }
message SendRequest {
  string recipient_tag_id = 1;
  optional string recipient_team_id = 2;
  string objective_id = 3;
  reserved 4;
  string type = 5;
  // User-defined message content only, bounded JSON object; never a dispatch envelope.
  bytes body_json = 6;
  string idempotency_key = 7;
  optional string in_reply_to = 8;
}
message Message {
  SendRequest content = 1;
  string id = 2;
  string sender_tag_id = 3;
  string status = 4;
  uint32 attempt_count = 5;
  string created_at = 6;
  string updated_at = 7;
  optional string processed_at = 8;
  optional string body_pruned_at = 9;
  optional string operator_id = 10;
}
message SendResponse { Message message = 1; bool duplicate = 2; }
message Cursor { string created_at = 1; string id = 2; }
message HistoryRequest { Cursor before = 1; optional uint32 limit = 2; }
message HistoryResponse { repeated Message items = 1; Cursor next_cursor = 2; }
message ReceiveRequest { optional uint32 wait_ms = 1; optional uint32 lease_ms = 2; }
message Delivery { Message message = 1; string lease_token = 2; string lease_expires_at = 3; }
message ReceiveResponse { Delivery delivery = 1; }
message AcknowledgeRequest { string message_id = 1; string lease_token = 2; }
message ReleaseRequest { string message_id = 1; string lease_token = 2; optional bool retry = 3; }
message RenewRequest { string message_id = 1; string lease_token = 2; optional uint32 lease_ms = 3; }
message ObservationSource { string workstream_id = 1; }
message ObservationPending { string message_id = 1; map<string, double> through = 2; optional string task_id = 3; optional uint32 attempt_count = 4; }
message ObservationState { map<string, double> cursors = 1; ObservationPending pending = 2; optional string blocked = 3; optional uint32 next_source = 4; }
message CreateObjectiveRequest {
  string id = 1;
  string outcome = 2;
  reserved 3, 7;
  optional string deadline = 4;
  optional double budget_limit_minor = 5;
  optional string budget_currency = 6;
  // Presence is retained so even an empty forbidden runtime ceiling is rejected by policy.
  Strings runtime_actions = 8;
  repeated ObservationSource observations = 9;
  optional bool ongoing = 10;
}
message Objective {
  CreateObjectiveRequest definition = 1;
  string owner_tag_id = 2;
  string status = 3;
  double revision = 4;
  optional string completion_summary = 5;
  optional string execution_started_at = 6;
  optional string surface_task_id = 7;
  optional string surface_session_id = 8;
  double spent_minor = 9;
  double reserved_minor = 10;
  string created_at = 11;
  string updated_at = 12;
  ObservationState observation_state = 13;
  LimitState limit_state = 14;
  // Set when an operator cancelled the Objective.
  optional string cancelled_at = 15;
  optional string cancellation_reason = 16;
}
message BudgetWarning { double fraction = 1; double limit_minor = 2; double spent_minor = 3; string at = 4; }
message BudgetExhaustion { double limit_minor = 1; double spent_minor = 2; string at = 3; }
message DeadlineWarning { uint32 minutes_before = 1; string deadline = 2; string at = 3; }
message DeadlineObservation { string deadline = 1; string at = 2; }
message ReportedSpend { double amount_minor = 1; string currency = 2; repeated string unknown_attempt_ids = 3; string observed_at = 4; }
// System-maintained limit observations; each entry names the limit it was observed against.
message LimitState {
  ReportedSpend reported_spend = 1;
  repeated BudgetWarning budget_warnings = 2;
  BudgetExhaustion budget_exhausted = 3;
  repeated DeadlineWarning deadline_warnings = 4;
  DeadlineObservation deadline_passed = 5;
  DeadlineObservation deadline_set_at = 6;
}
message ObjectiveList { repeated Objective items = 1; }
message UpdateObjectiveStatusRequest { string id = 1; optional string status = 2; double expected_revision = 3; optional string completion_summary = 4; optional double budget_limit_minor = 5; }
// A Team's channel; its ID is the Team ID and every field except created_at is read from the Team.
message Workstream {
  string id = 1;
  string objective_id = 2;
  // The Team name.
  string title = 3;
  // The Team lead.
  string owner_tag_id = 4;
  // The Team's members, including its lead.
  repeated string participant_tag_ids = 5;
  string created_at = 6;
  string updated_at = 7;
}
message WorkstreamList { repeated Workstream items = 1; }
// type is note (default), question, blocker, evidence, or decision; to names Tags in the Team.
message PostWorkstreamRequest { string id = 1; string body = 2; repeated string references = 3; optional string reply_to = 4; string idempotency_key = 5; optional string type = 6; repeated string to = 7; }
message Post { string id = 1; string workstream_id = 2; optional string author_tag_id = 3; string body = 4; repeated string references = 5; optional string reply_to = 6; double sequence = 7; string created_at = 8; string idempotency_key = 9; optional string source_task_id = 10; string type = 11; repeated string to = 12; string objective_id = 13; }
message WorkstreamPostsRequest { string id = 1; optional double after_sequence = 2; optional uint32 limit = 3; }
message PostList { repeated Post items = 1; }
