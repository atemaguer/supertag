[[permission]]
identifier = "gateway-client"
description = "Connect to a Gateway and read or send personal conversation messages and save Task result files."
commands.allow = [
  "connect_gateway",
  "disconnect_gateway",
  "start_gateway_watch",
  "stop_gateway_watch",
  "list_tags",
  "list_conversations",
  "list_messages",
  "send_message",
  "get_message",
  "list_message_events",
  "save_result_artifact",
]
