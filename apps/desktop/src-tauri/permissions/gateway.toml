[[permission]]
identifier = "gateway-client"
description = "Connect to a saved or the local Gateway, set SuperTag up on this machine with the supertag CLI, start the local services when they are set up but stopped, restart them with the app's own CLI when they run an older release, and check that the supertag CLI matches the app, create Tags, add a folder of this machine as a Workspace of the local services with the supertag CLI, read, follow or send personal conversation messages and why a sent one waits, list and delete a Tag's notes, read a Tag's activity and network log, read a running Task's files on this machine, read, pause, resume and delete a Tag's Schedules, cache what it shows on launch, and save Task result files."
commands.allow = [
  "list_gateways",
  "save_gateway",
  "connect_local_gateway",
  "local_start_needed",
  "start_local_services",
  "local_cli_problem",
  "local_gateway_upgrade",
  "restart_local_services",
  "select_gateway",
  "clear_gateway",
  "start_gateway_watch",
  "stop_gateway_watch",
  "list_tags",
  "list_notes",
  "delete_note",
  "list_network_logs",
  "locate_task_files",
  "list_task_files",
  "read_task_file",
  "reveal_task_file",
  "tag_activity",
  "list_schedules",
  "change_schedule",
  "list_tag_options",
  "create_tag",
  "list_conversations",
  "list_messages",
  "send_message",
  "get_message",
  "list_task_events",
  "start_conversation_follow",
  "stop_conversation_follow",
  "mark_conversation_read",
  "read_cache",
  "write_cache",
  "check_setup",
  "choose_project_folder",
  "add_local_workspace",
  "set_up_supertag",
]
