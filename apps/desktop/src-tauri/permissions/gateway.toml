[[permission]]
identifier = "gateway-client"
description = "Connect to a saved or the local Gateway, start the local services when they are set up but stopped, create Tags, read, follow or send personal conversation messages and why a sent one waits, list and delete a Tag's notes, read a Tag's activity and network log, read a running Task's files on this machine, read, pause, resume and delete a Tag's Schedules, cache what it shows on launch, and save Task result files."
commands.allow = [
  "list_gateways",
  "save_gateway",
  "connect_local_gateway",
  "local_start_needed",
  "start_local_services",
  "select_gateway",
  "clear_gateway",
  "start_gateway_watch",
  "stop_gateway_watch",
  "list_tags",
  "list_notes",
  "delete_note",
  "list_network_logs",
  "locate_task_files",
  "list_task_files",
  "read_task_file",
  "reveal_task_file",
  "tag_activity",
  "list_schedules",
  "change_schedule",
  "list_tag_options",
  "create_tag",
  "list_conversations",
  "list_messages",
  "send_message",
  "get_message",
  "list_task_events",
  "start_conversation_follow",
  "stop_conversation_follow",
  "mark_conversation_read",
  "read_cache",
  "write_cache",
]
