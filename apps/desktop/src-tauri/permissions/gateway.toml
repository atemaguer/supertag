[[permission]]
identifier = "gateway-client"
description = "Connect to a saved or the local Gateway, create Tags, read, follow or send personal conversation messages and why a sent one waits, list and delete a Tag's notes, read a Tag's network log, cache what it shows on launch, and save Task result files."
commands.allow = [
  "list_gateways",
  "save_gateway",
  "connect_local_gateway",
  "select_gateway",
  "clear_gateway",
  "start_gateway_watch",
  "stop_gateway_watch",
  "list_tags",
  "list_notes",
  "delete_note",
  "list_network_logs",
  "list_tag_options",
  "create_tag",
  "list_conversations",
  "list_messages",
  "send_message",
  "get_message",
  "list_task_events",
  "start_conversation_follow",
  "stop_conversation_follow",
  "mark_conversation_read",
  "read_cache",
  "write_cache",
  "save_result_artifact",
]
