[[permission]]
identifier = "control-plane-client"
description = "Connect to a saved or the local Control Plane, create Tags, read, follow or send personal conversation messages and why a sent one waits, list and delete a Tag's notes, cache what it shows on launch, and save Task result files."
commands.allow = [
  "list_control_planes",
  "save_control_plane",
  "connect_local_control_plane",
  "select_control_plane",
  "clear_control_plane",
  "start_control_plane_watch",
  "stop_control_plane_watch",
  "list_tags",
  "list_notes",
  "delete_note",
  "list_tag_options",
  "create_tag",
  "list_conversations",
  "list_messages",
  "send_message",
  "get_message",
  "list_task_events",
  "start_conversation_follow",
  "stop_conversation_follow",
  "mark_conversation_read",
  "read_cache",
  "write_cache",
  "save_result_artifact",
]
