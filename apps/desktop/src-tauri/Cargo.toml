[package]
name = "supertag-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
publish = false
license = "Apache-2.0"

[workspace]

[lib]
name = "supertag_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
supertag-protocol = { path = "../../../rust/crates/protocol" }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "time"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }

[dev-dependencies]
serde_json = "1"
tauri = { version = "2", features = ["test"] }
supertag-control-plane = { path = "../../../rust/crates/control-plane" }
supertag-gateway = { path = "../../../rust/crates/gateway" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
